<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--void:#1A2226;--sunk:#151C1F;--panel:#232D32;--line:#37464D;--text:#E9F0EE;--dim:#97A9A5;--signal:#5EEAD4;--accent-bg:#1D403A;--accent-line:#3F8879;
--cf:#202124;--ct:#35363a;--cbox:#202124;--ctx:#e8eaed;--cic:#c4c7c5;--cdim:#9aa0a6}
*{box-sizing:border-box}
body{margin:0;background:#0d1214;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;color:var(--text)}
.win{position:absolute;inset:16px;border-radius:18px;background:var(--void);overflow:hidden;display:grid;grid-template-rows:64px 1fr;border:1px solid #000}
.head{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:2px solid var(--accent-line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--accent-line);display:grid;place-items:center;font-size:20px}
.head b{font-size:20px}
.main{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.nav{padding:18px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.nav span{padding:12px 14px;border-radius:10px;color:var(--dim);font-size:15px}
.nav span.on{background:var(--accent-bg);color:var(--signal);font-weight:700}
/* ── 크롬 틀 ── */
.cr{position:relative;display:grid;grid-template-rows:auto auto auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0;background:var(--cf);font-family:'Segoe UI','Noto Sans KR',system-ui,sans-serif}
svg.i{width:20px;height:20px;fill:var(--cic);flex:none}
svg.i.s{width:16px;height:16px}
.tabs{display:flex;align-items:flex-end;height:38px;padding:0 8px;background:var(--cf);gap:0}
.tab{position:relative;height:32px;width:230px;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:12px;color:var(--cdim);border-radius:8px 8px 0 0}
.tab+.tab::before{content:'';position:absolute;left:0;top:9px;height:16px;width:1px;background:#5f6368}
.tab.on{background:var(--ct);color:var(--ctx)}
.tab.on::before,.tab.on+.tab::before{display:none}
.tab.on::after{content:'';position:absolute;bottom:0;left:-8px;right:-8px;height:8px;background:radial-gradient(circle at 0 0,transparent 8px,var(--ct) 8.5px) left/8px 8px no-repeat,radial-gradient(circle at 100% 0,transparent 8px,var(--ct) 8.5px) right/8px 8px no-repeat;pointer-events:none}
.tab .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg.i{width:16px;height:16px;fill:var(--cdim)}
.tabs .plus{margin:0 0 6px 6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.tabs .plus svg{fill:var(--cic)}
.tabs .sp{flex:1}
.tabs .dd{margin-bottom:6px;width:28px;height:28px;display:grid;place-items:center}
.tool{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;background:var(--ct)}
.tb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.tb.off svg{fill:#5f6368}
.omni{flex:1;min-width:0;height:30px;border-radius:15px;background:var(--cbox);display:flex;align-items:center;gap:10px;padding:0 6px 0 4px;margin:0 6px;font-size:14px;color:var(--cdim);white-space:nowrap;overflow:hidden}
.omni .ti{width:24px;height:24px;border-radius:50%;background:#303134;display:grid;place-items:center;flex:none}
.omni .ti svg{width:14px;height:14px}
.omni .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.omni .u b{font-weight:400;color:var(--ctx)}
.prof{width:28px;height:28px;border-radius:50%;background:#5f6368;display:grid;place-items:center;margin:0 4px;overflow:hidden;flex:none}.prof img{width:100%;height:100%;image-rendering:pixelated;background:#cfe0f7}.prof svg{width:20px;height:20px;fill:#e8eaed}
.lgn{position:absolute;right:10px;top:84px;width:300px;background:#292a2d;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:18px;color:#e8eaed;font:13px "Noto Sans KR",sans-serif;z-index:5}
.lgn h4{margin:0 0 4px;font-size:15px}.lgn p{margin:0 0 14px;color:#9aa0a6;font-size:12px;line-height:1.5}
.lgn .fc{display:flex;align-items:center;gap:12px;margin-bottom:12px}.lgn .fc img{width:56px;height:56px;border-radius:50%;image-rendering:pixelated;background:#cfe0f7}
.lgn .in{height:36px;border:1px solid #5f6368;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#e8eaed}
.lgn .b1{margin-top:10px;height:36px;border-radius:18px;background:#8ab4f8;color:#202124;font-weight:700;display:grid;place-items:center}
.lgn hr{border:0;border-top:1px solid #3c4043;margin:16px 0}
.lgn .b2{height:36px;border-radius:18px;border:1px solid #5f6368;display:grid;place-items:center;color:#8ab4f8;font-weight:600}
.lgn small{display:block;margin-top:8px;color:#9aa0a6;font-size:11.5px;line-height:1.5}
.phone .lgn{right:8px;left:8px;width:auto;top:120px}
.bms{display:flex;align-items:center;gap:2px;height:30px;padding:0 8px;background:var(--ct);border-bottom:1px solid #4a4c50;overflow:hidden}
.bm{display:flex;align-items:center;gap:7px;padding:0 8px;height:24px;border-radius:12px;font-size:12px;color:var(--ctx);white-space:nowrap}
.bms .sp{flex:1}
.fv{width:16px;height:16px;flex:none}
.page{overflow:auto;min-height:0;background:#fff}
/* 휴대폰 크롬 */
.phone .win{inset:0;border-radius:0;grid-template-rows:56px 1fr}
.phone .main{grid-template-columns:minmax(0,1fr)}
.phone .nav,.phone .tabs,.phone .pc{display:none}
.phone .cr{grid-template-rows:auto auto 1fr}
.phone .tool{height:56px;padding:0 6px}
.phone .omni{height:40px;border-radius:20px;background:#3c3c3f;margin:0 4px;font-size:15px}
.tabn{width:22px;height:22px;border:2px solid var(--cic);border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--cic);margin:0 6px}
.mo{display:none}.phone .mo{display:grid}
.phone .bms{height:34px;overflow-x:auto;scrollbar-width:none}
/* ── 시작(새 탭) ── */
.ntp{background:#202124;color:var(--ctx);min-height:100%;display:flex;flex-direction:column;align-items:center;padding:90px 20px 40px}
.ntp .lg{font:700 56px/1 'Segoe UI',sans-serif;letter-spacing:-2px;margin-bottom:28px}
.ntp .lg span:nth-child(1){color:#8ab4f8}.ntp .lg span:nth-child(2){color:#f28b82}.ntp .lg span:nth-child(3){color:#fdd663}.ntp .lg span:nth-child(4){color:#81c995}
.ntp .q{width:min(580px,100%);height:46px;border-radius:23px;background:#303134;display:flex;align-items:center;gap:14px;padding:0 18px;color:var(--cdim);font-size:15px}
.ntp .sc{display:grid;grid-template-columns:repeat(5,112px);gap:4px;margin-top:34px}
.ntp .s{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 4px 12px;border-radius:6px;font-size:13px}
.ntp .s i{width:48px;height:48px;border-radius:50%;background:#35363a;display:grid;place-items:center}
.ntp .s i .fv{width:26px;height:26px}
.phone .ntp{padding-top:60px}.phone .ntp .sc{grid-template-columns:repeat(4,1fr);width:100%}.phone .ntp .lg{font-size:44px}

/* ── 괴담넷: 으스스한 후보 3가지 (변수) ── */
.gn{--bg:#c7ccc6;--bg2:#d6dad3;--card:#e4e7e1;--line:#a9b0a8;--ink:#1d2320;--dim:#5f6862;--hd:#28302c;--hdi:#d9e0da;--ac:#2f6b5f;--red:#8e2b2b;--chip:#cfd4cd;
 background:var(--bg) radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.35),transparent 60%);color:var(--ink);min-height:100%;font:14px 'Pretendard','Noto Sans KR',sans-serif}
.gn.vB{--bg:#d9d0bc;--bg2:#e3dbc9;--card:#ece5d5;--line:#b8ab90;--ink:#2a221c;--dim:#6e6253;--hd:#2e2620;--hdi:#e9dfc9;--ac:#7a2e22;--red:#9c2a1e;--chip:#ddd3bf;
 background:var(--bg) repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 4px)}
.gn.vC{--bg:#1f2a29;--bg2:#263332;--card:#2b3a38;--line:#3b4d4a;--ink:#d8e2df;--dim:#8ea19c;--hd:#141c1b;--hdi:#cfe0db;--ac:#7fd1bf;--red:#e06a6a;--chip:#33443f;
 background:var(--bg) radial-gradient(ellipse at 50% 0%,rgba(127,209,191,.08),transparent 60%)}
.gn .hd{display:flex;align-items:center;gap:26px;height:58px;padding:0 28px;background:var(--hd);color:var(--hdi);border-bottom:3px solid var(--red)}
.gn .hd .lg{font-weight:900;font-size:21px;color:var(--hdi);letter-spacing:-.6px;display:flex;align-items:center;gap:8px}
.gn .hd .lg small{color:var(--hdi)!important;opacity:.5}
.gn .hd nav{display:flex;gap:20px;color:var(--hdi);opacity:.75;font-size:14px;font-weight:600}.gn .hd nav b{opacity:1}
.gn .hd .sr{margin-left:auto;width:280px;height:34px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--hdi);opacity:.7;font-size:13px}
.gn .hd .sr svg{fill:var(--hdi)}
.gn .wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;padding:20px 28px;max-width:1200px}
.gn .side{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px;align-self:start}
.gn .side a{display:block;padding:8px 12px;color:var(--dim);font-size:13.5px;border-radius:3px}
.gn .side a.on{background:var(--hd);color:var(--hdi);font-weight:800}
.gn .side h6{margin:10px 12px 4px;font-size:11px;color:var(--dim);opacity:.8;font-weight:700;letter-spacing:.05em}
.gn .gmain{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.gn .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gn .bh h2{margin:0;font-size:19px}
.gn .bh .w{padding:7px 14px;border-radius:3px;background:var(--red);color:#fff;font-weight:800;font-size:13px}
.gn .sort{display:flex;gap:14px;font-size:13px;color:var(--dim);padding:6px 0 10px;border-bottom:2px solid var(--ink)}.gn .sort b{color:var(--ink)}
.gn .row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:14px;padding:12px 4px;border-bottom:1px dashed var(--line);align-items:center}
.gn .row .c{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;background:var(--chip);color:var(--dim);margin-right:6px;vertical-align:1px;font-weight:700}
.gn .row .c.hot{background:var(--red);color:#fff}
.gn .row .tt{font-size:14.5px;color:var(--ink)}.gn .row .tt em{font-style:normal;color:var(--red);font-size:12px;margin-left:5px;font-weight:800}
.gn .row small{display:block;margin-top:5px;font-size:12px;color:var(--dim)}
.gn .row .th{width:54px;height:54px;border-radius:3px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);filter:grayscale(.35) contrast(1.05)}
.gn .row .th img{width:42px;height:42px;image-rendering:pixelated}
.gn .pg{display:flex;gap:6px;justify-content:center;padding:18px 0 4px;font-size:13px;color:var(--dim)}.gn .pg b{color:#fff;background:var(--red);border-radius:2px;padding:0 7px}
.phone .gn .wrap{grid-template-columns:minmax(0,1fr);padding:10px}.phone .gn .side,.phone .gn .hd nav{display:none}.phone .gn .hd{padding:0 12px;gap:10px}.phone .gn .hd .sr{width:auto;flex:1}.phone .gn .gmain{padding:12px 14px}
/* ── 괴담갤: 디시인사이드 갤러리 모양 ── */
.dc{background:#fff;color:#333;min-height:100%;font:12.5px 'Nanum Gothic','Noto Sans KR','Dotum',sans-serif;min-width:1000px}
.dc a{color:inherit;text-decoration:none}
.dc .gnb0{opacity:.55;display:flex;justify-content:flex-end;gap:12px;padding:6px 0;width:1000px;margin:0 auto;color:#666;font-size:12px}
.dc .hd{display:flex;align-items:center;gap:24px;height:46px;padding:0 max(16px,calc((100% - 1000px)/2));background:#3b4890}
.dc .hd .lg{font:900 19px/1 'Noto Sans KR',sans-serif;color:#fff;letter-spacing:-.5px}
.dc .hd .lg small{font:500 12px 'Noto Sans KR';color:#cfd5f5;letter-spacing:0;margin-left:8px}
.dc .hd .sch{display:flex;border:2px solid #fff;height:30px;width:320px;background:#fff;margin-left:auto}
.dc .hd .sch span{flex:1;padding:0 10px;line-height:26px;color:#999}
.dc .hd .sch b{width:36px;background:#29367c;display:grid;place-items:center}
.dc .hd .sch b svg{fill:#fff;width:20px;height:20px}
.dc .gnb{background:#3b4890;height:37px}
.dc .gnb ul{width:1000px;margin:0 auto;padding:0;list-style:none;display:flex;height:100%}
.dc .gnb li{padding:0 14px;line-height:37px;color:#fff;font-weight:700;font-size:13px}
.dc .gnb li.on{background:#29367c}
.dc .gnb li+li{border-left:1px solid #4c5aa1}
.dc .body{width:1000px;margin:0 auto;padding-top:10px}
.dc .gt{display:flex;align-items:baseline;gap:8px;padding-bottom:6px}
.dc .gt h2{margin:0;font-size:19px;color:#29367c;letter-spacing:-1px}
.dc .gt .info{font-size:11px;color:#999}
.dc .gt .ic{margin-left:auto;display:flex;gap:4px}.dc .gt .ic span{border:1px solid #ccc;padding:2px 6px;font-size:11px;color:#666}
.dc .lt{display:flex;align-items:center;gap:0;margin:0}
.dc .lt span{padding:6px 12px;border:1px solid #cfd2e0;border-left:0;background:#f7f7f9;color:#555;font-weight:700}
.dc .lt span:first-child{border-left:1px solid #cfd2e0}
.dc .lt span.on{background:#3b4890;color:#fff;border-color:#3b4890}
.dc .lt .wr{margin-left:auto;padding:6px 14px;background:#3b4890;color:#fff;font-weight:700;border:1px solid #29367c}
.dc .hds{display:flex;gap:4px;margin:8px 0 6px;flex-wrap:wrap}.dc .hds span{border:1px solid #d6d8e2;padding:3px 8px;color:#555;background:#fff}.dc .hds span.on{border-color:#3b4890;color:#3b4890;font-weight:700}
.dc table{width:100%;border-collapse:collapse;table-layout:fixed;border-top:2px solid #3b4890}
.dc th{height:32px;font-weight:400;color:#333;border-bottom:1px solid #3b4890}
.dc td{height:31px;border-bottom:1px solid #eee;text-align:center;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc td.t{text-align:left;color:#333;padding-left:4px}
.dc td.t .ii{display:inline-block;width:14px;height:14px;margin-right:5px;vertical-align:-3px;border-radius:2px}
.dc .ii.tx{background:linear-gradient(#fff 0 0) 3px 4px/8px 1px no-repeat,linear-gradient(#fff 0 0) 3px 7px/8px 1px no-repeat,linear-gradient(#fff 0 0) 3px 10px/6px 1px no-repeat,#8d93b4}
.dc .ii.im{background:radial-gradient(circle at 10px 4px,#fff 1.5px,transparent 2px),linear-gradient(135deg,transparent 55%,#fff 56%) 0 0/100% 100%,#3cb46e}
.dc .ii.bt{background:radial-gradient(circle,#fff 3px,transparent 3.5px),#ef4f4f}
.dc td.t em{font-style:normal;color:#3b4890;font-weight:700;margin-left:4px;font-size:11px}
.dc td.n .ip{color:#999;font-size:11px}
.dc td.n .fix{display:inline-block;width:12px;height:12px;border-radius:2px;background:#6b7bd0;margin-left:3px;vertical-align:-2px}
.dc tr.ntc td{background:#f5f6fb}.dc tr.ntc td.t{font-weight:700;color:#29367c}
.dc tr.ntc .sb{color:#3b4890;font-weight:700}
.dc .bt2{display:flex;justify-content:space-between;margin-top:10px}.dc .bt2 span{border:1px solid #ccc;padding:5px 12px;background:#f8f8f8;font-weight:700}.dc .bt2 .wr{background:#3b4890;color:#fff;border-color:#29367c}
.dc .pager{text-align:center;margin:18px 0 10px;font-size:13px;color:#333;word-spacing:8px}.dc .pager b{color:#3b4890;text-decoration:underline}
.dc .bsch{display:flex;justify-content:center;gap:4px;margin-bottom:30px}.dc .bsch span{border:1px solid #ccc;padding:5px 10px}.dc .bsch .in{width:200px}.dc .bsch .go{background:#3b4890;color:#fff;border-color:#29367c}
.dc .rbox{border:1px solid #d6d8e2;margin-bottom:12px}
.dc .rbox h5{margin:0;padding:8px 10px;background:#f3f4f9;border-bottom:1px solid #d6d8e2;font-size:12px;color:#29367c}
.dc .login{padding:12px;display:grid;gap:6px}.dc .login span{border:1px solid #ccc;padding:6px;color:#aaa}.dc .login b{background:#3b4890;color:#fff;text-align:center;padding:8px}
.dc .rbox ul{margin:0;padding:8px 10px;list-style:none}.dc .rbox li{padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}.dc .rbox li em{font-style:normal;color:#3b4890;font-weight:700;margin-right:6px}
.dc .ad{height:250px;background:repeating-linear-gradient(45deg,#f4f4f4 0 10px,#ececec 10px 20px);display:grid;place-items:center;color:#aaa;font-size:11px}
.dc .ft{border-top:1px solid #ddd;margin-top:10px;padding:16px 0;text-align:center;color:#999;font-size:11px}
/* 디시 모바일 */
.phone .dc{min-width:0}
.phone .dc .gnb0,.phone .dc .gnb,.phone .dc .rail,.phone .dc .hd .sch,.phone .dc .hds,.phone .dc .gt .ic{display:none}
.phone .dc .hd{width:auto;height:48px;padding:0 12px;background:#3b4890}.phone .dc .hd .lg{color:#fff;font-size:17px}.phone .dc .hd .lg small{display:none}
.phone .dc .body{width:auto;display:block;padding:0}
.phone .dc .gt{padding:12px;border-bottom:1px solid #3b4890}
.phone .dc .lt{margin:0;padding:8px 12px;border-bottom:1px solid #eee}
.phone .dc table{display:none}
.mlist{display:none}.phone .mlist{display:block}
.mlist .it{padding:10px 12px;border-bottom:1px solid #eee}
.mlist .it .t{font-size:14px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mlist .it .t em{font-style:normal;color:#3b4890;font-weight:700;margin-left:4px;font-size:12px}
.mlist .it .m{font-size:11.5px;color:#999;margin-top:4px}
.mlist .it.ntc .t{color:#29367c;font-weight:700}
.phone .dc .bt2{padding:0 12px}.phone .dc .bsch{display:none}

/* ── 세정게: 2000년대 제로보드 ── */
.wp{background:#fff;color:#000;min-height:100%;font:12px 'Gulim','굴림','Noto Sans KR',sans-serif}
.wp .pg{background:#fff;min-height:100%}
.wp .ban{height:86px;background:linear-gradient(90deg,#0c1a3a,#24447a 55%,#0c1a3a);position:relative;overflow:hidden;border-bottom:3px solid #b00}
.wp .ban b{position:absolute;left:18px;top:14px;font:900 30px 'Batang','Noto Serif KR',serif;color:#fff;letter-spacing:4px;text-shadow:2px 2px 0 #000}
.wp .ban small{position:absolute;left:20px;top:56px;color:#ffd24a;font:bold 11px Verdana,sans-serif;letter-spacing:2px}
.wp .ban .globe{position:absolute;right:20px;top:8px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fd0ff,#1a5aa8 60%,#0a2550);box-shadow:0 0 0 2px #000}
.wp .ban .globe::after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(255,255,255,.35) 11px 12px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.25) 11px 12px)}
.wp .bar{background:#dcdcdc;border-bottom:1px solid #999;padding:4px 8px;font-size:11px}
.wp .bar a{color:#00007a;margin-right:10px}
.wp .cols{display:grid;grid-template-columns:150px 1fr}
.wp .lm{background:#f2f2f2;border-right:1px solid #bbb;padding:8px}
.wp .lm .t{background:#5a5a7a;color:#fff;font-weight:bold;padding:3px 6px;margin-bottom:4px}
.wp .lm a{display:block;padding:3px 2px;color:#000;border-bottom:1px dotted #aaa}
.wp .lm a::before{content:'▶ ';color:#b00;font-size:9px}
.wp .lm .cnt{margin-top:10px;border:1px solid #999;background:#fff;padding:5px;font-size:11px;line-height:1.6}
.wp .lm .cnt span{font-family:'Courier New',monospace;background:#000;color:#0f0;padding:0 3px}
.wp .lm .poll{margin-top:10px;border:1px solid #999;background:#fff;padding:5px;font-size:11px;line-height:1.7}

<h2 class="wh"><span class="no">1.</span> 개요</h2>
<p>이름은 세계정치 게시판인데 세계 정치 이야기는 거의 없다. 대신 인터넷에서 손꼽히게 <b>음모론 밀도가 높은 곳</b>이다. 딥스테이트, 외계인, 뇌 기생충, 로또 조작 같은 글이 하루에도 수십 개씩 올라온다. 바깥세상의 평판은 한 줄로 요약된다. &quot;거기 미친 사람들 모이는 데잖아.&quot;</p>
<p>그 평판이 숨기고 있는 사실이 있다. 거기 올라오는 글의 <b>상당 부분이 진짜</b>라는 것이다. 세정게 단골 중 상당수는 실제 괴담을 겪고 살아 나온 생존자들이고, 자기가 본 걸 여기에 털어놓는다. 문제는 진짜 증언과 지어낸 글이 거의 똑같이 생겼다는 것. 그래서 둘 다 똑같이 조롱받는다. 뇌 기생충 대처법 글 바로 아래에 진짜 괴담 생존기가 올라와 있고, 둘 다 댓글이 &quot;약 먹어라&quot;다. 진짜 생존자들이 굳이 이런 데 글을 쓰는 이유는 간단하다. 다른 데서는 아예 안 들어 주기 때문이다. 정신과 상담실에서 못 한 이야기를, 경찰서에서 비웃음당한 이야기를, 여기서는 최소한 끝까지 읽는 사람이 있다.<sup class="fn">[1]</sup></p>
<p>그런데도 이면세계를 아는 사람들은 세정게를 꾸준히 본다. 진짜 현상에 대한 제보가 어느 조직이 공식적으로 인정하기 <b>몇 년 전에</b> 세정게에 먼저 올라오는 경우가 많기 때문이다. 미친 소리 사이에 섞인 진짜 경보를 걸러 내는 게 이 게시판을 읽는 기술이다.</p>
<h2 class="wh"><span class="no">2.</span> 게시판 풍경</h2>
<h3 class="wh"><span class="no">2.1.</span> 대표적인 글</h3>
<p>세정게 첫 페이지를 열면 대충 이런 글들이 있다. 뇌 기생충 대처법. 대한민국 대통령은 건국 이래 줄곧 누군가에게 조종당하고 있다는 장문의 분석. 딥웹에서 구했다는 걸프전 UFO 영상 모음. 자동 검열을 피하려고 단어 중간중간에 마침표를 찍어 쓴 글. 도청하는 요원들에게 보내는 욕설. 그리고 귀에 장치가 심어졌다고 호소하는데 아무도 댓글을 안 다는 글.</p>
<blockquote>괴.담 겪.은 사.람 있.으.면 연.락 좀. 검.색.어 걸.리.면 안. 됨.<cite>— 세정게에서 흔히 보이는 마침표 화법 게시글</cite></blockquote>
<p>이 마침표 화법은 처음 보면 웃기다. 세정게를 좀 다녀 본 사람은 안 웃는다. 이유는 아래 감시 절을 보면 안다.<s>맞춤법 검사기는 웃는다</s></p>
<h3 class="wh"><span class="no">2.2.</span> 실종 개그</h3>
<p>세정게의 가장 오래된 농담은 <b>&quot;고정닉들이 자꾸 사라진다&quot;</b>는 것이다. 어제까지 글 쓰던 사람이 오늘부터 안 보인다. 처음엔 다들 탈퇴했겠거니 한다. 그다음엔 &quot;또 끌려갔냐&quot;는 댓글이 달린다. 이 농담이 문제인 건, 정확하기 때문이다.</p>
<p>사라지는 경로는 대략 셋이다. 검은 정장들에게 끌려가거나, 지오캐싱을 하다 죽거나, 나머지는 이 바닥의 오래된 법칙을 따른다. <b>이상한 건 이상한 걸 끌어당긴다.</b> 한 번 괴담을 겪은 사람은 또 겪는다. 세정게 단골들은 이 법칙을 자기 경험으로 안다. 두 번째 괴담 생존기를 올리는 사람에게 축하와 애도가 동시에 달리는 곳은 아마 여기밖에 없을 것이다.<sup class="fn">[2]</sup></p>
<h2 class="wh"><span class="no">3.</span> 이용자 구조</h2>
<h3 class="wh"><span class="no">3.1.</span> 유동</h3>
<p>익명의 대다수. 구경꾼, 비웃으러 온 사람, 그리고 딱 한 번 자기 경험을 털어놓고 다시는 언급하지 않는 일회성 생존자들. 이 일회성 글이 사실 세정게에서 가장 귀한 정보인 경우가 많은데, 정작 글쓴이는 그 뒤로 영영 돌아오지 않는다. 돌아오지 않는 이유가 평범하기를 다들 바란다.<sup class="fn">[3]</sup></p>
<h3 class="wh"><span class="no">3.2.</span> 고정닉</h3>
<p>고정 닉네임으로 활동하며 글 기록이 차곡차곡 쌓이는 사람들. 위험을 모르거나, 아니면 자기를 숨기는 데 아주 능숙하거나 둘 중 하나다. 세정게의 터줏대감 이미지를 만드는 건 이 사람들인데, 앞서 말한 실종 개그의 주인공도 대부분 이 사람들이다.</p>
<h3 class="wh"><span class="no">3.3.</span> 진짜 고인물</h3>
<p>게시판 닉네임은 그대로 두되, 실제 대화는 <b>초대제 비밀 메신저</b>에서 나누는 핵심층. 이 사람들은 전원이 최소 한 번은 진짜 괴담에서 살아 나왔다. 게시판에 남는 건 일부러 흘린 흔적뿐이고, 진짜 이야기는 다 메신저 안에 있다.</p>
<p>이 핵심층에 닿는 방법에 대해서는 반쯤 전설 같은 소문이 돈다. 진짜 아는 사람만 쓸 수 있는 글을 올리고, 그 글이 지워지기를 기다리라는 것이다. 맞는 사람들의 눈에 들면 방명록에 수상한 링크 하나가 달린다고 한다. 다만 그 링크를 기다리다 엉뚱한 방문객을 먼저 맞은 사람이 더 많다는 말도 같이 돈다.</p>
<h3 class="wh"><span class="no">3.4.</span> 부매니저</h3>
<p>게시판의 눈에 보이는 관리자. 위험하게 노출된 글을 지우고, 모임을 대표해 협상에 나선다. 이름도, 방법도, 가진 정보의 양도 철저히 숨긴다. 세정게에서 제일 바쁜 사람이라는 평이 있다. 하루 종일 지우고, 지우고, 또 지운다. 쓸 만한 글일수록 몇 분 만에 사라지는데, 그게 다 이 사람 손을 거친다.<sup class="fn">[4]</sup></p>
<h2 class="wh"><span class="no">4.</span> 생존자 모임</h2>
<p>세정게의 진짜 주인은 게시판이 아니라 그 뒤에 있는 <b>생존자 모임</b>이다. 이 모임은 인터넷 게시판이 생기기 전부터 있었고, 지금은 세정게를 공개 집합 장소로 쓰고 있을 뿐이다. 게시판 개설보다 모임의 역사가 훨씬 길다는 이야기를 처음 들은 사람들은 대개 놀란다.</p>
<p>모임의 원칙은 단순하다. <b>이면세계에 닿지 않은 사람은 아무것도 모르는 게 제일 안전하다. 하지만 이미 닿은 사람은 정보 없이는 죽는다.</b> 그래서 모임은 살아남기 위해 이면세계 정보를 모으고, 필요하면 그 정보로 거래한다. 회원끼리의 의리는 진짜다. 살아남는 데 꼭 필요한 정보를 얻은 사람은 그걸 모임에 넘긴다. 자기가 먼저 안전해지기 전에.</p>
<p>바깥 사람과 거래할 때 모임이 원하는 건 대개 두 가지다. 특정 괴담의 해결, 그리고 실종된 회원의 회수. 대가는 모아 둔 정보다. 조건도 하나 있다. 회원이나 연락 경로를 추적하지 말 것. 이걸 어기거나 링크를 밖으로 흘리면 최소한 관계가 끝난다. 최소한.<s>최대한은 안 물어보는 게 좋다</s></p>
<h2 class="wh"><span class="no">5.</span> 지오캐싱</h2>
<p>모임의 상징이자 게시판보다 오래된 전통. 게시판 글이나 실제 장소에 <b>알쏭달쏭한 암호</b>가 남겨지고, 그걸 풀면 좌표가 나온다. 그 좌표에는 선배 회원들이 묻어 둔 기록, 이상한 물건, 게시판에 대놓고 올리기엔 너무 위험한 정보가 있다. 세정게 글 중에 아무 의미 없어 보이는 숫자 나열이 가끔 섞여 있는 이유가 이거다.</p>
<p>그리고 이 전통은 <b>사람을 죽인다.</b> 좌표에서 기다리는 게 전부 보물 상자는 아니기 때문이다. 한번은 핵심층 팀 하나가 지오캐싱에 나섰다가 통째로 사라졌다. 나중에 수색대가 그 좌표에 갔을 때, 팀원들의 시신이 그 자리에 묻혀 있었고, 그 위로 기이한 공간이 닫혀 가고 있었다고 한다. 수색대는 간신히 빠져나왔다. 그 좌표가 어디였는지는 이제 모임 안에서도 입에 올리지 않는다.</p>
<blockquote>좌표 찍힌 데 가 보니까 땅이 새로 덮여 있었어. 우리가 찾던 건 거기 있었어. 사람들이랑 같이.<cite>— 지오캐싱 수색대에 참여했던 회원</cite></blockquote>
<p>그 뒤로도 지오캐싱은 멈추지 않았다. 묻힌 정보 중에 사람 목숨을 살리는 것들이 진짜로 있기 때문이다. 세정게의 수수께끼 같은 숫자 글에 함부로 덤비지 말라는 경고가 첫 페이지 공지에 박혀 있는데, 그 공지를 읽고 오히려 호기심이 생겼다는 사람이 매년 나온다.<sup class="fn">[5]</sup></p>
<h2 class="wh"><span class="no">6.</span> 감시</h2>
<h3 class="wh"><span class="no">6.1.</span> 가짜 관리국</h3>
<p>세정게를 가장 위험하게 만드는 건 <a class="wl">가짜 관리국</a>이다. 저쪽은 이 게시판을 <b>모집 덫이자 유출 감지기</b>로 쓴다. 글쓴이만 보는 게 아니라 <b>읽는 사람까지</b> 본다. 괴이 영상을 올린 사람은 검색 기록으로 추적당하고, 며칠 안에 붙잡혀서 요원이 된다. 같은 키워드를 반복해서 검색하는 것만으로도 눈에 띌 수 있다. 세정게를 생각 없이 읽는 건 글을 쓰는 것만큼 위험하다. 앞서 말한 마침표 화법이 괜히 생긴 게 아니다.</p>
<p>대표적인 사례가 핵심층 출신의 <a class="wl">김성진</a>이다. <a class="wl">한설인육공장</a>에서 살아 나온 생존자로 모임에 정보를 넘기던 고정닉이었는데, 영상을 올린 뒤 그대로 끌려갔다. 고등학생이었던 <a class="wl">송진섭</a>도 길에서 본 괴이를 올렸다가 며칠 만에 사라졌다. 두 사람이 나중에 검은 정장 차림으로 목격되면서 세정게 실종 게시판에 이상한 종류의 &#x27;생존 확인&#x27; 글이 올라왔다.<sup class="fn">[6]</sup></p>
<h3 class="wh"><span class="no">6.2.</span> 관리국</h3>
<p><a class="wl">관리국</a>도 세정게를 본다. 더 넓은 인터넷 순찰의 일부로, 지금은 <a class="wl">잼트리</a> 선배요원이 맡고 있다고 한다. 하루 종일 모니터 앞에서 뇌 기생충 글과 대통령 조종설 글을 넘기다가 진짜를 하나 건져 내는 일이다.<sup class="fn">[7]</sup> 글이 진짜 현상을 그럴듯하게 묘사하면 현장 대응이 출동한다. 이걸 아는 사람들은 일부러 구조 요청 글을 올려 요원을 특정 장소로 부르기도 한다.</p>
<p>문제는 <b>두 관리국이 동시에 본다</b>는 것이다. 구조 요청 글을 올린 사람은 어느 쪽이 올지 고를 수 없다. 기다리던 검은 정장이 커피 이야기를 하는지 직급 이야기를 하는지는 문이 열리고 나서야 안다. 세정게 단골들은 이걸 <b>&quot;관리국 룰렛&quot;</b>이라고 부른다.<s>당첨 확률 50%. 꽝 상품: 취직</s></p>
<h2 class="wh"><span class="no">7.</span> 읽는 법</h2>
<p>세정게 고인물들이 신입에게 해 주는 조언은 대충 이렇다. 글의 말투로 진위를 판단하지 마라. 어처구니없이 들리는 글이 진짜일 수 있다. 쓸 만한 글은 몇 분 안에 지워지니까, 옛날 글을 검색하는 것보다 실시간으로 보는 게 중요하다. 그리고 검색창에 같은 단어를 반복해서 치지 마라.</p>
<p>이 조언을 듣고 &quot;그럼 결국 다 믿으라는 거냐&quot;고 묻는 신입에게 돌아오는 답은 늘 같다. 다 믿지도 말고 다 무시하지도 말라. 그 사이 어딘가에서 살아남는 법을 배우는 곳이 세정게다. 실제로 오래 버틴 고인물들은 글을 읽을 때 내용보다 세부를 본다고 한다. 냄새, 소리, 시간, 그 자리에 있던 사람만 알 수 있는 쓸데없이 구체적인 디테일. 지어낸 글은 무섭게 쓰려고 애쓰고, 진짜 글은 이상하게 담담하다는 게 고인물들의 감별법이다. 대통령 조종설 글은 무시해도 된다는 말에, 그건 또 모른다는 대댓글이 달리는 게 세정게다.<sup class="fn">[8]</sup></p>
<h2 class="wh"><span class="no">8.</span> 평판</h2>
<p>바깥에서는 웃음거리다. 이면세계 안에서는 <b>조기 경보 시스템</b>이다. 둘 다 맞다. 세정게가 미친 사람들의 게시판이라는 평판은, 사실 세정게를 지키는 가장 좋은 위장이기도 하다. 너무 많은 미친 소리 속에 진짜가 숨어 있으니 아무도 진지하게 안 본다. 진지하게 보는 건 두 관리국과, 살아남고 싶은 사람들뿐이다.</p>
<p>생존자 모임 사람들에게 세정게는 조금 더 무거운 의미다. 사라진 회원들의 마지막 글이 거기 남아 있다. 그 글에 지금도 가끔 &quot;잘 지내냐&quot;는 댓글이 달린다. 답글은 없다. 그래도 달린다. 세정게는 그런 곳이다.</p>
<h2 class="wh"><span class="no">9.</span> 여담</h2>
<ul><li>세정게 인기 글 1위는 수년째 &quot;뇌 기생충 자가 진단법&quot;이다. 2위가 진짜 괴담 생존기인데, 조회수 차이가 열 배다.</li></ul>
<ul><li>&quot;도청하는 요원들 보고 있냐?&quot;라는 글이 정기적으로 올라온다. 실제로 보고 있다. 양쪽 다.</li></ul>
<ul><li>귀에 장치가 심어졌다는 글은 아무도 댓글을 안 달지만, 핵심층 사람들은 가끔 그 글을 조용히 저장해 둔다는 소문이 있다.</li></ul>
<ul><li>걸프전 UFO 영상 모음은 거의 다 합성이라는 결론이 났다. 거의.</li></ul>
<ul><li>세정게 신입 환영 인사는 &quot;어서 와. 검색 기록부터 지워&quot;다.</li></ul>
<ul><li>게시판 이름에 &#x27;세계정치&#x27;가 들어간 이유를 아는 사람은 이제 아무도 없다. 처음 만든 사람이 진짜로 정치 얘기를 하고 싶었을 거라는 추측이 있는데, 그 사람도 실종 개그의 첫 페이지를 장식했다는 카더라가 있다.</li></ul><div class="fns"><div><span class="no">[1]</span> 반대로 진짜 괴담 생존기에 &amp;quot;약 먹어라&amp;quot;를 단 사람이 몇 년 뒤 같은 괴담을 겪고 사과글을 올리는 일도 꽤 있다. 그 사과글의 댓글도 &amp;quot;약 먹어라&amp;quot;다.</div><div><span class="no">[2]</span> 세정게에는 &amp;quot;마지막 접속일&amp;quot; 정렬 기능을 쓰지 말라는 불문율이 있다. 써 보면 기분이 너무 안 좋아진다.</div><div><span class="no">[3]</span> 일회성 생존기 밑에 &amp;quot;후속 글 기다립니다&amp;quot;라는 댓글이 수십 개 달려 있는 걸 보면, 다들 사실 알고 있다는 게 느껴진다.</div><div><span class="no">[4]</span> 부매니저의 정체를 추적하려던 고정닉이 있었다는데, 그 고정닉이 그 뒤로 어떻게 됐는지는 실종 개그의 한 장을 차지한다.</div><div><span class="no">[5]</span> 공지를 쓴 사람은 &amp;quot;이걸 읽고 가는 놈은 말려도 간다&amp;quot;는 댓글을 스스로 달아 놨다.</div><div><span class="no">[6]</span> 실종 신고 글에 본인이 직접 &amp;quot;나 잘 있음ㅋㅋ&amp;quot;라는 댓글을 달았다는 카더라가 있다. 그 댓글은 부매니저가 3분 만에 지웠다.</div><div><span class="no">[7]</span> 세정게 글을 너무 많이 읽어서 가끔 사무실에서 마침표 화법으로 메시지를 보낸다는 카더라가 있다. 출처는 당연히 세정게다.</div><div><span class="no">[8]</span> 대통령 조종설 글쓴이는 십 년째 같은 글을 올리고 있다. 이 사람만은 아무도 안 끌어간다. 그게 오히려 진짜라는 증거라는 주장도 있다.</div></div><div class="rel"><b>관련 문서</b><a class="wl">관리국</a> · <a class="wl">가짜 관리국</a> · <a class="wl none">부매니저</a></div><details class="ref"><summary>참조 자료</summary><p>원본 충실 · 보통 · 메인 모델</p></details></div></div></div>`,
