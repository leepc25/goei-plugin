    </div>
    <b style="font-size: 17px;">괴이 <span style="color:#5EEAD4;font-weight:300;margin:0 .3em">ː</span><span style="color:#5EEAD4">ANOMALY</span></b>

    </div>
  </header>
  <div style="position: relative; min-height: 0; background: #0B0F11; display: grid; place-items: center; overflow: hidden;">
    <div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #10171A 0 18px, #0E1416 18px 36px); opacity: .7;"></div>
    <div style="position: absolute; left: 40px; top: 40px; font-family:'JetBrains Mono',monospace; font-size: 12px; color: #5C6E6A; letter-spacing: .14em;">게임 화면 (도트) — 출동 끝, 본부 복귀 직후</div>

    <div style="position: relative; width: 560px; padding: 26px 28px; border-radius: 20px; border: 1px solid #3F8879; background: #1A2226; box-shadow: 0 40px 80px -30px rgba(0,0,0,.65); display: flex; flex-direction: column; gap: 16px;">

        <span style="font-family:'JetBrains Mono',monospace; font-size: 12px; color: #97A9A5;">2025.05.10 19:02</span>
      </div>
      <div>
        <h2 style="margin: 0; font-size: 24px;">거울 속 사람 — 격리 완료</h2>
        <p style="margin: 6px 0 0; font-size: 14px; color: #BECBC8;">중림 지하상가 · 에일린 · 큐라스(경상) · 1시간 24분</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="padding: 10px 12px; border-radius: 14px; border: 1px solid #37464D; background: #232D32;"><div style="font-size: 12px; color: #97A9A5;">호감 변화</div><b style="font-family:'JetBrains Mono',monospace;font-size:18px;color:#5EEAD4">+6 · +3 · −2</b></div>
        <div style="padding: 10px 12px; border-radius: 14px; border: 1px solid #37464D; background: #232D32;"><div style="font-size: 12px; color: #97A9A5;">수당</div><b style="font-family:'JetBrains Mono',monospace;font-size:18px;color:#5EEAD4">+₩80,000</b></div>
        <div style="padding: 10px 12px; border-radius: 14px; border: 1px solid #37464D; background: #232D32;"><div style="font-size: 12px; color: #97A9A5;">잔고</div><b style="font-family:'JetBrains Mono',monospace;font-size:18px">₩207,500</b></div>

      <p style="margin: 0; font-size: 13px; color: #97A9A5;">이 출동은 관리국 일지에 「내가 출동」으로 기록됐어요. 막간도 다음 본편 요청에 들어가요.</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button type="button" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #37464D; background: #232D32; color: #BECBC8; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">본부로</button>
        <button type="button" style="height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid #3F8879; background: #1D403A; color: #5EEAD4; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">보고서 보기</button>
      </div>
    </div>
  </div>
</div>
</div>
