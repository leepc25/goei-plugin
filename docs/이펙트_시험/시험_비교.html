<h2>A. 등장물 방식 — 캐릭터 생성(약 20) + 동작 2줄(뛰쳐나오기 → 짓밟으며 달리기)</h2><p>고그니쟈 옆에서 괴물이 뛰쳐나와 앞으로 달려감</p><div class="c"><canvas id="a" width="1100" height="440"></canvas></div>
<h2>B. 형체 없는 이펙트 방식 — VFX 1장(약 18)</h2><p>같은 괴물을 VFX로 한 번에. 캐릭터는 지우고 고그니쟈 그림을 겹쳐 그림</p><div class="c"><canvas id="b" width="1100" height="440"></canvas></div>
<h2>C. 충격파 — 새 방식(그림 참조) / 옛 방식(참조 없음)</h2><p>왼쪽 새것, 오른쪽 옛것. 둘 다 쟈알디 기준</p><div class="c"><canvas id="c" width="1100" height="440"></canvas></div>
