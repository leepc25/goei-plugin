<main><h1>앉은 숨쉬기 시험</h1><p>에일린 정면 앉기 끝 장 하나에 코드로만 숨쉬기를 붙였어요(생성 0). 허리띠 위(가슴·어깨·머리)만 올라갔다 내려가고, 손·다리는 고정. 게임 배율 1.5배와 3배로 봅니다.</p>
