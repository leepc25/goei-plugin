<h1>샤워 한 세트 · 상태 없이 이어 뽑기 (에일린, 7회)</h1>
<p>캐릭터 상태(25회)를 만들지 않고, 앞 줄의 끝 장을 다음 줄의 시작 장으로 이어 뽑았어요. 움직이는 그림은 2배, 아래는 장 띠예요. 옷 입기는 ①을 거꾸로 재생해요.</p>
