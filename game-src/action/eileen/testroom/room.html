<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>에일린 테스트룸</title>
<style>
:root{--bg:#15161a;--fg:#e8e6df;--card:#20222a;--line:#3a3d48;--acc:#cfc7a6;--dim:#9a9890}
:root[data-theme="light"]{--bg:#f2f1ec;--fg:#222;--card:#fff;--line:#d5d3cc;--acc:#7a6d3a;--dim:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:12px 16px}
h1{font-size:17px;margin:0 0 8px}
.m{color:var(--dim);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
canvas{width:100%;height:auto;display:block;background:#000;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 6px;color:var(--acc)}
.binds{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:13px}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
button.key{min-width:84px}
button.cap{border-color:var(--acc);color:var(--acc)}
.list{display:flex;flex-wrap:wrap;gap:4px}
.list button{font-size:12px;padding:2px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
#status{font:12px ui-monospace,monospace;margin-top:6px;color:var(--dim)}
</style></head><body>
<h1>에일린 테스트룸 <span class="m">검수 전 · 동작 45개 · 화면을 한 번 누른 뒤 키로 조종</span></h1>
<div class="wrap">
<div>
<canvas id="cv" width="1280" height="720" tabindex="0" aria-label="에일린 테스트룸 화면"></canvas>
<div id="status"></div>
<div class="card" style="margin-top:10px"><h2>조작 요약</h2><div id="help" class="m"></div></div>
</div>
<div>
<div class="card"><h2>설정</h2>
<div class="row">속도 <input id="spd" type="range" min="10" max="150" value="100"> <span id="spdv">1.0배</span></div>
<div class="row"><label><input id="hb" type="checkbox"> 장 번호 보기</label><label><input id="dm" type="checkbox" checked> 샌드백</label></div>
</div>
<div class="card"><h2>키 바꾸기 <span class="m">(단추를 누르고 새 키)</span></h2><div class="binds" id="binds"></div>
<div class="row"><button id="reset">기본값으로</button></div></div>
<div class="card"><h2>동작 하나씩 보기</h2><div class="list" id="list"></div></div>
</div>
</div>
<script>
const A = /*__DATA__*/null;
const IMG = {}; for (const k in A) { IMG[k] = new Image(); IMG[k].src = A[k].src; }
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const W = 1280, H = 720, FLOOR0 = 430, FLOOR1 = 690;
const store = { get(k, d) { try { const v = localStorage.getItem('eileenRoom.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('eileenRoom.' + k, JSON.stringify(v)); } catch {} } };

// ── 키 ──
const ACTIONS = [
 ['left','왼쪽','ArrowLeft'],['right','오른쪽','ArrowRight'],['up','안쪽(위)','ArrowUp'],['down','바깥쪽(아래)','ArrowDown'],
 ['run','뛰기(누른 채)','ShiftLeft'],['jump','점프 · 공중에서 2단','Space'],
 ['light','약 공격(연타 = 콤보) · 뛰며 = 슬라이딩 · 공중 = 점프 공격','KeyZ'],['heavy','강 공격(콤보 마무리)','KeyX'],
 ['dodge','회피(앞 누르며 = 앞, 아니면 뒤)','KeyC'],['block','막기(누른 채)','KeyV'],['shoot','원거리(누른 채 = 연사)','KeyA'],
 ['skill','고유기술 판독','KeyS'],['charge','충전(누른 채) → 떼면 방출','KeyD'],['super','필살기','KeyF'],
 ['combat','전투 자세 켜기/끄기','Tab'],['weapon','무기 꺼내기/넣기','KeyQ'],
 ['hit','맞기','Digit1'],['knock','날아가 쓰러지기','Digit2'],['stun','스턴(연타로 빨리 풀림)','Digit3'],['crawl','쓰러진 뒤 엎드려 기기','KeyE'],
 ['respond','응대','Digit4'],['talk','말하며 손짓','Digit5'],['nod','끄덕이기','Digit6'],['shake','고개 젓기','Digit7'],
 ['angry','화내기','Digit8'],['happy','기뻐하기','Digit9'],['surprise','놀라기','Digit0'],
 ['eat','섭취','KeyR'],['pick','줍기','KeyT'],['personal','개인 대기','KeyG'],['notice','발견 반응','KeyH'],
 ['flee','도망(누른 채)','KeyJ'],['back','뒷걸음질(누른 채)','KeyK'],['sit','주저앉기 켜기/끄기(앉아서 뒤쪽 키 = 밀려나기)','KeyL'],
 ['crouch','웅크려 떨기 켜기/끄기(웅크려서 방향키 = 네발로 기기)','Semicolon'],
];
const DEF = Object.fromEntries(ACTIONS.map(a => [a[0], a[2]]));
let binds = Object.assign({}, DEF, store.get('binds', {}));
const held = new Set();
const down = n => held.has(binds[n]);
const actOf = code => { for (const k in binds) if (binds[k] === code) return k; return null; };
const keyName = c => !c ? '—' : c.replace(/^Key/, '').replace(/^Digit/, '').replace('Arrow', '방향 ').replace('Left', '←').replace('Right', '→').replace('Up', '↑').replace('Down', '↓').replace('Space', '스페이스').replace('Semicolon', ';').replace('Shift', 'Shift ').replace('Tab', 'Tab');

// ── 장 목록 도우미 ──
const R = (a, b) => { const r = []; if (a <= b) for (let i = a; i <= b; i++) r.push(i); else for (let i = a; i >= b; i--) r.push(i); return r; };
const S = (fr, d) => fr.map(f => ({ f, d }));
function impactOf(id) { const a = A[id]; let imp = 1; for (let f = 1; f < a.n; f++) if (a.reach[f] > a.reach[imp]) imp = f; return imp; }
// 액션 게임식: 준비는 짧게, 때리는 장에서 멈춤(히트스톱), 마무리는 빠르게·캔슬 가능
function atkSeq(id, heavy) {
  const a = A[id], imp = impactOf(id), s = [];
  for (let f = 0; f < a.n; f++) {
    if (f < imp) s.push({ f, d: f === 0 ? 0.03 : (heavy ? 0.05 : 0.038) });
    else if (f === imp) s.push({ f, d: heavy ? 0.16 : 0.1, ev: heavy ? 'hitH' : 'hit' });
    else s.push({ f, d: heavy ? 0.06 : 0.05, cancel: true });
  }
  return s;
}

// ── 상태 ──
const P = { x: 420, y: 580, z: 0, vz: 0, face: 1, mode: 'ground', combat: false, armed: false, clip: null, push: 0, pushDecay: 0,
            jumps: 0, airAtk: false, airVX: 230, takeoff: 0, spin: 0, buf: null, chainT: 0, combo: 0, stunT: 0, idleT: 0, lastTap: {}, runLatch: false };
const D = { x: 860, y: 600, vx: 0, ang: 0, va: 0, hits: 0, hitT: 0 };
let hitstop = 0, shake = 0, flash = 0, sparks = [], tracers = [], cut = 0, speed = 1, showNo = false, showDummy = true, last = performance.now();

function play(id, o = {}) {
  const a = A[id];
  P.clip = { id, seq: o.seq || S(R(0, a.n - 1), 1 / (o.fps || 10)), i: 0, t: 0, loopFrom: o.loopFrom ?? -1, onEnd: o.onEnd || null, done: false, paused: false };
  fireEv(P.clip.seq[0]);
}
function fireEv(e) {
  if (!e || !e.ev) return;
  const a = A[P.clip.id], reach = a.reach[e.f];
  if (e.ev === 'hit' || e.ev === 'hitH') {
    const big = e.ev === 'hitH';
    // 타격 순간 멈춤(히트스톱): 약 0.09초, 강 0.17초, 맞으면 더 길게
    hitstop = big ? 0.17 : 0.09; shake = big ? 12 : 5;
    const hx = P.x + P.face * reach, hy = P.y - P.z - 140;
    spark(hx, hy, big ? 18 : 9, big);
    if (showDummy && Math.abs(D.y - P.y) < 50 && (D.x - P.x) * P.face > -20 && Math.abs(D.x - hx) < 70) {
      D.va += P.face * (big ? 5.5 : 2.2); D.hits++; D.hitT = 0.7; flash = big ? 0.12 : 0.05;
      hitstop += big ? 0.06 : 0.035; shake += big ? 5 : 3;
    }
  } else if (e.ev === 'shot' || e.ev === 'shotH') {
    const big = e.ev === 'shotH';
    shake = big ? 13 : 3; hitstop = big ? 0.15 : 0.025;
    const gx = P.x + P.face * (reach + 4), gy = P.y - P.z - 150;
    spark(gx, gy, big ? 14 : 5, big, '#ffd36b');
    tracers.push({ x: gx, y: gy, dir: P.face, t: big ? 0.16 : 0.07, big });
    if (showDummy && Math.abs(D.y - P.y) < 60 && (D.x - P.x) * P.face > 0) { D.va += P.face * (big ? 6 : 1.2); D.hits++; D.hitT = 0.7; }
  } else if (e.ev === 'cut') { cut = 0.9; flash = 0.2; }
}
function tickClip(dt) {
  const c = P.clip; if (!c || c.done || c.paused) return;
  c.t += dt;
  while (c.t >= c.seq[c.i].d) {
    c.t -= c.seq[c.i].d;
    const cur = c.seq[c.i];
    if (cur.rep && down(cur.rep.key)) { c.i = cur.rep.to; fireEv(c.seq[c.i]); continue; }
    if (c.i + 1 < c.seq.length) { c.i++; fireEv(c.seq[c.i]); }
    else if (c.loopFrom >= 0) { c.i = c.loopFrom; fireEv(c.seq[c.i]); }
    else { c.done = true; c.t = 0; const f = c.onEnd; c.onEnd = null; if (f) f(); break; }
    if (P.clip !== c) break;
  }
}
const curF = () => P.clip ? P.clip.seq[Math.min(P.clip.i, P.clip.seq.length - 1)].f : 0;
const canCancel = () => { const c = P.clip; if (!c) return true; if (c.done) return true; return !!c.seq[c.i].cancel; };
const push = (v, decay) => { P.push = v; P.pushDecay = decay; };

function toIdle() { P.mode = 'ground'; P.clip = null; P.combo = 0; P.idleT = 0; }
function act(id, o = {}) { P.mode = o.mode || 'act'; play(id, { ...o, onEnd: o.onEnd || (() => afterBuf(toIdle)) }); }
function reverseOut(id, frames, d, then) { P.mode = 'act'; play(id, { seq: S(frames, d), onEnd: then || (() => afterBuf(toIdle)) }); }
function ensureArmed(then) {
  if (P.armed) return then();
  P.combat = true; act('W', { seq: S(R(0, 3), 0.04), onEnd: () => { P.armed = true; then(); } });
}

// ── 공격 ──
function light() {
  P.combat = true;
  const step = P.combo;
  if (step >= 3) P.combo = 0;
  const id = ['9', '10', '11'][P.combo];
  P.combo++;
  push(170, 900);
  act(id, { seq: atkSeq(id, false), onEnd: () => {
    if (id === '11') { P.combo = 0; return afterBuf(toIdle); }
    // 약1·약2는 친 자세로 끝남 → 잠깐 기다렸다가 이어지지 않으면 거꾸로 틀어 전투 자세로
    if (P.buf === 'light' || P.buf === 'heavy') return afterBuf(toIdle);
    P.mode = 'chain'; P.chainT = 0.26;
  } });
}
function heavy() {
  P.combat = true; P.combo = 0; push(120, 700);
  act('12', { seq: atkSeq('12', true) });
}
function afterBuf(fallback) {
  const b = P.buf; P.buf = null;
  if (b === 'light') return light();
  if (b === 'heavy') return heavy();
  if (b === 'dodge') return dodge();
  if (b === 'jump') return jump();
  fallback();
}
function chainExpire() {
  const id = P.clip.id, a = A[id];
  P.combo = 0;
  reverseOut(id, R(a.n - 1, 0), 0.03);
}
function slide() { P.combat = true; P.combo = 0; push(820, 1150); act('13', { seq: atkSeq('13', false) }); }
function dodge() {
  P.combat = true; P.combo = 0;
  const fwd = (down('right') && P.face > 0) || (down('left') && P.face < 0);
  push(fwd ? 760 : -760, 2300);
  act(fwd ? '16_1' : '16', { seq: S(R(0, 7), 0.04).map((e, i) => i === 7 ? { ...e, cancel: true } : e) });
}
function shoot() {
  ensureArmed(() => {
    const s = [{ f: 0, d: 0.03 }, { f: 1, d: 0.035 }, { f: 2, d: 0.035 }, { f: 3, d: 0.05, ev: 'shot' }, { f: 4, d: 0.06, rep: { key: 'shoot', to: 3 } }, { f: 5, d: 0.05 }, { f: 6, d: 0.05 }, { f: 7, d: 0.05 }];
    act('15', { seq: s });
  });
}
function skill() { ensureArmed(() => act('22', { seq: S(R(0, 7), 0.09) })); }
function charge() {
  ensureArmed(() => { P.mode = 'charge'; play('23', { seq: [...S(R(0, 3), 0.055), ...S(R(4, 7), 0.11)], loopFrom: 4 }); });
}
function release() {
  const s = atkSeq('24', true).map(e => e.ev ? { ...e, ev: 'shotH' } : e);
  act('24', { seq: s });
}
function superMove() {
  ensureArmed(() => {
    const a = A['25'], s = [];
    const peaks = R(4, a.n - 1).sort((p, q) => a.top[q] - a.top[p]); // 상체가 뒤로 튀는 장(머리가 내려간 장)을 쏘는 장으로
    const shots = []; for (const f of peaks) if (shots.every(g => Math.abs(g - f) > 1) && shots.length < 3) shots.push(f);
    for (let f = 0; f < a.n; f++) s.push({ f, d: f === 0 ? 0.3 : 0.075, ev: f === 0 ? 'cut' : shots.includes(f) ? 'shotH' : undefined });
    act('25', { seq: s });
  });
}

// ── 이동·점프 ──
function jump() {
  P.mode = 'air'; P.z = 0; P.vz = 0; P.jumps = 1; P.airAtk = false; P.spin = 0;
  P.airVX = (down('run') || P.runLatch) ? 430 : 250; P.takeoff = 0.06;
  play('7', { seq: S([0, 1], 0.03) });
}
function doubleJump() { P.jumps = 2; P.vz = 1020; P.spin = 0.2; play('7', { seq: S([1, 2, 3], 0.065) }); }
function jumpAttack() { P.airAtk = true; play('14', { seq: atkSeq('14', false).map((e, i, s) => i === s.length - 1 ? { ...e, d: 9 } : e) }); }
function land() {
  P.z = 0; P.vz = 0; P.airAtk = false; shake = Math.max(shake, 2);
  P.mode = 'act';
  play('7', { seq: [{ f: 6, d: 0.045, cancel: true }, { f: 7, d: 0.05, cancel: true }], onEnd: toIdle });
}

// ── 피격·반응 ──
function hit() { P.combat = true; P.combo = 0; push(-280, 1400); flash = 0.06; act('18', { seq: [{ f: 0, d: 0.02 }, ...S(R(1, A['18'].n - 1), 0.055)] }); }
function knock() {
  P.combat = true; P.combo = 0; push(-560, 650); shake = 8;
  act('19', { seq: S(R(0, 7), 0.06), onEnd: () => { P.mode = 'down'; } });
}
function getUp() { act('20', { seq: S(R(0, 7), 0.06) }); }
function belly() { P.mode = 'belly'; play('38', { seq: [...S(R(0, 3), 0.11), ...S(R(4, 11), 0.1)], loopFrom: 4 }); }
function stun() {
  P.combat = true; P.combo = 0; P.mode = 'stun'; P.stunT = 2.6;
  play('21', { seq: [{ f: 0, d: 0.05 }, ...S(R(1, 7), 0.1)], loopFrom: 1 });
}
function emote(id, fps, o = {}) { act(id, { seq: S(R(0, A[id].n - 1), 1 / fps), ...o }); }
function sit() { P.mode = 'sit'; play('39', { seq: [...S(R(0, 6), 0.085), ...S(R(7, 11), 0.1)], loopFrom: 7 }); }
function sitLoop() { P.mode = 'sit'; play('39', { seq: S(R(7, 11), 0.1), loopFrom: 0 }); }
function crouch() { P.mode = 'crouch'; play('41', { seq: [...S(R(0, 3), 0.08), ...S(R(4, 7), 0.09)], loopFrom: 4 }); }

function onPress(a) {
  if (a === 'left' || a === 'right') {
    const now = performance.now(); if (now - (P.lastTap[a] || 0) < 260) P.runLatch = true; P.lastTap[a] = now;
  }
  if ((P.mode === 'flee' || P.mode === 'back') && !['left', 'right', 'up', 'down', 'run'].includes(a)) toIdle();
  const m = P.mode;
  if (m === 'air') {
    if (a === 'jump' && P.jumps < 2) doubleJump();
    else if (a === 'light' && !P.airAtk) jumpAttack();
    return;
  }
  if (m === 'chain') {
    if (a === 'light') return light();
    if (a === 'heavy') return heavy();
    if (a === 'dodge') return dodge();
    if (a === 'jump') return jump();
  }
  if (m === 'act') {
    if (['light', 'heavy', 'dodge', 'jump'].includes(a)) {
      if (canCancel() && P.clip && ['9', '10', '11', '12', '13', '16', '16_1', '7'].includes(P.clip.id)) {
        if (P.clip.id === '7') { if (a === 'jump') return jump(); }
        else if (P.clip.id === '9' || P.clip.id === '10') { P.buf = a; return; }
        else { P.buf = null; return a === 'light' ? light() : a === 'heavy' ? heavy() : a === 'dodge' ? dodge() : jump(); }
      }
      P.buf = a;
    }
    return;
  }
  if (m === 'down') { if (a === 'crawl') return belly(); if (a === 'jump' || a === 'up' || a === 'light') return getUp(); return; }
  if (m === 'belly') { if (a === 'jump' || a === 'crawl') return getUp(); return; }
  if (m === 'stun') { P.stunT -= 0.18; return; }
  if (m === 'sit' || m === 'scoot') { if (a === 'sit') reverseOut('39', R(6, 0), 0.06); return; }
  if (m === 'crouch' || m === 'crawl4') {
    if (a === 'crouch') { if (m === 'crawl4') toIdle(); else reverseOut('41', R(3, 0), 0.06); }
    return;
  }
  if (m !== 'ground') return;
  const running = down('run') || P.runLatch;
  const moving = down('left') || down('right') || down('up') || down('down');
  switch (a) {
    case 'jump': return jump();
    case 'light': return running && moving ? slide() : light();
    case 'heavy': return heavy();
    case 'dodge': return dodge();
    case 'block': P.combat = true; P.mode = 'block'; return play('17', { seq: S(R(0, 7), 0.03) });
    case 'shoot': return shoot();
    case 'skill': return skill();
    case 'charge': return charge();
    case 'super': return superMove();
    case 'combat':
      if (P.armed) return;
      if (!P.combat) return act('3_0', { seq: S(R(0, 3), 0.055), onEnd: () => { P.combat = true; toIdle(); } });
      return reverseOut('3_0', R(3, 0), 0.055, () => { P.combat = false; toIdle(); });
    case 'weapon':
      if (!P.armed) return ensureArmed(toIdle);
      return reverseOut('W', R(3, 0), 0.05, () => { P.armed = false; toIdle(); });
    case 'hit': return hit();
    case 'knock': return knock();
    case 'stun': return stun();
    case 'respond': return emote('28', 7);
    case 'talk': return emote('29', 7, { seq: S([...R(0, 3), ...R(0, 3), ...R(0, 3)], 1 / 7) });
    case 'nod': return emote('30', 8);
    case 'shake': return emote('31', 8);
    case 'angry': return emote('32', 9);
    case 'happy': return emote('35', 8);
    case 'surprise': return emote('34', 12);
    case 'eat': return emote('26', 7);
    case 'pick': return emote('27', 8);
    case 'personal': return emote('2', 7);
    case 'notice': return act('33', { seq: [...S(R(0, 2), 0.05), ...S(R(3, 7), 0.045)], onEnd: () => { P.combat = true; toIdle(); } });
    case 'sit': return sit();
    case 'crouch': return crouch();
  }
}
function onRelease(a) {
  if (a === 'left' || a === 'right') { if (!down('left') && !down('right')) P.runLatch = false; }
  if (a === 'block' && P.mode === 'block') reverseOut('17', R(curF(), 0), 0.025);
  if (a === 'charge' && P.mode === 'charge') release();
}

// ── 매 장 ──
function update(dt) {
  sparks.forEach(s => { s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt; }); sparks = sparks.filter(s => s.t > 0);
  tracers.forEach(t => t.t -= dt); tracers = tracers.filter(t => t.t > 0);
  shake = Math.max(0, shake - 60 * dt); flash = Math.max(0, flash - dt); cut = Math.max(0, cut - dt);
  D.va += (-D.ang * 60 - D.va * 7) * dt; D.ang += D.va * dt; D.hitT = Math.max(0, D.hitT - dt); if (D.hitT === 0) D.hits = 0;
  if (hitstop > 0) { hitstop -= dt; return; }
  tickClip(dt);
  if (P.push) { P.x += P.face * P.push * dt; const s = Math.sign(P.push); P.push -= s * P.pushDecay * dt; if (Math.sign(P.push) !== s) P.push = 0; }
  const dx = (down('right') ? 1 : 0) - (down('left') ? 1 : 0), dy = (down('down') ? 1 : 0) - (down('up') ? 1 : 0);
  const running = down('run') || P.runLatch;
  switch (P.mode) {
    case 'ground': {
      if (down('flee')) { P.mode = 'flee'; play('36', { fps: 14, loopFrom: 0 }); break; }
      if (down('back')) { P.mode = 'back'; play('37', { fps: 9, loopFrom: 0 }); break; }
      if (dx || dy) {
        if (P.armed) P.armed = false;
        if (dx) P.face = dx;
        const sp = running ? 430 : 230;
        P.x += dx * sp * dt; P.y += dy * sp * 0.55 * dt;
        const id = running ? '5' : '4';
        if (!P.clip || P.clip.id !== id) play(id, { fps: running ? 15 : 11, loopFrom: 0 });
        P.idleT = 0;
      } else {
        const id = P.armed ? 'W' : P.combat ? '3' : '1';
        if (!P.clip || P.clip.id !== id) {
          if (id === 'W') play('W', { seq: [{ f: 3, d: 9 }], loopFrom: 0 });
          else play(id, { fps: P.combat ? 7 : 4, loopFrom: 0 });
        }
        P.idleT += dt;
        if (!P.combat && !P.armed && P.idleT > 9) { P.idleT = 0; emote('2', 7); }
      }
      break;
    }
    case 'chain': P.chainT -= dt; if (P.chainT <= 0) chainExpire(); break;
    case 'air': {
      if (P.takeoff > 0) { P.takeoff -= dt; if (P.takeoff <= 0) P.vz = 1180; else break; }
      if (dx) { P.x += dx * P.airVX * dt; if (!P.airAtk) P.face = dx; }
      P.y += dy * 140 * dt;
      P.z += P.vz * dt; P.vz -= 2700 * dt;
      P.spin = Math.max(0, P.spin - dt);
      if (P.z <= 0 && P.vz < 0) { land(); break; }
      if (!P.airAtk && P.spin <= 0) {
        const f = P.vz > 380 ? 2 : P.vz > -380 ? (P.vz > 0 ? 3 : 4) : 5;
        P.clip = { id: '7', seq: [{ f, d: 9 }], i: 0, t: 0, loopFrom: 0, done: false };
      }
      break;
    }
    case 'block': if (P.clip && P.clip.done) { /* 막는 자세 유지 */ } break;
    case 'down': break;
    case 'belly': {
      const go = dx !== 0; if (go) P.face = dx;
      if (P.clip) P.clip.paused = !go && P.clip.i >= 4;
      if (go && P.clip.i >= 4) P.x += dx * 55 * dt;
      break;
    }
    case 'stun': P.stunT -= dt; if (P.stunT <= 0) reverseOut('21', [curF() > 1 ? 1 : curF(), 0], 0.07); break;
    case 'flee':
      if (!down('flee')) { toIdle(); break; }
      if (dx) P.face = dx; P.x += P.face * 400 * dt; P.y += dy * 180 * dt; break;
    case 'back':
      if (!down('back')) { toIdle(); break; }
      P.x -= P.face * 110 * dt; P.y += dy * 60 * dt; break;
    case 'sit':
      if (P.clip && P.clip.id === '39' && P.clip.i >= 7 && dx && dx === -P.face) { P.mode = 'scoot'; play('40', { fps: 10, loopFrom: 0 }); }
      break;
    case 'scoot':
      if (!(dx && dx === -P.face)) { sitLoop(); break; }
      P.x -= P.face * 75 * dt; break;
    case 'crouch':
      if (P.clip && P.clip.i >= 4 && dx) { P.face = dx; P.mode = 'crawl4'; play('42', { seq: [...S(R(0, 3), 0.08), ...S(R(4, 11), 0.085)], loopFrom: 4 }); }
      break;
    case 'crawl4': {
      const go = dx !== 0; if (go) P.face = dx;
      P.clip.paused = !go && P.clip.i >= 4;
      if (go && P.clip.i >= 4) P.x += dx * 95 * dt;
      break;
    }
  }
  P.x = Math.max(70, Math.min(W - 70, P.x)); P.y = Math.max(FLOOR0 + 20, Math.min(FLOOR1, P.y));
}

// ── 그리기 ──
function spark(x, y, n, big, col) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (big ? 380 : 220) * (0.4 + Math.random());
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0.18 + Math.random() * 0.15, c: col || (Math.random() < 0.5 ? '#fff' : '#ffe08a') }); }
}
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, FLOOR0); g.addColorStop(0, '#2b2f3a'); g.addColorStop(1, '#3b4050');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR0);
  ctx.fillStyle = '#4a4f60'; for (let x = 40; x < W; x += 220) ctx.fillRect(x, 120, 120, 170);
  ctx.fillStyle = '#6b7186'; for (let x = 40; x < W; x += 220) ctx.fillRect(x + 6, 126, 108, 158);
  ctx.fillStyle = '#5a5248'; ctx.fillRect(0, FLOOR0, W, H - FLOOR0);
  ctx.strokeStyle = '#4b443b'; ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) { const y = FLOOR0 + (H - FLOOR0) * (i / 8) ** 1.4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = -600; x < W + 600; x += 120) { ctx.beginPath(); ctx.moveTo(x, FLOOR0); ctx.lineTo(W / 2 + (x - W / 2) * 1.8, H); ctx.stroke(); }
  ctx.fillStyle = '#23252c'; ctx.fillRect(0, FLOOR0 - 8, W, 8);
}
function shadow(x, y, z, w) {
  const k = Math.max(0.35, 1 - z / 420);
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`; ctx.beginPath(); ctx.ellipse(x, y, w * k, 12 * k, 0, 0, Math.PI * 2); ctx.fill();
}
const AIR_IDS = new Set(['14']);
function drawPlayer() {
  const c = P.clip; let id = c ? c.id : '1', f = curF();
  const a = A[id], img = IMG[id];
  if (!img.complete || !img.naturalWidth) return;
  const flip = a.dir === 'SW' ? P.face > 0 : P.face < 0;
  // 공중 장은 그림 속 발끝을 바닥에 맞추고 높이는 코드가 맡음
  const air = P.mode === 'air' || (P.mode === 'act' && id === '7' && false);
  const footY = (air && (id === '7' || AIR_IDS.has(id))) ? a.bot[f] : a.h;
  shadow(P.x, P.y, P.z, 46);
  ctx.save(); ctx.translate(Math.round(P.x), Math.round(P.y - P.z)); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, f * a.w, 0, a.w, a.h, -Math.round(a.w / 2), -footY, a.w, a.h);
  ctx.restore();
  if (showNo) { ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText(`${id} · ${f + 1}/${a.n}`, P.x - 40, P.y + 26); }
}
function drawDummy() {
  if (!showDummy) return;
  shadow(D.x, D.y, 0, 34);
  ctx.save(); ctx.translate(D.x, D.y); ctx.rotate(D.ang * 0.25);
  ctx.fillStyle = '#3a2d22'; ctx.fillRect(-4, -40, 8, 40);
  ctx.fillStyle = D.hitT > 0.55 ? '#fff' : '#9a6b3f'; ctx.fillRect(-26, -190, 52, 150);
  ctx.fillStyle = '#7d5531'; ctx.fillRect(-26, -150, 52, 6); ctx.fillRect(-26, -90, 52, 6);
  ctx.restore();
  if (D.hits > 1) { ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 26px sans-serif'; ctx.fillText(`${D.hits} HIT`, D.x - 40, D.y - 210); }
}
function draw() {
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBg();
  if (D.y < P.y) { drawDummy(); drawPlayer(); } else { drawPlayer(); drawDummy(); }
  for (const t of tracers) { ctx.strokeStyle = t.big ? 'rgba(255,230,140,.95)' : 'rgba(255,240,180,.8)'; ctx.lineWidth = t.big ? 6 : 2; ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.dir > 0 ? W : 0, t.y + (Math.random() - 0.5) * 4); ctx.stroke(); }
  for (const s of sparks) { ctx.fillStyle = s.c; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
  ctx.restore();
  if (flash) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, flash * 3)})`; ctx.fillRect(0, 0, W, H); }
  if (cut) {
    const k = Math.min(1, (0.9 - cut) * 6), y = H / 2 - 70;
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, y, W * k, 140);
    ctx.fillStyle = '#cfc7a6'; ctx.font = 'bold 64px sans-serif'; ctx.fillText('「증명해.」', W - 520 * k, y + 92);
  }
  const c = P.clip;
  document.getElementById('status').textContent = c ? `${c.id} ${A[c.id].name} · ${curF() + 1}/${A[c.id].n}장 · 상태 ${P.mode}${P.combat ? ' · 전투' : ''}${P.armed ? ' · 무기' : ''}` : `상태 ${P.mode}`;
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
  try { update(dt); draw(); } catch (e) { document.getElementById('status').textContent = '오류: ' + e.message; }
  requestAnimationFrame(loop);
}

// ── 입력 ──
let capture = null;
window.addEventListener('keydown', e => {
  if (capture) { e.preventDefault(); finishCapture(e.code); return; }
  const a = actOf(e.code);
  if (!a) return;
  if (document.activeElement && ['INPUT', 'SELECT'].includes(document.activeElement.tagName) && document.activeElement.type !== 'checkbox') return;
  e.preventDefault();
  if (held.has(e.code)) return;
  held.add(e.code); onPress(a);
});
window.addEventListener('keyup', e => { if (!held.has(e.code)) return; held.delete(e.code); const a = actOf(e.code); if (a) onRelease(a); });
window.addEventListener('blur', () => held.clear());
cv.addEventListener('pointerdown', () => cv.focus());

// ── 화면 ──
function renderBinds() {
  const box = document.getElementById('binds'); box.innerHTML = '';
  for (const [id, label] of ACTIONS) {
    const l = document.createElement('span'); l.textContent = label;
    const b = document.createElement('button'); b.className = 'key' + (capture && capture.id === id ? ' cap' : '');
    b.textContent = capture && capture.id === id ? '키를 누르세요' : keyName(binds[id]);
    b.onclick = () => { capture = { id }; renderBinds(); };
    box.append(l, b);
  }
  const k = id => `<b>${keyName(binds[id])}</b>`;
  document.getElementById('help').innerHTML =
    `이동 ${k('left')}${k('right')}${k('up')}${k('down')} · 뛰기 ${k('run')} 또는 방향키 두 번 · 점프 ${k('jump')}(이동하며 자유롭게, 공중에서 한 번 더 = 2단) · ` +
    `약 ${k('light')} 연타 = 약1→약2→약3, 약 몇 타 뒤든 강 ${k('heavy')} = 마무리 · 뛰면서 약 = 슬라이딩 · 공중에서 약 = 점프 공격 · ` +
    `회피 ${k('dodge')} · 막기 ${k('block')} · 원거리 ${k('shoot')}(누른 채 연사) · 판독 ${k('skill')} · 충전 ${k('charge')} · 필살기 ${k('super')} · ` +
    `전투 자세 ${k('combat')} · 무기 ${k('weapon')} · 맞기 ${k('hit')} · 쓰러짐 ${k('knock')}(쓰러진 뒤 ${k('jump')} 일어나기, ${k('crawl')} 엎드려 기기) · 스턴 ${k('stun')} · ` +
    `감정 ${k('respond')}~${k('surprise')} · 섭취 ${k('eat')} · 줍기 ${k('pick')} · 개인 대기 ${k('personal')} · 발견 ${k('notice')} · ` +
    `도망 ${k('flee')} · 뒷걸음 ${k('back')} · 주저앉기 ${k('sit')}(앉아서 뒤쪽 키 = 밀려나기) · 웅크리기 ${k('crouch')}(웅크려서 방향키 = 네발로 기기)`;
}
function finishCapture(code) {
  if (code !== 'Escape') {
    for (const k in binds) if (binds[k] === code) binds[k] = binds[capture.id]; // 이미 쓰던 키면 서로 바꿈
    binds[capture.id] = code; store.set('binds', binds);
  }
  capture = null; renderBinds();
}
document.getElementById('reset').onclick = () => { binds = { ...DEF }; store.set('binds', binds); renderBinds(); };
const list = document.getElementById('list');
for (const id in A) {
  const b = document.createElement('button'); b.textContent = A[id].name;
  b.onclick = () => { P.z = 0; act(id, { fps: 8 }); cv.focus(); };
  list.append(b);
}
const spd = document.getElementById('spd');
spd.oninput = () => { speed = spd.value / 100; document.getElementById('spdv').textContent = speed.toFixed(2).replace(/0$/, '') + '배'; };
document.getElementById('hb').onchange = e => showNo = e.target.checked;
document.getElementById('dm').onchange = e => showDummy = e.target.checked;
renderBinds(); cv.focus(); requestAnimationFrame(loop);
</script>
</body></html>
