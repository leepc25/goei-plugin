<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>요원 통합 테스트룸</title>
<style>
:root{--bg:#15161a;--fg:#e8e6df;--card:#20222a;--line:#3a3d48;--acc:#cfc7a6;--dim:#9a9890}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:12px 16px}
h1{font-size:17px;margin:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m{color:var(--dim);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
canvas{width:100%;height:auto;display:block;background:#000;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 6px;color:var(--acc)}
.binds{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:13px}
button,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
button.key{min-width:84px}
button.cap{border-color:var(--acc);color:var(--acc)}
.list{display:flex;flex-wrap:wrap;gap:4px}
.list button{font-size:12px;padding:2px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
#status{font:12px ui-monospace,monospace;margin-top:6px;color:var(--dim)}
#pick{display:flex;gap:6px;align-items:center}
#chsel{min-width:150px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
#skills div{margin:2px 0}
</style></head><body>
<h1>요원 통합 테스트룸 <span id="pick"><button id="prev" title="이전 인물">◀</button><select id="chsel" aria-label="인물 고르기"></select><button id="next" title="다음 인물">▶</button></span><span class="m" id="loadm">검수 전 · 화면을 한 번 누른 뒤 키로 조종</span></h1>
<div class="wrap">
<div>
<canvas id="cv" width="1280" height="720" tabindex="0" aria-label="테스트룸 화면"></canvas>
<div id="status"></div>
<div class="card" style="margin-top:10px"><h2>조작 요약</h2><div id="help" class="m"></div></div>
</div>
<div>
<div class="card"><h2>이 인물 <span class="sw" id="chcol"></span></h2><div id="skills" class="m"></div></div>
<div class="card"><h2>설정</h2>
<div class="row">속도 <input id="spd" type="range" min="10" max="150" value="100"> <span id="spdv">1배</span></div>
<div class="row"><label><input id="hb" type="checkbox"> 장 번호</label><label><input id="dm" type="checkbox" checked> 샌드백</label><label><input id="ca" type="checkbox"> 샌드백 반격</label></div>
<div class="row">캐릭터 크기 <input id="sz" type="range" min="40" max="160" value="100"> <span id="szv">1배</span> <label><input id="ps" type="checkbox" checked> 원근</label></div>
<div class="row">음악 <select id="song"></select> <label><input id="mute" type="checkbox"> 소리 끄기</label></div>
<div class="row"><label><input id="fs" type="checkbox"> 필살기 게이지 무시(시험용)</label></div>
<div class="row"><label><input id="sa" type="checkbox" checked> 슈퍼아머 테두리 보기</label></div>
</div>
<div class="card"><h2>키 바꾸기 <span class="m">(단추를 누르고 새 키 · Esc 취소)</span></h2><div class="binds" id="binds"></div>
<div class="row"><button id="reset">기본값으로</button></div></div>
<div class="card"><h2>동작 하나씩 보기</h2><div class="list" id="list"></div></div>
</div>
</div>
<script>/*__AUDIO__*/</script>
<script>
// ── 인물 목록·이펙트 그림(빌드가 넣음). 인물 그림은 chars/<키>.js 를 고를 때 불러옴 ──
const INDEX = /*__INDEX__*/null || [];
let A = {}, IMG = {}, CH = { key: '', name: '', color: '#cfc7a6', picks: {}, loops: {}, hit: {}, skills: {}, gun: [], kick: [], ranged: {} }, CK = null;
const VFX = /*__VFX__*/null || {}; for (const k in VFX) { VFX[k].img = new Image(); VFX[k].img.src = VFX[k].src; }
const vfxDur = name => VFX[name].frames.reduce((a, f) => a + f[4], 0) / 1000;
// PixelLab 이펙트 그림: o.flip(좌우), o.rot(회전), o.anchor('right'), o.center(가운데 기준), o.loop, o.under(바닥 층)
const vfx = (name, x, y, scale = 2, o = {}) => { if (!VFX[name]) return false; const d = vfxDur(name); const T = (o.t || d) + (o.hold || 0); fx.push({ k: 'sheet', name, x, y, s: scale, t0: T, t: T, dur: d, ...o }); return true; };
const has = id => !!A[id];
const nOf = id => A[id] ? A[id].n : 0;
const cf = (id, f) => Math.max(0, Math.min(nOf(id) - 1, f));
// 설정의 장 번호는 1부터(동작표와 같게) → 코드는 0부터
const LP = id => { const l = CH.loops && CH.loops[id]; return l && l.length ? l.map(f => cf(id, f - 1)) : null; };
const PK = (name, id) => cf(id, ((CH.picks || {})[name] || nOf(id)) - 1);
const idleId = () => has('3') ? '3' : '1';
const BASE = a => a.h - 4;   // 땅 동작 기준선: 캔버스 아래 4px
const arcOf = id => CH.arc && CH.arc[id];
const ROOT = new Set(['38_1', '40', '37_1', '42_1']);   // 기는 동작: 몸을 제자리에 두고 이동은 코드로
const groundBase = (id, a, f) => arcOf(id) ? a.bot[f] : BASE(a);
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const FXS = 3, mkLayer = () => { const c = document.createElement('canvas'); c.width = 1280 / FXS; c.height = 720 / FXS; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; };
const [fxNc, fxN] = mkLayer(), [fxLc, fxL] = mkLayer();
const GLOW = new Set(['spark', 'ring', 'flash', 'impact', 'beam', 'mote', 'burst', 'fire', 'tracer', 'speed', 'scan', 'orb', 'slash', 'grid']);
const W = 1280, H = 720, FLOOR0 = 430, FLOOR1 = 690;
const store = { get(k, d) { try { const v = localStorage.getItem('room3.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('room3.' + k, JSON.stringify(v)); } catch {} } };

// ── 키 ──
const ACTIONS = [
 ['prevChar','이전 인물','BracketLeft'],['nextChar','다음 인물','BracketRight'],
 ['left','왼쪽','ArrowLeft'],['right','오른쪽','ArrowRight'],['up','안쪽(위)','ArrowUp'],['down','바깥쪽(아래)','ArrowDown'],
 ['run','뛰기(누른 채)','ShiftLeft'],['jump','점프 · 공중에서 2단','Space'],
 ['light','약 공격 · 뛰며 = 돌진 · 공중 = 점프 공격','KeyZ'],['heavy','강 공격(콤보 마무리) · 공중 = 강한 점프 공격','KeyX'],
 ['dodge','회피(누른 방향으로)','KeyC'],['block','막기(누른 채)','KeyV'],['shoot','원거리(누른 채 = 연사)','KeyA'],
 ['skill','고유기술(짧게) · 길게 누르면 충전 → 떼면 방출','KeyS'],['charge','충전(누른 채) → 떼면 방출','KeyD'],['super','필살기','KeyF'],
 ['skill2','둘째 고유기술(있는 인물만)','KeyY'],
 ['combat','전투 자세 켜기/끄기','Tab'],['weapon','무기 꺼내기/넣기(무기 없으면 겨눈 자세)','KeyQ'],
 ['hit','맞기(슈퍼아머 중엔 버팀)','Digit1'],['knock','날아가 쓰러지기','Digit2'],['stun','스턴(연타로 빨리 풀림)','Digit3'],['crawl','쓰러진 뒤 엎드려 기기','KeyE'],
 ['dying','빈사 켜기/끄기','KeyP'],['heal','회복약 먹기(섭취 + 회복 효과)','KeyB'],['drop','아이템 떨어뜨리기(T로 줍기)','KeyN'],['status','상태이상 바꾸기(독→불→전기→없음)','KeyM'],
 ['respond','응대','Digit4'],['talk','말하며 손짓','Digit5'],['nod','끄덕이기','Digit6'],['shake','고개 젓기','Digit7'],
 ['angry','화내기','Digit8'],['happy','기뻐하기','Digit9'],['surprise','놀라기','Digit0'],
 ['eat','섭취','KeyR'],['pick','줍기','KeyT'],['personal','개인 대기','KeyG'],['notice','발견 반응','KeyH'],
 ['flee','도망(누른 채)','KeyJ'],['back','뒷걸음질(누른 채)','KeyK'],['sit','주저앉기 켜기/끄기(앉아서 뒤쪽 키 = 밀려나기)','KeyL'],
 ['crouch','웅크려 떨기 켜기/끄기(웅크려서 방향키 = 네발로 기기)','Semicolon'],
];
const DEF = Object.fromEntries(ACTIONS.map(a => [a[0], a[2]]));
let binds = Object.assign({}, DEF, store.get('binds', {}));
const held = new Set();
const down = n => held.has(binds[n]);
const actOf = code => { for (const k in binds) if (binds[k] === code) return k; return null; };
const keyName = c => !c ? '—' : c.replace(/^Key/, '').replace(/^Digit/, '').replace('ArrowLeft', '←').replace('ArrowRight', '→').replace('ArrowUp', '↑').replace('ArrowDown', '↓').replace('Space', '스페이스').replace('Semicolon', ';').replace('ShiftLeft', 'Shift').replace('ShiftRight', 'Shift').replace('BracketLeft', '[').replace('BracketRight', ']');

// ── 장 목록 도우미 ──
const R = (a, b) => { const r = []; if (a <= b) for (let i = a; i <= b; i++) r.push(i); else for (let i = a; i >= b; i--) r.push(i); return r; };
const S = (fr, d) => fr.map(f => ({ f, d }));
function impactOf(id) { const a = A[id]; if (CH.hit && CH.hit[id]) return cf(id, CH.hit[id] - 1); let imp = 1; for (let f = 1; f < a.n; f++) if (a.reach[f] > a.reach[imp]) imp = f; return Math.min(imp, a.n - 1); }
// 준비 짧게 → 때리는 장 보여 줌 → 마무리 빠르게(캔슬 가능). 멈춤(히트스톱)은 맞았을 때만.
function atkSeq(id, heavy) {
  const a = A[id], imp = impactOf(id), s = [];
  for (let f = 0; f < a.n; f++) {
    if (f < imp) s.push({ f, d: f === 0 ? 0.04 : (heavy ? 0.06 : 0.045) });
    else if (f === imp) s.push({ f, d: heavy ? 0.13 : 0.08, ev: heavy ? 'hitH' : 'hit' });
    else s.push({ f, d: heavy ? 0.06 : 0.05, cancel: true });
  }
  return s;
}

// ── 상태 ──
const P0 = () => ({ x: 420, y: 580, z: 0, vz: 0, face: 1, mode: 'ground', combat: false, armed: false, clip: null, pvx: 0, pvy: 0, pdec: 0,
            jumps: 0, airAtk: false, airVX: 230, takeoff: 0, spin: 0, buf: null, chainT: 0, combo: 0, stunT: 0, idleT: 0, lastTap: {}, runLatch: false,
            hp: 100, sp: 0, heat: 0, overT: 0, lastShot: 0, chargeShown: 0, armorT: 0, inv: 0, charge: 0, ghostT: 0, dying: false, t: 0, buffT: 0, vanish: null, cd: {} });
let P = P0();
const D = { juggle: 0, bounced: false, stunT: 0, x: 860, y: 600, vx: 0, z: 0, vz: 0, ang: 0, va: 0, hits: 0, hitT: 0, flash: 0, stag: 0, hp: 400, mark: 0, atkT: 2.2, wind: 0, bindT: 0, bindC: '#7A3FB0' };
let zoom = 0, zx = W / 2, zy = H / 2, dShake = 0;
let hitstop = 0, shake = 0, flash = 0, dark = 0, cut = 0, speed = 1, showNo = false, showDummy = true, counter = false, last = performance.now();
let freeSuper = false, showArmor = true, grayT = 0;
function gainSp(v) { if (P.noGain > P.t) return; const was = P.sp; P.sp = Math.min(100, P.sp + v); if (was < 100 && P.sp >= 100) { sfx('ability'); flash = 0.06; fx.push({ k: 'num', x: P.x - 50, y: P.y - 260 * K(P.y), v: '필살기 준비', t: 1.0 }); } }
function spReady() { if (freeSuper || P.sp >= 100) { if (!freeSuper) P.sp = 0; return true; } sfx('empty'); fx.push({ k: 'num', x: P.x - 50, y: P.y - 250 * K(P.y), v: '게이지 부족', t: 0.7 }); return false; }
let charScale = store.get('size', 1), persp = true;
const K = y => charScale * (persp ? 0.78 + 0.34 * (y - FLOOR0) / (FLOOR1 - FLOOR0) : 1);
let fx = [];
const items = [];
let audio = null;
try { audio = window.GoeiAudio.createGameAudio({ load: () => store.get('audio', null), save: v => store.set('audio', v) }); } catch (e) { audio = null; }
function sfx(type, extra = {}) { if (audio) try { audio.event({ type, x: P.x, ...extra }); } catch {} }
let started = false, song = store.get('song', 'chase');
function startAudio() { if (started || !audio) return; started = true; try { audio.unlock && audio.unlock(); audio.floor('hq'); audio.music(song || null); } catch {} }

function play(id, o = {}) {
  if (!A[id]) id = idleId();
  const a = A[id];
  let seq = (o.seq || S(R(0, a.n - 1), 1 / (o.fps || 10))).map(e => ({ ...e, f: cf(id, e.f) }));
  // 설정 skip(그 장 빼기) · start(앞 동작 끝 장과 어긋난 첫 장을 건너뜀, 앞으로 틀 때만)
  const sk = CH.skip && CH.skip[id], st = CH.start && CH.start[id];
  if (sk) { const t = seq.filter(e => !sk.includes(e.f + 1) || e.ev || e.fn); if (t.length) seq = t; }
  if (st && seq.length > 1 && seq[0].f === 0 && seq[1].f >= seq[0].f) { const k = seq.findIndex(e => e.f >= st - 1); if (k > 0) { const lost = seq.slice(0, k).filter(e => e.ev || e.fn); seq = seq.slice(k); if (lost.length) seq[0] = { ...seq[0], ev: seq[0].ev || lost[0].ev, list: seq[0].list || lost[0].list, fn: seq[0].fn || lost[0].fn }; if (o.loopFrom > 0) o = { ...o, loopFrom: Math.max(0, o.loopFrom - k) }; } }
  P.clip = { id, seq, i: 0, t: 0, loopFrom: o.loopFrom ?? -1, onEnd: o.onEnd || null, done: false, paused: false };
  fireEv(P.clip.seq[0]);
}
const curF = () => P.clip ? P.clip.seq[Math.min(P.clip.i, P.clip.seq.length - 1)].f : 0;
const canCancel = () => { const c = P.clip; if (!c || c.done) return true; return !!c.seq[c.i].cancel; };
function tickClip(dt) {
  const c = P.clip; if (!c || c.done || c.paused) return;
  c.t += dt;
  while (c.t >= c.seq[c.i].d) {
    c.t -= c.seq[c.i].d;
    const cur = c.seq[c.i];
    if (cur.rep && down(cur.rep.key) && !(cur.rep.key === 'shoot' && P.overT > 0)) { c.i = cur.rep.to; fireEv(c.seq[c.i]); continue; }
    if (c.i + 1 < c.seq.length) { c.i++; fireEv(c.seq[c.i]); }
    else if (c.loopFrom >= 0) { c.i = c.loopFrom; fireEv(c.seq[c.i]); }
    else { c.done = true; c.t = 0; const f = c.onEnd; c.onEnd = null; if (f) f(); break; }
    if (P.clip !== c) break;
  }
}
const pushP = (vx, dec, vy = 0) => { P.pvx = vx; P.pvy = vy; P.pdec = dec; };

// 그림 속 위치 → 화면 위치. 빌드가 모든 그림을 오른쪽(동·남동)을 보게 맞춰 두었으니 왼쪽을 볼 때만 뒤집음
function framePt(id, f, px, py) {
  const a = A[id], flip = P.face < 0;
  const base = isAir(id) ? a.bot[f] : groundBase(id, a, f);
  const k = K(P.y);
  return { x: P.x + (flip ? -px : px) * k, y: P.y - P.z - (base - py) * k };
}
const isAir = id => P.mode === 'air' && (id === '7' || id === '14');
const restId = () => P.armed ? (has('W_1') ? 'W_1' : has('W') ? 'W' : idleId()) : idleId();
function muzzle() { const id = P.clip && A[P.clip.id] ? P.clip.id : restId(), f = P.clip ? curF() : 0, a = A[id]; if (!a) return { x: P.x + P.face * 40, y: P.y - 150 }; const m = (a.mz && a.mz[f]) || [a.reach[f], a.h * 0.45]; return framePt(id, f, m[0] + 1, m[1]); }
const mzAng = () => { const id = P.clip ? P.clip.id : restId(), a = A[id]; return (a && a.ang && a.ang[curF()]) || 0; };
const MZ_GAP = 30;
const later = (t, fn) => fx.push({ k: 'timer', t, fn });

// ── 효과 도우미 ──
function sparks(x, y, n, big, col) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (big ? 520 : 280) * (0.35 + Math.random());
    fx.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, t: 0.16 + Math.random() * 0.18, c: col || (Math.random() < 0.5 ? '#fff' : '#ffd866'), s: big ? 5 : 3 }); }
}
const steam = (x, y, s = 1) => VFX.steam_wisp ? vfx('steam_wisp', x, y, 1.6) : fx.push({ k: 'steam', x: x + (Math.random() - 0.5) * 6, y, vx: (Math.random() - 0.5) * 16, vy: -40 - Math.random() * 30, r: 1.6 * s, t: 0.6, t0: 0.6 });
const ring = (x, y, r, t, c, w = 4, sy = 1) => fx.push({ k: 'ring', x, y, r0: r * 0.2, r, t, t0: t, c, w, sy });
const num = (x, y, v, big) => fx.push({ k: 'num', x, y, v, t: 0.7, big });
const dust = (x, y, n, s = 1) => { for (let i = 0; i < n; i++) fx.push({ k: 'dust', x: x + (Math.random() - 0.5) * 30 * s, y, vx: (Math.random() - 0.5) * 160 * s, vy: -Math.random() * 60, r: 6 + Math.random() * 8 * s, t: 0.45, t0: 0.45 }); };
// 총 쏠 때 불꽃은 그림에 그려진 것만 씀 — 코드는 탄피만
function muzzleFlash(p, big) { if (!(CH.gun || []).length) return; for (let i = 0; i < (big ? 3 : 1); i++) fx.push({ k: 'shell', x: p.x - P.face * 30, y: p.y, vx: -P.face * (80 + Math.random() * 80), vy: -220 - Math.random() * 120, g: P.y, t: 1.2 }); }

function inReach(hx, pad = 60, hh = 100) { pad *= K(P.y); const dk = K(D.y), hOk = hh > D.z - 110 * dk && hh < D.z + 240 * dk; return showDummy && Math.abs(D.y - P.y) < 64 && (D.x - P.x) * P.face > -20 && Math.abs(D.x - hx) < pad && hOk; }
function hurtDummy(dmg, kind) {
  if (D.mark > 0) dmg = Math.round(dmg * 1.5);
  D.hp = Math.max(0, D.hp - dmg); D.hits++; if (!P.inSuper) gainSp(dmg * 0.45); D.hitT = 1.0; D.flash = 0.09;
  const big = kind !== 'light', air = D.z > 0 || D.vz > 0, dir = Math.sign(D.x - P.x) || P.face;
  D.stag = kind === 'launch' ? 0.9 : big ? 0.5 : 0.34;
  D.va += dir * (kind === 'launch' ? 7 : big ? 4.5 : 2);
  if (['down', 'spike', 'blow', 'launch'].includes(kind)) D.liftT = 0;
  if (D.bindT > 0) { D.vx = 0; }
  else if (kind === 'spike' && air) { D.vz = -1100; D.vx = dir * 120; D.juggle++; }
  else if (kind === 'launch') { D.vz = air ? Math.max(D.vz, 720) : 980; D.vx = dir * 90; D.juggle = air ? D.juggle + 1 : 0; D.bounced = false; }
  else if (kind === 'blow') { D.vz = 420; D.vx = dir * 980; D.juggle++; D.bounced = true; }
  else if (kind === 'down') { D.vz = 260; D.vx = dir * 420; D.juggle++; D.bounced = true; }

    const d = await fetchChar(key);
    const imgs = {};
    await Promise.all(Object.keys(d.A).map(id => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = d.A[id].src; imgs[id] = im; })));
    if (loading !== key) return;
    A = d.A; IMG = imgs; CH = Object.assign({ picks: {}, loops: {}, hit: {}, skills: {}, gun: [], kick: [], ranged: {} }, d.cfg); CK = key; silCache = {};
    const keep = { sp: P.sp, status: P.status };   // 자리는 처음 자리로
    P = Object.assign(P0(), keep); fx = []; hitstop = 0; cut = 0; dark = 0; Object.assign(D, { x: 860, y: 600, vx: 0, z: 0, vz: 0, mark: 0, bindT: 0, stunT: 0 });
    chsel.value = key; store.set('char', key);
    document.getElementById('loadm').textContent = `${Object.keys(A).length}줄 · ${CH.armed ? '무기 있음' : '무기 없음'} · 검수 전`;
    renderChar(); cv.focus();
  } catch (e) { document.getElementById('loadm').textContent = '오류: ' + e.message; }

}
function stepChar(d) { if (!INDEX.length) return; const i = Math.max(0, INDEX.findIndex(c => c.key === (loading || CK))); setChar(INDEX[(i + d + INDEX.length) % INDEX.length].key); }

function renderChar() {
  document.getElementById('chcol').style.background = CH.color;
  const sk = CH.skills || {}, k = id => `<b>${keyName(binds[id])}</b>`;
  const line = (lab, key, sp) => sp ? `<div>${lab} ${key} 「${sp.name}」 <span class="m">${(sp.events || (sp.steps || []).flatMap(s => s.events || [])).flatMap(e => e.fx || []).map(f => f.t).filter((v, i, a) => a.indexOf(v) === i).join('·') || Object.values(sp.lv || {}).flat().map(f => f.t).filter((v, i, a) => a.indexOf(v) === i).join('·')}</span></div>` : '';
  document.getElementById('skills').innerHTML = `<div><b>${CH.name}</b> · ${CH.armed ? '무기 있음' : '무기 없음(원거리·충전·필살기 = 전투 자세에서)'}</div>` +
    line('고유기술', k('skill'), sk.skill) + line('충전', `${k('skill')} 길게 / ${k('charge')}`, sk.charge) + line('필살기', k('super'), sk.super) + line('둘째 기술', k('skill2'), sk.skill2);
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const id in A) {
    const b = document.createElement('button'); b.textContent = A[id].name;
    b.onclick = () => { P.z = 0; act(id, { fps: 8 }); cv.focus(); };
    list.append(b);
  }
}

// ── 입력 ──
let capture = null;
window.addEventListener('keydown', e => {
  if (capture) { e.preventDefault(); finishCapture(e.code); return; }
  const a = actOf(e.code); if (!a) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'SELECT' || (ae.tagName === 'INPUT' && ae.type === 'range'))) return;
  e.preventDefault();
  if (held.has(e.code)) return;
  held.add(e.code); startAudio(); onPress(a);
});
window.addEventListener('keyup', e => { if (!held.has(e.code)) return; held.delete(e.code); const a = actOf(e.code); if (a) onRelease(a); });
window.addEventListener('blur', () => held.clear());
cv.addEventListener('pointerdown', () => { cv.focus(); startAudio(); });

// ── 화면 ──
function renderBinds() {
  const box = document.getElementById('binds'); box.innerHTML = '';
  for (const [id, label] of ACTIONS) {
    const l = document.createElement('span'); l.textContent = label;
    const b = document.createElement('button'); b.className = 'key' + (capture && capture.id === id ? ' cap' : '');
    b.textContent = capture && capture.id === id ? '키를 누르세요' : keyName(binds[id]);
    b.onclick = () => { capture = { id }; renderBinds(); };
    box.append(l, b);
  }
  const k = id => `<b>${keyName(binds[id])}</b>`;
  document.getElementById('help').innerHTML =
    `인물 ${k('prevChar')} ${k('nextChar')} 또는 위 목록 · 이동 ${k('left')}${k('right')}${k('up')}${k('down')} · 뛰기 ${k('run')} 또는 방향키 두 번 · 점프 ${k('jump')}(공중에서 한 번 더 = 2단) · ` +
    `약 ${k('light')} 연타 = 약1→약2→약3, 강 ${k('heavy')} = 마무리(단독·약1 뒤 스턴 / 약2 뒤 띄우기 / 약3 뒤 날리기) · 뛰며 약 = 돌진 · 공중에서 약/강 = 점프 공격 · ` +
    `회피 ${k('dodge')}(누른 방향, 없으면 뒤) · 막기 ${k('block')} · 원거리 ${k('shoot')} · 고유기술 ${k('skill')}(길게 = 충전, 떼면 방출) · 충전 ${k('charge')} · 필살기 ${k('super')} · ` +
    `전투 자세 ${k('combat')} · 무기 ${k('weapon')} · 맞기 ${k('hit')} · 쓰러짐 ${k('knock')}(${k('jump')} 일어나기, ${k('crawl')} 엎드려 기기) · 스턴 ${k('stun')} · 빈사 ${k('dying')} · ` +
    `감정 ${k('respond')}~${k('surprise')} · 섭취 ${k('eat')} · 줍기 ${k('pick')} · 개인 대기 ${k('personal')} · 발견 ${k('notice')} · ` +
    `도망 ${k('flee')} · 뒷걸음 ${k('back')} · 주저앉기 ${k('sit')} · 웅크리기 ${k('crouch')}`;
  if (CK) renderChar();
}
function finishCapture(code) {
  if (code !== 'Escape') { for (const k in binds) if (binds[k] === code) binds[k] = binds[capture.id]; binds[capture.id] = code; store.set('binds', binds); }
  capture = null; renderBinds();
}
document.getElementById('reset').onclick = () => { binds = { ...DEF }; store.set('binds', binds); renderBinds(); };
const spd = document.getElementById('spd');
spd.oninput = () => { speed = spd.value / 100; document.getElementById('spdv').textContent = (+speed.toFixed(2)) + '배'; };
document.getElementById('hb').onchange = e => showNo = e.target.checked;
document.getElementById('dm').onchange = e => showDummy = e.target.checked;
document.getElementById('ca').onchange = e => counter = e.target.checked;
document.getElementById('fs').onchange = e => freeSuper = e.target.checked;
document.getElementById('sa').onchange = e => showArmor = e.target.checked;
const songSel = document.getElementById('song');
for (const id of ['', ...((window.GoeiAudio && window.GoeiAudio.SONG_IDS) || [])]) { const o = document.createElement('option'); o.value = id; o.textContent = id || '없음'; if (id === song) o.selected = true; songSel.append(o); }
songSel.onchange = () => { song = songSel.value; store.set('song', song); if (started && audio) try { audio.music(song || null); } catch {} };
document.getElementById('mute').onchange = e => { if (audio) try { audio.setMuted(e.target.checked); } catch {} };
const sz = document.getElementById('sz'); sz.value = Math.round(charScale * 100); document.getElementById('szv').textContent = (+charScale.toFixed(2)) + '배';
sz.oninput = () => { charScale = sz.value / 100; store.set('size', charScale); document.getElementById('szv').textContent = (+charScale.toFixed(2)) + '배'; };
document.getElementById('ps').onchange = e => persp = e.target.checked;
renderBinds(); cv.focus(); requestAnimationFrame(loop);
const want = (location.hash.slice(1) && decodeURIComponent(location.hash.slice(1))) || store.get('char', null);
setChar(INDEX.some(c => c.key === want) ? want : (INDEX[0] && INDEX[0].key));
window.__room = { setChar, get CK() { return CK; }, get P() { return P; }, get A() { return A; }, onPress, onRelease, held, binds };
</script>
