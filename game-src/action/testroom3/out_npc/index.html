<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPC 테스트룸</title>
<style>
:root{--bg:#15161a;--fg:#e8e6df;--card:#20222a;--line:#3a3d48;--acc:#cfc7a6;--dim:#9a9890}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:12px 16px}
h1{font-size:17px;margin:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m{color:var(--dim);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
canvas{width:100%;height:auto;display:block;background:#000;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 6px;color:var(--acc)}
.binds{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:13px}
button,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
button.key{min-width:84px}
button.cap{border-color:var(--acc);color:var(--acc)}
.list{display:flex;flex-wrap:wrap;gap:4px}
.list button{font-size:12px;padding:2px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
#status{font:12px ui-monospace,monospace;margin-top:6px;color:var(--dim)}
#pick{display:flex;gap:6px;align-items:center}
#chsel{min-width:150px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
#skills div{margin:2px 0}
</style></head><body>
<h1>요원 통합 테스트룸 <span id="pick"><button id="prev" title="이전 인물">◀</button><select id="chsel" aria-label="인물 고르기"></select><button id="next" title="다음 인물">▶</button></span><span class="m" id="loadm">검수 전 · 화면을 한 번 누른 뒤 키로 조종</span></h1>
<div class="wrap">
<div>
<canvas id="cv" width="1280" height="720" tabindex="0" aria-label="테스트룸 화면"></canvas>
<div id="status"></div>
<div class="card" style="margin-top:10px"><h2>조작 요약</h2><div id="help" class="m"></div></div>
</div>
<div>
<div class="card"><h2>이 인물 <span class="sw" id="chcol"></span></h2><div id="skills" class="m"></div></div>
<div class="card"><h2>설정</h2>
<div class="row">속도 <input id="spd" type="range" min="10" max="150" value="100"> <span id="spdv">1배</span></div>
<div class="row"><label><input id="hb" type="checkbox"> 장 번호</label><label><input id="dm" type="checkbox" checked> 샌드백</label><label><input id="ca" type="checkbox"> 샌드백 반격</label></div>
<div class="row">캐릭터 크기 <input id="sz" type="range" min="40" max="160" value="100"> <span id="szv">1배</span> <label><input id="ps" type="checkbox" checked> 원근</label></div>
<div class="row">음악 <select id="song"></select> <label><input id="mute" type="checkbox"> 소리 끄기</label></div>
<div class="row"><label><input id="fs" type="checkbox"> 필살기 게이지 무시(시험용)</label></div>
<div class="row"><label><input id="sa" type="checkbox" checked> 슈퍼아머 테두리 보기</label></div>
</div>
<div class="card"><h2>키 바꾸기 <span class="m">(단추를 누르고 새 키 · Esc 취소)</span></h2><div class="binds" id="binds"></div>
<div class="row"><button id="reset">기본값으로</button></div></div>
<div class="card"><h2>동작 하나씩 보기</h2><div class="list" id="list"></div></div>
</div>
</div>

    else if (e.k === 'wave' && e.style === 'sand') { ctx.fillStyle = e.c || '#d8b878'; for (let i = 0; i < 7; i++) { ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.ellipse(e.x - e.dir * (i % 3) * 40, e.y - 30 - i * 34, 70 - i * 4, 40, 0, 0, 6.3); ctx.fill(); } ctx.globalAlpha = 1; }
    else if (e.k === 'wave') { for (let i = 0; i < 9; i++) drawIcon(i % 3 ? 'box' : 'wall', e.x - e.dir * (i % 3) * 30, e.y - 120 + i * 30 * 0.9 - (i % 3) * 26, 2.2 * K(e.y), CH.color, e.dir); }
  }
}
function drawHeat() {
  if (P.heat < 50 || !P.armed) return;
  const p = muzzle(), a = (P.heat - 50) / 50;
  const g = ctx.createRadialGradient(p.x - P.face * 14, p.y, 0, p.x - P.face * 14, p.y, 22);
  g.addColorStop(0, `rgba(255,${P.overT > 0 ? 60 : 120},30,${0.8 * a})`); g.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x - P.face * 14, p.y, 22, 0, Math.PI * 2); ctx.fill();
}
function drawChargeAim() {
  if (P.mode !== 'charge') return;
  const lv = chLv(), max = chLevels().length;
  if (lv) { ctx.fillStyle = CH_COL[Math.min(3, lv)]; ctx.font = 'bold 20px sans-serif'; ctx.fillText(lv >= max ? '최대' : lv + '단', P.x - 16, P.y - 250 * K(P.y)); }
}
function drawHud() {
  ctx.fillStyle = '#000a'; ctx.fillRect(20, 20, 260, 16);
  ctx.fillStyle = P.hp <= 25 ? (Math.sin(P.t * 7) > 0 ? '#ff2a2a' : '#8a1010') : '#5fd17a'; ctx.fillRect(20, 20, 260 * P.hp / 100, 16);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(`${CH.name || '…'} HP ${P.hp}`, 26, 33);
  ctx.fillStyle = '#000a'; ctx.fillRect(20, H - 40, 300, 14);
  ctx.fillStyle = P.sp >= 100 ? (Math.sin(P.t * 10) > 0 ? '#ffe27a' : '#ffb800') : '#d9a520'; ctx.fillRect(20, H - 40, 300 * P.sp / 100, 14);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(P.sp >= 100 ? '필살기 준비!' : `필살기 ${Math.floor(P.sp)}%`, 326, H - 29);
  if (CH.ranged && CH.ranged.heat) {
    ctx.fillStyle = '#000a'; ctx.fillRect(20, 40, 160, 9);
    ctx.fillStyle = P.overT > 0 ? (Math.sin(P.t * 16) > 0 ? '#ff3a2a' : '#7a1a10') : P.heat > 70 ? '#ff8a2a' : '#f2c14e'; ctx.fillRect(20, 40, 160 * P.heat / 100, 9);
    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(P.overT > 0 ? `과열! ${P.overT.toFixed(1)}초` : '총열 열', 186, 49);
  }
}
function drawDying() {
  if (P.hp > 25) return;
  const t = (P.t * 1.1) % 1, beat = Math.max(0, 1 - Math.abs(t - 0.08) * 12) + Math.max(0, 1 - Math.abs(t - 0.28) * 12) * 0.7;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.55, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, `rgba(170,0,0,${0.55 * beat})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// 필살기 컷인(던파식): 요원 색 띠가 비스듬히 펼쳐지고 기술명이 박힘
function drawCut() {
  if (!cut) return;
  const sp = CH.skills.super || {}, k = Math.min(1, (1.1 - cut) * 7), out = cut < 0.15 ? cut / 0.15 : 1, y = H / 2 - 80;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-12 * Math.PI / 180); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = out; ctx.fillStyle = 'rgba(10,10,12,.9)'; ctx.fillRect(-200, y - 10, (W + 400) * k, 180);
  ctx.fillStyle = CH.color; ctx.fillRect(-200, y - 10, (W + 400) * k, 8); ctx.fillRect(-200, y + 162, (W + 400) * k, 8);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; for (let i = 0; i < 14; i++) { const x = ((P.t * 2400 + i * 137) % (W + 400)) - 200, yy = y + 10 + (i * 37) % 150; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 120, yy); ctx.stroke(); }
  // 상반신 컷인 그림이 없으니 전투 대기 그림의 위쪽을 크게
  const a = A[idleId()];
  if (a && IMG[idleId()].complete) { const sc = 1.6, cx = 220 + (1 - k) * -300; ctx.save(); ctx.beginPath(); ctx.rect(-200, y - 2, W + 400, 164); ctx.clip(); ctx.imageSmoothingEnabled = false; ctx.drawImage(IMG[idleId()], 0, 0, a.cw, Math.min(a.ch, 120), cx - a.cw * sc / 2, y - 6, a.cw * sc, Math.min(a.ch, 120) * sc); ctx.restore(); }
  const s = 1 + Math.max(0, 0.6 - (1.1 - cut - 0.25) * 7.5);
  const nm = sp.name || '필살기', fsz = Math.min(70, Math.floor(560 / Math.max(1, nm.length) * 1.05)); ctx.font = `bold ${Math.round(fsz * Math.max(1, s))}px sans-serif`; ctx.lineWidth = 6; ctx.strokeStyle = CH.color; ctx.fillStyle = '#fff';
  const tx = W - 600 * k; ctx.strokeText(sp.name || '필살기', tx, y + 100); ctx.fillText(sp.name || '필살기', tx, y + 100);
  ctx.font = '22px sans-serif'; ctx.fillStyle = '#c8c4b8'; ctx.fillText((sp.sub || '').slice(0, Math.floor((1.1 - cut) * 40)), tx + 10, y + 142);
  ctx.restore();
}
function draw() {
  ctx.save();
  if (zoom) { ctx.translate(zx, zy); ctx.scale(1 + zoom, 1 + zoom); ctx.translate(-zx, -zy); }
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBg();
  if (dark) { ctx.fillStyle = `rgba(0,0,0,${Math.min(0.7, dark * 0.9)})`; ctx.fillRect(0, 0, W, H); }
  drawFxUnder();
  drawSheets(true);
  for (const it of items) { ctx.fillStyle = '#c94a4a'; ctx.fillRect(it.x - 6, it.y - 14, 12, 14); ctx.fillStyle = '#eee'; ctx.fillRect(it.x - 4, it.y - 18, 8, 4); drawVfxAt('item_sparkle', it.x + 6, it.y - 20, 2, P.t - it.t0); }
  if (D.y < P.y) { drawDummy(); drawPlayer(); } else { drawPlayer(); drawDummy(); }
  drawMid();
  const main = ctx;
  for (const g of [fxN, fxL]) { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, fxNc.width, fxNc.height); g.setTransform(1 / FXS, 0, 0, 1 / FXS, 0, 0); g.globalCompositeOperation = 'source-over'; }
  ctx = fxN; drawFx(false);
  ctx = fxL; fxL.globalCompositeOperation = 'lighter'; drawChargeAim(); drawHeat(); drawFx(true);
  ctx = main;
  ctx.drawImage(fxNc, 0, 0, W, H);
  drawSheets();
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(fxLc, 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  drawDying();
  if (flash) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, flash * 3)})`; ctx.fillRect(0, 0, W, H); }
  drawCut();
  drawHud();
  if (!CK) { ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('인물을 불러오는 중…', W / 2 - 130, H / 2); }
  const c = P.clip;
  document.getElementById('status').textContent = c && A[c.id] ? `${CH.name} · ${c.id} ${A[c.id].name} · ${curF() + 1}/${A[c.id].n}장 · 상태 ${P.mode}${P.combat ? ' · 전투' : ''}${P.armed ? ' · 무기' : ''}${armored() ? ' · 슈퍼아머' : ''}` : `${CH.name} · 상태 ${P.mode}`;
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
  try { update(dt); draw(); } catch (e) { document.getElementById('status').textContent = '오류: ' + e.message; console.error(e); }
  requestAnimationFrame(loop);
}

// ── 인물 바꾸기: chars/<키>.js 를 <script>로 불러옴(file:// 에서도 됨) ──
window.__C = window.__C || {};
const chsel = document.getElementById('chsel');
for (const c of INDEX) { const o = document.createElement('option'); o.value = c.key; o.textContent = `${c.num} ${c.name}${c.armed ? ' · 무기' : ''}`; chsel.append(o); }
function fetchChar(key) {
  if (window.__C[key]) return Promise.resolve(window.__C[key]);
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'chars/c' + key.split('_')[0] + '.js'; s.onload = () => window.__C[key] ? ok(window.__C[key]) : no(new Error('빈 파일')); s.onerror = () => no(new Error('불러오기 실패: ' + key)); document.head.append(s); });
}
let loading = null;
async function setChar(key) {
  if (!key || key === CK || loading === key) return;
  loading = key; document.getElementById('loadm').textContent = '불러오는 중…';
  try {
    const d = await fetchChar(key);
    const imgs = {};
    await Promise.all(Object.keys(d.A).map(id => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = d.A[id].src; imgs[id] = im; })));
    if (loading !== key) return;
    A = d.A; IMG = imgs; CH = Object.assign({ picks: {}, loops: {}, hit: {}, skills: {}, gun: [], kick: [], ranged: {} }, d.cfg); CK = key; silCache = {};
    const keep = { sp: P.sp, status: P.status };   // 자리는 처음 자리로
    P = Object.assign(P0(), keep); fx = []; hitstop = 0; cut = 0; dark = 0; Object.assign(D, { x: 860, y: 600, vx: 0, z: 0, vz: 0, mark: 0, bindT: 0, stunT: 0 });
    chsel.value = key; store.set('char', key);
    document.getElementById('loadm').textContent = `${Object.keys(A).length}줄 · ${CH.armed ? '무기 있음' : '무기 없음'} · 검수 전`;
    renderChar(); cv.focus();
  } catch (e) { document.getElementById('loadm').textContent = '오류: ' + e.message; }
  finally { if (loading === key) loading = null; }
}
function stepChar(d) { if (!INDEX.length) return; const i = Math.max(0, INDEX.findIndex(c => c.key === (loading || CK))); setChar(INDEX[(i + d + INDEX.length) % INDEX.length].key); }
chsel.onchange = () => setChar(chsel.value);
document.getElementById('prev').onclick = () => stepChar(-1);
document.getElementById('next').onclick = () => stepChar(1);
function renderChar() {
  document.getElementById('chcol').style.background = CH.color;
  const sk = CH.skills || {}, k = id => `<b>${keyName(binds[id])}</b>`;
  const line = (lab, key, sp) => sp ? `<div>${lab} ${key} 「${sp.name}」 <span class="m">${(sp.events || (sp.steps || []).flatMap(s => s.events || [])).flatMap(e => e.fx || []).map(f => f.t).filter((v, i, a) => a.indexOf(v) === i).join('·') || Object.values(sp.lv || {}).flat().map(f => f.t).filter((v, i, a) => a.indexOf(v) === i).join('·')}</span></div>` : '';
  document.getElementById('skills').innerHTML = `<div><b>${CH.name}</b> · ${CH.armed ? '무기 있음' : '무기 없음(원거리·충전·필살기 = 전투 자세에서)'}</div>` +
    line('고유기술', k('skill'), sk.skill) + line('충전', `${k('skill')} 길게 / ${k('charge')}`, sk.charge) + line('필살기', k('super'), sk.super) + line('둘째 기술', k('skill2'), sk.skill2);
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const id in A) {
    const b = document.createElement('button'); b.textContent = A[id].name;
    b.onclick = () => { P.z = 0; act(id, { fps: 8 }); cv.focus(); };
    list.append(b);
  }

// ── 입력 ──
let capture = null;
window.addEventListener('keydown', e => {
  if (capture) { e.preventDefault(); finishCapture(e.code); return; }
  const a = actOf(e.code); if (!a) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'SELECT' || (ae.tagName === 'INPUT' && ae.type === 'range'))) return;
  e.preventDefault();
  if (held.has(e.code)) return;
  held.add(e.code); startAudio(); onPress(a);
});
window.addEventListener('keyup', e => { if (!held.has(e.code)) return; held.delete(e.code); const a = actOf(e.code); if (a) onRelease(a); });
window.addEventListener('blur', () => held.clear());
cv.addEventListener('pointerdown', () => { cv.focus(); startAudio(); });

// ── 화면 ──
function renderBinds() {
  const box = document.getElementById('binds'); box.innerHTML = '';
  for (const [id, label] of ACTIONS) {
    const l = document.createElement('span'); l.textContent = label;
    const b = document.createElement('button'); b.className = 'key' + (capture && capture.id === id ? ' cap' : '');
    b.textContent = capture && capture.id === id ? '키를 누르세요' : keyName(binds[id]);
    b.onclick = () => { capture = { id }; renderBinds(); };
    box.append(l, b);
  }
  const k = id => `<b>${keyName(binds[id])}</b>`;
  document.getElementById('help').innerHTML =
    `인물 ${k('prevChar')} ${k('nextChar')} 또는 위 목록 · 이동 ${k('left')}${k('right')}${k('up')}${k('down')} · 달리기 ${k('run')} 길게 또는 방향키 두 번 · 점프 ${k('jump')}(공중에서 한 번 더 = 2단) · ` +
    `약 ${k('light')} 연타 = 약1→약2→약3, 강 ${k('heavy')} = 마무리(단독·약1 뒤 스턴 / 약2 뒤 띄우기 / 약3 뒤 날리기) · 뛰며 약 = 돌진 · 공중에서 약/강 = 점프 공격 · ` +
    `회피 ${k('run')} 짧게(누른 방향, 없으면 뒤) · 방어 ${k('block')} · 원거리 ${k('shoot')} · 기술 ${k('skill')} · 충전 ${k('charge')}(누른 채, 떼면 방출) · 필살기 ${k('super')} · ` +
    `전투 자세 ${k('combat')} · 무기 ${k('weapon')} · 맞기 상단 ${k('hit')} · 하단 ${k('hitLow')} · 밀려나기 ${k('push')} · 띄워지기 ${k('launch')} · 사망 ${k('die')} · 쓰러짐 ${k('knock')}(${k('jump')} 일어나기, ${k('crawl')} 엎드려 기기) · 스턴 ${k('stun')} · 빈사 ${k('dying')} · ` +
    `감정 ${k('respond')}~${k('surprise')} · 섭취 ${k('eat')} · 상호작용·줍기 ${k('pick')} · 조작 요약 ${k('map')} · 개인 대기 ${k('personal')} · 발견 ${k('notice')} · ` +
    `도망 ${k('flee')} · 뒷걸음 ${k('back')} · 주저앉기 ${k('sit')} · 웅크리기 ${k('crouch')}`;
  if (CK) renderChar();
}
function finishCapture(code) {
  if (code !== 'Escape') { for (const k in binds) if (binds[k] === code) binds[k] = binds[capture.id]; binds[capture.id] = code; store.set('binds2', binds); }
  capture = null; renderBinds();
}
document.getElementById('reset').onclick = () => { binds = { ...DEF }; store.set('binds2', binds); renderBinds(); };
const spd = document.getElementById('spd');
spd.oninput = () => { speed = spd.value / 100; document.getElementById('spdv').textContent = (+speed.toFixed(2)) + '배'; };
document.getElementById('hb').onchange = e => showNo = e.target.checked;
document.getElementById('dm').onchange = e => showDummy = e.target.checked;
document.getElementById('ca').onchange = e => counter = e.target.checked;

const songSel = document.getElementById('song');
for (const id of ['', ...((window.GoeiAudio && window.GoeiAudio.SONG_IDS) || [])]) { const o = document.createElement('option'); o.value = id; o.textContent = id || '없음'; if (id === song) o.selected = true; songSel.append(o); }

const sz = document.getElementById('sz'); sz.value = Math.round(charScale * 100); document.getElementById('szv').textContent = (+charScale.toFixed(2)) + '배';
sz.oninput = () => { charScale = sz.value / 100; store.set('size', charScale); document.getElementById('szv').textContent = (+charScale.toFixed(2)) + '배'; };

renderBinds(); cv.focus(); requestAnimationFrame(loop);
const want = (location.hash.slice(1) && decodeURIComponent(location.hash.slice(1))) || store.get('char', null);
setChar(INDEX.some(c => c.key === want) ? want : (INDEX[0] && INDEX[0].key));
window.__room = { setChar, get CK() { return CK; }, get P() { return P; }, get A() { return A; }, onPress, onRelease, held, binds };
</script>
