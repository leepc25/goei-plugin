<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 검수대: 위에 인물 고르기, 아래 줄마다 재생 칸(같은 바닥선) */
:root{--bg:#eceef1;--card:#f8f9fb;--fg:#1d2026;--mute:#5b6270;--line:#c9ced6;--stage:#b9bec7;--accent:#c8283c;--warn:#b25b00;
--sans:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1e2127;--fg:#e8eaee;--mute:#9aa1ad;--line:#343944;--stage:#2b2f37;--accent:#e2566a;--warn:#f0a050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1e2127;--fg:#e8eaee;--mute:#9aa1ad;--line:#343944;--stage:#2b2f37;--accent:#e2566a;--warn:#f0a050;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 16px;color:var(--mute)}
button,select{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.c b{font-size:14px}
canvas{width:100%;max-width:100%;aspect-ratio:1/1;background:var(--stage);border-radius:4px;image-rendering:pixelated}
.f{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.w{font-size:12px;color:var(--warn)}
</style>
<h1>__TITLE__</h1>
<div class="f">인물을 고르면 줄마다 움직이는 그대로 반복 재생합니다. 끝 장에서 잠깐 멈춥니다. 아직 안 나온 줄은 비어 있습니다.</div>
<div class="bar">
<label for="who">인물</label><select id="who"></select>
<button id="prev" type="button">◀</button><button id="next" type="button">▶</button>
<button id="pp" type="button">멈춤</button>
<label for="sp">빠르기 <input id="sp" type="range" min="4" max="16" value="9"> <span id="spv">9</span>장/초</label>
</div>
<div id="grid" class="grid"></div>
<script>
const IDX=__INDEX__;
const sel=document.getElementById('who'),grid=document.getElementById('grid');
IDX.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${c.name} (${c.done}/${c.total})`;sel.append(o)});
let cards=[],play=true,fps=9,acc=0,last=performance.now(),tick=0;
function show(i){const c=IDX[i];sel.value=i;try{localStorage.setItem('who',i)}catch(e){}
 const go=()=>{const items=(window.__R||{})[c.key]||[];grid.innerHTML='';cards=items.map(it=>{const d=document.createElement('div');d.className='c';
  d.innerHTML='<b></b><canvas width="256" height="256"></canvas><span class="f"></span><span class="w"></span>';d.querySelector('b').textContent=it.name+' ('+it.row+')';
  d.querySelector('.w').textContent=it.mech?('기계 검사: '+it.mech):'';grid.append(d);
  return {imgs:it.frames.map(s=>{const im=new Image();im.src=s;return im}),cv:d.querySelector('canvas'),lab:d.querySelector('.f')}})};
 if((window.__R||{})[c.key])go();else{const s=document.createElement('script');s.src=c.file;s.onload=go;document.head.append(s)}}
sel.onchange=()=>show(+sel.value);
document.getElementById('prev').onclick=()=>show((+sel.value-1+IDX.length)%IDX.length);
document.getElementById('next').onclick=()=>show((+sel.value+1)%IDX.length);
document.getElementById('pp').onclick=e=>{play=!play;e.target.textContent=play?'멈춤':'재생'};
const sp=document.getElementById('sp');sp.oninput=()=>{fps=+sp.value;document.getElementById('spv').textContent=fps};
function draw(){for(const k of cards){const n=k.imgs.length,g=k.cv.getContext('2d');g.clearRect(0,0,256,256);if(!n){k.lab.textContent='아직 없음';continue}
 const i=Math.min(tick%(n+5),n-1),im=k.imgs[i];g.imageSmoothingEnabled=false;
 if(im.complete&&im.naturalWidth){const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(256/w,256/h);g.drawImage(im,(256-w*s)/2,256-h*s,w*s,h*s)}k.lab.textContent=(i+1)+' / '+n+'장'}}
function loop(t){if(play){acc+=(t-last)/1000;while(acc>1/fps){acc-=1/fps;tick++}}last=t;draw();requestAnimationFrame(loop)}
let start=0;try{start=+(localStorage.getItem('who')||0)}catch(e){}
show(Math.min(start,IDX.length-1));requestAnimationFrame(loop);
</script>
