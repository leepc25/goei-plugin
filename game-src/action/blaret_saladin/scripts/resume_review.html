<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블라렛·살라딘 재개 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141c24;color:#e8edf2;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:22px}button,select{font:inherit;color:inherit;background:#2f4051;border:1px solid #617890;padding:10px;border-radius:6px}button{cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}canvas{width:100%;background:#465265;image-rendering:pixelated;display:block}#qa{padding:12px;background:#263341;border-left:3px solid #e9bd68;white-space:pre-line}#list button.on{background:#436387}.dim{color:#b2c4d1}label{white-space:nowrap}#frame{font-variant-numeric:tabular-nums}@media(max-width:500px){main{padding:8px}h1{font-size:18px}button,select{font-size:13px}}</style>
<main><h1>블라렛·살라딘 · 새 그림 검수</h1><p class="dim">생성 결과 비교판 · 사용자 시각 승인 전 · 통합 게임 미반영</p><div id="list" class="row"></div><canvas id="stage" width="1024" height="400"></canvas>
<div class="row"><button id="prev">이전 장</button><button id="play">일시정지</button><button id="next">다음 장</button><button id="reset">처음</button><label>속도 <select id="speed"><option value=".25">¼</option><option value=".5">½</option><option value="1" selected>1배</option></select></label><span id="frame"></span></div>
<div class="row"><label><input id="compare" type="checkbox" checked> 기존 결과 비교</label><label><input id="travel" type="checkbox"> 이동량 적용</label><label><input id="hands" type="checkbox"> 요청 손 위치</label><label><input id="flip" type="checkbox"> 왼쪽</label><button id="attack">공격 재생</button><button id="move">이동 재생</button></div><div id="qa"></div><p class="dim">← → 장 넘기기 · Space 재생 · A 공격 · D 이동. 이동은 그림 안 전진 + 반복 경계 위치 이동을 적용합니다. 손 표시는 요청 좌표이며 출력 픽셀의 자동 검출 결과가 아닙니다.</p></main>
<script>const DATA=/*DATA*/[];const $=id=>document.getElementById(id);const g=$('stage').getContext('2d');g.imageSmoothingEnabled=false;let cur=0,fi=0,playing=true,acc=0,last=performance.now(),rootX=0;
function resize(){const c=$('stage');c.width=Math.round(c.clientWidth);c.height=innerHeight<500?230:360;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
for(const c of DATA){c.image=new Image;c.image.src=c.img;c.before=new Image;if(c.old)c.before.src=c.old}
function pick(i){cur=i;fi=0;rootX=0;acc=0;playing=true;$('play').textContent='일시정지';document.querySelectorAll('#list button').forEach((b,j)=>b.classList.toggle('on',i===j));$('qa').textContent=DATA[i].qa.status+'\n'+DATA[i].qa.notes}
DATA.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name;b.onclick=()=>pick(i);$('list').appendChild(b)});
function step(d){const c=DATA[cur];let n=fi+d;if(n>=c.frames){n=0;if(c.root)rootX+=c.root.cycle_dx}if(n<0){n=c.frames-1;if(c.root)rootX-=c.root.cycle_dx}fi=n;}
function sprite(im,n,x,y,flip,k){if(!im.complete||!im.naturalWidth)return;g.save();g.translate(x,y);if(flip)g.scale(-1,1);g.drawImage(im,n*256,0,256,176,-96*k,-168*k,256*k,176*k);g.restore()}
function render(){let W=$('stage').width,H=$('stage').height,floor=H-24;g.fillStyle='#465265';g.fillRect(0,0,W,H);g.strokeStyle='#8794a1';g.beginPath();g.moveTo(0,floor);g.lineTo(W,floor);g.stroke();if(!DATA.length)return;let c=DATA[cur],cmp=$('compare').checked,flip=$('flip').checked,x=W*(cmp?.55:.35),k=(H<300||W<600||(cmp&&W<1000))?1:2;let progress=c.root?.per_frame?.[fi]||0,direction=flip?-1:1,camera=$('travel').checked?direction*(rootX+progress):0,dx=$('travel').checked?(direction*rootX-camera)*k:0;g.strokeStyle='#748392';for(let xx=((-camera*k)%64+64)%64;xx<W;xx+=64){g.beginPath();g.moveTo(xx,floor);g.lineTo(xx,floor+12);g.stroke()}
 g.font='14px system-ui';if(cmp){sprite(c.before,fi%c.oldFrames,W*.18,floor,flip,k);g.fillStyle='#d1dbe3';g.fillText(c.old?'기존 원본':'기존 클립 없음',W*.18-40,24)}sprite(c.image,fi,x+dx,floor,flip,k);g.fillStyle='#fff';g.fillText('이번 생성',x-30,24);
 if($('hands').checked){g.fillStyle='#ff8d66';for(const [a,b]of Object.values(c.hands[fi])){let px=(a-96)*k*(flip?-1:1);g.fillRect(x+dx+px-3,floor+(b-168)*k-3,6,6)}}$('frame').textContent=`${fi+1} / ${c.frames}장 · ${c.fps}fps`}
function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(DATA.length&&playing){acc+=dt*Number($('speed').value);while(acc>=1/DATA[cur].fps){acc-=1/DATA[cur].fps;if(fi===DATA[cur].frames-1&&!DATA[cur].loop){playing=false;acc=0;$('play').textContent='다시 재생';break}step(1)}}render();requestAnimationFrame(tick)}
$('play').onclick=()=>{if(!playing&&!DATA[cur].loop&&fi===DATA[cur].frames-1){fi=0;acc=0}playing=!playing;$('play').textContent=playing?'일시정지':'재생'};for(let [id,d]of [['prev',-1],['next',1]])$(id).onclick=()=>{playing=false;$('play').textContent='재생';step(d);render()};$('reset').onclick=()=>pick(cur);
$('attack').onclick=()=>{let i=DATA.findIndex(c=>c.key==='saladin-slash1');if(i<0)i=DATA.findIndex(c=>c.key==='blaret-stake_finish');if(i>=0)pick(i)};$('move').onclick=()=>{let i=DATA.findIndex(c=>c.key==='saladin-walk');if(i>=0)pick(i)};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();if(e.key===' ')$('play').click();if(e.key.toLowerCase()==='a')$('attack').click();if(e.key.toLowerCase()==='d')$('move').click()});if(DATA.length)pick(0);requestAnimationFrame(tick);window.reviewState=()=>({cur,fi,playing,rootX,clips:DATA.length});</script></html>
