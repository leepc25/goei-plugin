const $=id=>document.getElementById(id);const images={};let state='original';
async function init(){
  for(const [name,src] of Object.entries({original:DATA.original,background:DATA.background,marker:DATA.marker,...DATA.states})){
    images[name]=new Image();images[name].src=src;await images[name].decode();
  }
  const ready=!!images.closed&&!!images.open;
  $('status').textContent=ready?'새 문 자산 합성 검수 · 최종 게임 반영 및 사용자 승인 전입니다.':'PixelLab 문 원본 대기 · 현재는 기존 문과 별도 표식 시안만 표시합니다. 새 문 제작 완료본이 아닙니다.';
  for(const name of ['closed','open'])$(name).disabled=!images[name];
  for(const name of ['original','closed','open'])$(name).onclick=()=>{state=name;render()};
  $('marker').onchange=render;$('guides').onchange=render;
  $('note').textContent='화면 기준: '+DATA.scene.sourceCommit.slice(0,8)+' · 문턱 y=440 / 도착 발 y=486 · 표식 48×16 원본, 2배 표시. 캡처 속 캐릭터는 기존 화면의 비교 자료이며 신규 제작물이 아닙니다.';
  render();window.reviewReady=true;
}
function render(){
 const canvas=$('scene'),c=canvas.getContext('2d'),x=DATA.scene.screenDoorX;c.imageSmoothingEnabled=false;
 c.clearRect(0,0,1280,720);c.drawImage(images.original,0,0);
 if(state!=='original'){
   // Replace only the doorway area with the actual game background capture.
   c.drawImage(images.background,x-100,160,200,282,x-100,160,200,282);
   const s=DATA.manifest.states[state],a=s.anchor||DATA.manifest.anchor_target;
   c.drawImage(images[state],x-a[0]*2,440-a[1]*2,images[state].width*2,images[state].height*2);
 }
 if($('marker').checked)c.drawImage(images.marker,x-48,448,96,32);
 if($('guides').checked){
   c.lineWidth=1;c.setLineDash([6,4]);
   for(const [y,col,label] of [[440,'#ffda75','문턱 440'],[486,'#8ce8e3','도착 발 486']]){
     c.strokeStyle=col;c.beginPath();c.moveTo(x-120,y+.5);c.lineTo(x+170,y+.5);c.stroke();
     c.fillStyle=col;c.font='14px sans-serif';c.fillText(label,x-112,y-5);
   }c.setLineDash([]);
 }
 for(const name of ['original','closed','open'])$(name).setAttribute('aria-pressed',String(state===name));
 const z=$('detail').getContext('2d');z.imageSmoothingEnabled=false;z.clearRect(0,0,480,720);z.drawImage(canvas,x-120,160,240,360,0,0,480,720);
 window.reviewState={state,marker:$('marker').checked,guides:$('guides').checked};
}
init().catch(e=>{$('status').textContent='검수 그림을 열지 못했습니다: '+e.message;throw e});
