# release/version.json이 바뀐 커밋이 main에 올라오면 그 버전(package.json)으로 카드·플러그인을 빌드해 Releases에 붙인다.
# 같은 버전의 릴리스가 이미 있으면 파일만 새로 바꿔 올린다. 태그(v버전)는 릴리스를 만들 때 함께 생긴다.
# GitHub는 릴리스 파일 이름의 한글을 지우므로 파일 이름은 영문, 화면에 보이는 이름(라벨)은 한글로 둔다.
name: release
on:
  push:
    branches: [main]
    paths: ['release/version.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: 카드 빌드
        run: python3 tools/build_lite_card.py card/원본_봇카드.jpeg out/card.charx
      - name: 묶기
        id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cd out
          cp ../dist/goei-plugin.js goei-plugin.js
          cp ../dist/goei-body.js goei-body.js
          mv card.charx goei-anomaly.charx
          mkdir pack && cp goei-plugin.js goei-body.js pack/ && cp goei-anomaly.charx "pack/괴이_ANOMALY.charx"
          (cd pack && zip -q "../goei-anomaly-${tag}.zip" goei-plugin.js goei-body.js 괴이_ANOMALY.charx)
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          files=("out/goei-anomaly-${TAG}.zip#괴이_ANOMALY_${TAG}.zip (플러그인+카드)" "out/goei-plugin.js#goei-plugin.js (플러그인)" "out/goei-body.js#goei-body.js (본체, 못 받을 때 파일로 넣기)" "out/goei-anomaly.charx#괴이_ANOMALY.charx (카드)")
          if gh release view "$TAG" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do gh release delete-asset "$TAG" "$a" -y; done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" "${files[@]}" \
              --title "괴이 ː ANOMALY ${TAG}" --prerelease \
              --notes "처음 설치: zip을 받아 goei-plugin.js를 Risu 설정 → 플러그인에 추가하고, 괴이_ANOMALY.charx를 캐릭터로 가져오세요. 본체(goei-body.js)는 괴이 카드를 처음 열 때 자동으로 받고, 받지 못하면 뜨는 창에서 파일로 넣으면 됩니다. 그다음부터는 플러그인 탭과 창의 설정 → 업데이트에서 갱신됩니다."
          fi
