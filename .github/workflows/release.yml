# v로 시작하는 태그(v0.16.0 등)를 올리면 카드·플러그인을 빌드해 Releases에 붙인다.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: 카드 빌드
        run: python3 tools/build_lite_card.py card/원본_봇카드.jpeg out/괴이_이면세계.charx
      - name: 묶기
        run: |
          cp dist/goei-plugin.js out/
          cd out && zip -q "괴이_이면세계_${GITHUB_REF_NAME}.zip" goei-plugin.js 괴이_이면세계.charx
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/goei-plugin.js out/괴이_이면세계.charx "out/괴이_이면세계_${GITHUB_REF_NAME}.zip" \
            --title "괴이: 이면세계 ${GITHUB_REF_NAME}" \
            --notes "처음 설치: zip의 goei-plugin.js를 Risu 설정 → 플러그인에 추가하고, 괴이_이면세계.charx를 캐릭터로 가져오세요. 그다음부터는 플러그인 탭과 창의 설정 → 업데이트에서 갱신됩니다."
