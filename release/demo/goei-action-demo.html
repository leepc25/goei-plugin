// src/game/action/sim.ts
var WIDTH = 1280;
var HEIGHT = 720;
var SAVE_VERSION = 2;
var clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
var body = (id, kind, x, y, hp) => ({
  id,
  kind,
  x,
  y,
  z: 0,
  vz: 0,
  dir: kind === "jyaldi" ? 1 : -1,
  hp,
  max: hp,
  act: "idle",
  t: 0,
  duration: 0,
  fired: false,
  inv: 0,
  flash: 0,
  cooldown: 0,
  armor: false,
  stride: 0,
  speed: 0
});
function newRun() {
  return {
    version: SAVE_VERSION,
    player: { ...body(1, "jyaldi", 220, 510, 200), energy: 100, gauge: 100, guard: 100, dashCd: 0, items: [3, 2, 2] },
    enemies: [
      body(2, "corner", 760, 480, 130),
      body(3, "watchman", 1030, 560, 145),
      body(4, "corner", 1130, 440, 130),
      body(5, "watchman", 940, 610, 145)
    ],
    bolts: [],
    effects: [],
    time: 0,
    auto: false,
    phase: "combat",
    nextId: 6,
    cutin: 0,
    hitstop: 0,
    kills: 0,
    message: "Z 가까이서 3연계 · 멀리서 권총 / Shift 유지 달리기"
  };
}
function act(b, name, duration) {
  b.act = name;
  b.t = 0;
  b.duration = duration;
  b.fired = false;
}
function fx(r, kind, x, y, z = 65) {
  if (r.effects.length >= 64) r.effects.shift();
  const duration = kind === "blast" ? 0.55 : 0.22;
  r.effects.push({ x, y, z, t: 0, duration, kind });
}
function facing(a, b) {
  return (b.x - a.x) * a.dir >= -8;
}
function damage(r, b, amount, source, down = false) {
  if (b.hp <= 0 || b.inv > 0) return;
  const p = r.player;
  if (b === p && (p.act === "guard" || p.act === "crouch") && facing(p, source) && p.guard > 0) {
    p.guard = Math.max(0, p.guard - amount * 2);
    fx(r, "guard", p.x + p.dir * 25, p.y);
    if (!p.guard) {
      act(p, "hurt", 0.65);
      r.message = "가드 붕괴! 거리를 확보하세요.";
    }
    return;
  }
  b.hp = Math.max(0, b.hp - amount);
  b.flash = 0.12;
