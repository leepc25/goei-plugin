// src/game/action/hq/style.css

  const fallback = memorySaves();
  const open = () => dbp ??= new Promise((res, rej) => {
    const req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  const get = async (key) => {
    const db = await open();
    return new Promise((res, rej) => {
      const r = db.transaction("kv").objectStore("kv").get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  };
  const put = async (key, v) => {
    const db = await open();
    await new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  };
  let broken = false;
  const safe = async (f, alt) => {
    if (broken) return alt();
    try {
      return await f();
    } catch {
      broken = true;
      return alt();
    }
  };
  return {
    read: (slot) => safe(async () => await get(`goei:game:slot:${slot}`) ?? null, () => fallback.read(slot)),
    write: (slot, d, m) => safe(
      async () => {
        await put(`goei:game:slot:${slot}`, d);
        const list = await get("goei:game:slots") ?? [];
        await put("goei:game:slots", [...list.filter((x) => x.slot !== slot), { slot, savedAt: Date.now(), ...m }].sort((a, b) => a.slot - b.slot));
      },
      () => fallback.write(slot, d, m)
    ),
    list: () => safe(async () => await get("goei:game:slots") ?? [], () => fallback.list())
  };
}

      thumb.style.transform = "";
      return;
    }
    const r = stick.getBoundingClientRect();
    const dx = (ev.clientX - r.left - r.width / 2) / (r.width / 2), dy = (ev.clientY - r.top - r.height / 2) / (r.height / 2);
    stickX = Math.max(-1, Math.min(1, dx));
    stickY = Math.max(-1, Math.min(1, dy));
    runHeld = Math.hypot(dx, dy) > 0.95;
    thumb.style.transform = `translate(${stickX * 28}px,${stickY * 28}px)`;
  };
  const blur = () => (keys.clear(), runHeld = false);
  el.addEventListener("keydown", onKey);
  el.addEventListener("keyup", onKey);
  el.addEventListener("pointerdown", onPointer);
  el.addEventListener("pointerup", onPointer);
  el.addEventListener("pointercancel", onPointer);
  for (const t of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) stick.addEventListener(t, onStick);
  window.addEventListener("blur", blur);
  drawItems();
  el.focus({ preventScroll: true });
  raf = requestAnimationFrame(frame);
  const dispose = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener("blur", blur);
    closeMenu?.();
    el.remove();
  };
  Object.assign(window, { __run: { run, inv, finish, toggleMenu, use, step: (i) => (step(run, i, meta), sync(), run.ended && finish()) } });
  return dispose;
}
