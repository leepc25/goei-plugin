            b.x + dx * b.dir * ground * (this.art?.atlas.action?.scale ?? 2) - 7,
            b.y + dy * ground * (this.art?.atlas.action?.scale ?? 2) - 1,
            14,
            3,
            "#02070bc0"
          );
      }
      if (b.act === "shot" && b.kind !== "jyaldi" && !b.fired) {
        const x = b.dir > 0 ? b.x : b.x - (b.kind === "watchman" ? 600 : 100);
        this.rect(x, b.y - 24, b.kind === "watchman" ? 600 : 100, 48, "#ff574433");
        this.rect(b.x - 7, b.y - 280, 14, 20, "#ffb35c");
      }
      this.sprite(b, this.frame(b, r));
      if (b.armor && b.hp > 0) {
        this.rect(b.x - 10, b.y + 8, 20, 3, "#e8bd72");
      }
      if (b.act === "guard" || b.act === "crouch") {
        const sy = b.y - (b.act === "crouch" ? 95 : 165);
        for (let i = 0; i < 4; i++) this.rect(b.x + b.dir * (34 + i * 3), sy + i * 5, 3, 10, "#8bdbe3aa");
      }
      if (b.kind !== "jyaldi" && b.hp > 0) {
        const enemyFrame = this.art?.atlas[b.kind]?.[this.frame(b, r)];
        const healthTop = b.y - (enemyFrame?.[5] ?? 120) * SCENE.enemyScale - 12;
        this.rect(b.x - 34, healthTop, 68, 6, "#060c12");
        this.rect(b.x - 34, healthTop, 68 * b.hp / b.max, 6, "#e9896d");
      }
      if (b === p && p.inv > 0) {
        this.rect(p.x - 28, p.y + 5, 56, 3, "#90dfed");
      }
    }
    for (const b of r.bolts) {
      this.rect(b.x - 12, b.y - b.z, 24, 4, b.enemy ? "#ff7b6b" : "#ffe5ad");
    }
    for (const f of r.effects) {
      const t = f.t / f.duration, radius = f.kind === "blast" ? 20 + t * 190 : 8 + t * 22, x = f.x, y = f.y - f.z;
      c.globalAlpha = 1 - t;
      const color = f.kind === "guard" ? "#9ce5ff" : "#ffd18b";
      const rays = f.kind === "blast" ? 20 : 8;
      for (let i = 0; i < rays; i++) {
        const angle = i / rays * Math.PI * 2, rad = radius * (i % 2 ? 0.7 : 1);
        const px = Math.round((x + Math.cos(angle) * rad) / 3) * 3, py = Math.round((y + Math.sin(angle) * rad * 0.65) / 3) * 3;
        this.rect(px, py, f.kind === "blast" ? 6 : 3, f.kind === "blast" ? 6 : 3, color);
      }
      if (t < 0.35) {
        this.rect(x - 5, y - 16, 10, 32, "#fff1d0");
        this.rect(x - 16, y - 5, 32, 10, "#fff1d0");
      }
      c.globalAlpha = 1;
    }
    if (r.cutin > 0) {
      this.rect(0, 0, WIDTH, HEIGHT, "#030b17bb");
      this.rect(0, 165, WIDTH, 320, "#172c46");
      for (let i = 0; i < 18; i++)
        this.rect((i * 99 + r.cutin * 800) % WIDTH, 185 + i * 16, 140, 3, "#cc864b");
      this.sprite(
        { ...p, dir: 1 },
        this.art?.atlas.action?.clips.cutin?.[Math.min(
          (this.art?.atlas.action?.clips.cutin?.length ?? 1) - 1,
          Math.floor((1 - r.cutin / 0.75) * (this.art?.atlas.action?.clips.cutin?.length ?? 1))
        )] ?? 0,
        (this.art?.atlas.action?.scale ?? 2) * 1.5,
        340 + (1 - r.cutin / 0.75) * 80,
        530
      );
      c.fillStyle = "#ffdf9e";
      c.font = "bold 58px monospace";
      c.fillText("집중 파괴", 660, 330);
      c.font = "22px monospace";
      c.fillText("쟈알디 · 집중 파괴", 665, 380);
    }
    if (r.phase !== "combat") {
      this.rect(250, 245, 780, 210, "#07121aee");
      c.strokeStyle = "#d9b67a";
      c.lineWidth = 4;
      c.strokeRect(250, 245, 780, 210);
      c.fillStyle = "#f4dfb2";
      c.font = "bold 42px monospace";
      c.textAlign = "center";
      c.fillText(r.phase === "cleared" ? "훈련 완료" : "본부 후송", 640, 330);
      c.font = "24px monospace";
      c.fillText("아래의 새 훈련 버튼으로 다시 시작", 640, 390);
      c.textAlign = "left";
    }
  }
};

// src/game/action/motion-demo.ts
var labels = {
  master: "체형 기준 포즈",
  skill: "C 파괴 능력",
  ult: "S 필살기",
  cutin: "필살기 별도 컷인",
  idle: "전투 대기",
  walk: "걷기",
  run: "달리기",
  melee1: "근접 1타",
  melee2: "근접 2타",
  melee3: "근접 3타",
  shot: "권총 사격",
  guard: "가드",
  crouch: "낮은 자세",
  jump_up: "점프 상승",
  jump_apex: "점프 정점",
  jump_down: "낙하",
  land: "착지",

  rise: "기상"
};
document.body.innerHTML = `<main><h1>쟈알디 동작 확인</h1><div class="controls"><label>동작 <select id="clip"></select></label><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option></select></label><label><input type="checkbox" id="move" checked>보행 이동 함께 보기</label><label><input type="checkbox" id="zoom">2배 확대</label><button id="pause">일시정지</button><button id="previous">이전 프레임</button><button id="next">다음 프레임</button><span id="status">그림 읽는 중</span></div><canvas width="1280" height="720"></canvas><p>걷기·달리기는 이동 거리로 재생합니다. 다른 동작은 반복 확인용입니다. 체형·접지·무기 위치·연결을 확인하는 제작 검증 화면입니다.</p></main>`;
var style = document.createElement("style");
style.textContent = "body{margin:0;padding:16px;background:#071019;color:#e2d7c0;font:14px monospace}main{max-width:1280px;margin:auto}h1{font-size:20px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}button,select{background:#142b3b;color:#e2d7c0;border:1px solid #617b85;padding:8px;font:inherit}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}p{line-height:1.7}";
document.head.append(style);
var canvas = document.querySelector("canvas");
var renderer = new ActionRenderer(canvas);
var run = newRun();
run.enemies = [];
run.player.x = 640;
run.player.y = 530;
var select = document.getElementById("clip");
var speed = document.getElementById("speed");
var moving = document.getElementById("move");
var zoom = document.getElementById("zoom");
var status = document.getElementById("status");
var paused = false;
var clock = 0;
var last = 0;
var frames = [0];
var art;
var raf = 0;
function phase() {
  const duration = select.value === "walk" ? GAIT.walk / MOTION.walkSpeed : select.value === "run" ? GAIT.run / MOTION.runSpeed : 0.8;
  return clock / duration % 1;
}
function draw() {
  const clip = select.value, walk = clip === "walk" || clip === "run";
  run.player.act = clip === "run" ? "run" : clip === "walk" ? "walk" : "idle";
  run.player.x = walk && moving.checked ? 180 + clock * (clip === "run" ? MOTION.runSpeed : MOTION.walkSpeed) % 900 : 640;
  renderer.drawPose(run, clip, phase());
  if (zoom.checked) {
    const c = renderer.ctx;
    c.imageSmoothingEnabled = false;
    const left = Math.max(0, Math.min(640, run.player.x - 320));
    c.drawImage(canvas, left, 240, 640, 360, 0, 0, 1280, 720);
  }
  status.textContent = `${labels[clip] ?? clip} · ${Math.floor(phase() * frames.length) + 1}/${frames.length} 프레임`;
}
select.onchange = () => {
  clock = 0;
  frames = art.atlas.action?.clips[select.value] ?? [0];
  draw();
};
document.getElementById("pause").onclick = (e) => {
  paused = !paused;
  e.currentTarget.textContent = paused ? "재생" : "일시정지";
};
for (const [id, delta] of [
  ["previous", -1],
  ["next", 1]
])
  document.getElementById(id).onclick = () => {
    paused = true;
    document.getElementById("pause").textContent = "재생";
    const duration = select.value === "walk" ? GAIT.walk / MOTION.walkSpeed : select.value === "run" ? GAIT.run / MOTION.runSpeed : 0.8;
    clock = (clock + delta * duration / frames.length + duration) % duration;
    draw();
  };
void (async () => {
  try {
    art = await demoArt();
    await renderer.load(art);
    for (const [id, label] of Object.entries(labels)) {
      if (art.atlas.action?.clips[id]) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = label;
        select.append(option);
      }
    }
    select.value = "walk";
    select.onchange(new Event("change"));
    document.body.dataset.ready = "true";
    const frame = (now) => {
      if (!paused && !document.hidden && last)
        clock += Math.min(0.05, (now - last) / 1e3) * Number(speed.value);
      last = now;
      draw();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  } catch (e) {
    status.textContent = e instanceof Error ? e.message : String(e);
  }
})();
window.addEventListener(
  "pagehide",
  () => {
    cancelAnimationFrame(raf);
    renderer.dispose();
  },
  { once: true }
);
