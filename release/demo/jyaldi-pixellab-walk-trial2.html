<title>쟈알디 걷기 시험장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 한 장면: 위는 무대, 아래는 조작과 프레임 띠 */
:root{
  --bg:#e9ecef; --panel:#f7f8fa; --ink:#1c2328; --muted:#5d6872; --line:#c9d0d6;
  --stage:#9aa4ad; --floor:#6f7a83; --accent:#b4232c; --on-accent:#fff;
  --f-body:"Noto Sans KR",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a2226; --panel:#232d32; --ink:#e4e9ec; --muted:#9aa7af; --line:#36444b;
  --stage:#3b474e; --floor:#2a3338; --accent:#e0525a; --on-accent:#14191c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a2226; --panel:#232d32; --ink:#e4e9ec; --muted:#9aa7af; --line:#36444b;
  --stage:#3b474e; --floor:#2a3338; --accent:#e0525a; --on-accent:#14191c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1{font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.5}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
canvas{width:100%;height:340px;display:block;border-radius:6px;background:var(--stage);image-rendering:pixelated;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad{display:flex;gap:8px;margin-left:auto}
.pad button{min-width:64px;height:48px;font-size:18px}
.read{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.strip button{padding:2px;background:var(--stage);border-radius:4px;flex:0 0 auto}
.strip button[aria-pressed="true"]{outline:2px solid var(--accent)}
.strip img{width:80px;height:80px;image-rendering:pixelated;display:block}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
@media (max-width:560px){.pad{margin-left:0;width:100%}.pad button{flex:1}}
</style>
<div class="wrap">
  <div>
    <h1>쟈알디 동작 시험장 · PixelLab</h1>
    <p class="sub">미승인 후보입니다. 정자세 128px, 2배 표시. <kbd>←</kbd><kbd>→</kbd> 걷기, <kbd>Shift</kbd>를 같이 누르면 달리기, <kbd>Z</kbd> 첫 타 공격.</p>
  </div>
  <canvas id="stage" tabindex="0" aria-label="동작 무대"></canvas>
  <div class="bar">
    <select id="view" aria-label="프레임 띠에 보일 동작">
      <option value="walk">걷기 (시험 2)</option>
      <option value="run">달리기</option>
      <option value="jab">첫 타 공격</option>
      <option value="walk1">걷기 시험 1 (서 있는 자세에서 출발, 비교용)</option>
    </select>
    <select id="speed" aria-label="재생 속도">
      <option value="1">보통 속도</option>
      <option value="0.5">0.5배</option>
      <option value="0.25">0.25배</option>
    </select>
    <button id="auto" aria-pressed="false">자동 시연</button>
    <div class="pad">
      <button data-dir="-1" aria-label="왼쪽">◀</button>
      <button id="runbtn" aria-pressed="false">달리기</button>
      <button data-dir="1" aria-label="오른쪽">▶</button>
      <button id="atk">공격</button>
    </div>
  </div>
  <div class="read" id="read"></div>
  <div class="strip" id="strip"></div>
  <p class="note">프레임을 누르면 그 장에서 멈추고, 한 번 더 누르면 다시 움직입니다. 이동 거리는 디딤발이 한 장마다 밀리는 실측값(걷기 9px, 달리기 18px)에 맞춰서, 발이 바닥 눈금 위에서 미끄러지지 않아야 정상입니다.</p>
</div>

const SCALE=2;
const CLIPS={walk:{stride:9,fps:8},walk1:{stride:9,fps:8},run:{stride:18,fps:12},jab:{fps:14,hold:{4:3}}};
const cv=document.getElementById('stage'),cx=cv.getContext('2d');
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const img={};
let view='walk',speed=1,auto=false,autoT=0,held=0,runHeld=false,runToggle=false,dir=1,x=0,dist=0,frozen=null,last=0,atk=null,state='idle',fi=0;
const keys=new Set();
function resize(){const r=cv.getBoundingClientRect(),d=Math.max(1,Math.round(devicePixelRatio||1));cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);cv.dpr=d}
addEventListener('resize',resize);
// auto: walk right, run back left, jab, repeat
function autoInput(t){t%=10;if(t<3)return{x:1,run:false};if(t<3.4)return{x:0};if(t<5.4)return{x:-1,run:true};if(t<6)return{x:0};if(t<6.05)return{x:0,jab:true};if(t<7.5)return{x:0};return{x:1,run:false}}
function jabSeq(){const s=[];for(let i=0;i<8;i++){const h=(CLIPS.jab.hold[i]||1);for(let k=0;k<h;k++)s.push(i)}return s}
const JAB=jabSeq();
function startJab(){if(!atk)atk={t:0}}
function tick(t){
  const dt=Math.min(.05,(t-(last||t))/1000)*speed;last=t;
  let inp;
  if(auto){autoT+=dt;inp=autoInput(autoT);if(inp.jab)startJab()}
  else inp={x:Math.sign((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0)+held),run:keys.has('Shift')||runHeld||runToggle};
  if(frozen===null){
    if(atk){atk.t+=dt;const k=Math.floor(atk.t*CLIPS.jab.fps);if(k>=JAB.length){atk=null}else{state='jab';fi=JAB[k]}}
    if(!atk){
      if(inp.x){dir=inp.x;state=inp.run?'run':(view==='walk1'?'walk1':'walk');const c=CLIPS[state],s=c.stride*c.fps*dt;x+=dir*s;dist+=s;fi=Math.floor(dist/c.stride)%8}
      else{state='idle';dist=0}
    }
  }
  draw();requestAnimationFrame(tick);
}
function draw(){
  const d=cv.dpr||1,W=cv.width,H=cv.height,k=SCALE*d;
  cx.imageSmoothingEnabled=false;cx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const floorY=Math.round(H-60*d);
  cx.fillStyle=css.getPropertyValue('--floor');cx.fillRect(0,floorY,W,H-floorY);
  const span=W/k,n=Math.ceil(span/48)+1;
  cx.fillStyle=css.getPropertyValue('--stage');
  for(let i=-n;i<=n;i++){const tx=Math.round((i*24-(x%24))*k+W/2);cx.fillRect(tx,floorY,Math.max(1,d),8*d)}
  let im,label;
  if(frozen!==null){im=frozen<0?img.idle:img[view][frozen];label=frozen<0?'대기':`${NAMES[view]} ${frozen+1}`}
  else if(state==='idle'){im=img.idle;label='대기'}
  else{im=img[state][fi];label=`${NAMES[state]} ${fi+1}`}
  const px=Math.round(W/2-80*k),py=floorY-144*k;
  cx.save();
  if(dir<0){cx.translate(W,0);cx.scale(-1,1);cx.drawImage(im,W-px-160*k,py,160*k,160*k)}
  else cx.drawImage(im,px,py,160*k,160*k);
  cx.restore();
  document.getElementById('read').textContent=`${label} · 이동 ${Math.round(Math.abs(x))}px(원본)`;
  document.querySelectorAll('#strip button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.f)===(frozen??-99))));
}
const NAMES={walk:'걷기',walk1:'걷기 시험1',run:'달리기',jab:'첫 타'};
function strip(){
  const s=document.getElementById('strip');s.textContent='';
  const add=(src,f,label)=>{const b=document.createElement('button');b.dataset.f=f;b.setAttribute('aria-label',label);const i=document.createElement('img');i.src=src;i.alt='';b.append(i);b.onclick=()=>{frozen=frozen===f?null:f};s.append(b)};
  add(ART.idle,-1,'대기 자세');ART[view].forEach((src,i)=>add(src,i,`프레임 ${i+1}`));
}
function stopAuto(){auto=false;frozen=null;sync()}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();keys.add(e.code);stopAuto()}
  if(e.key==='Shift')keys.add('Shift');
  if(e.code==='KeyZ'){stopAuto();startJab()}
});
addEventListener('keyup',e=>{keys.delete(e.code);if(e.key==='Shift')keys.delete('Shift')});
addEventListener('blur',()=>{keys.clear();held=0;runHeld=false});
document.querySelectorAll('[data-dir]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);held=Number(b.dataset.dir);stopAuto()});
  for(const ty of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ty,()=>held=0);
});
document.getElementById('runbtn').onclick=()=>{runToggle=!runToggle;sync()};
document.getElementById('atk').onclick=()=>{stopAuto();startJab()};
document.getElementById('view').onchange=e=>{view=e.target.value;frozen=null;strip()};
document.getElementById('speed').onchange=e=>speed=Number(e.target.value);
document.getElementById('auto').onclick=()=>{auto=!auto;autoT=0;frozen=null;sync()};
function sync(){document.getElementById('auto').setAttribute('aria-pressed',String(auto));document.getElementById('runbtn').setAttribute('aria-pressed',String(runToggle))}
(async()=>{img.idle=await load(ART.idle);for(const c of ['walk','walk1','run','jab'])img[c]=await Promise.all(ART[c].map(load));resize();strip();auto=true;sync();requestAnimationFrame(tick)})();
</script>
