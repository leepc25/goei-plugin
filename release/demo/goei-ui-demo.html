      const b = this.btns.find((x) => x.id === id);
      const r = d * u / 2;
      cx = mir(cx);
      Object.assign(b, { cx, cy, r });
      const el = b.el;
      el.style.width = el.style.height = `${r * 2}px`;
      el.style.transform = `translate(${cx - r}px, ${cy - r}px)`;
    };
    const stack = (ids, x, d, fromBottom) => {
      let y2 = fromBottom ? bh - edge : edge;
      ids.forEach((id, i) => {
        const r = d[i] * u / 2;
        y2 += fromBottom ? -r : r;
        place(id, x, y2, d[i]);
        y2 += fromBottom ? -r - g : r + g;
      });
    };
    stack(["attack", "jump", "evade", "shoot", "unique", "ult"], colR, [1.15, 0.88, 0.88, 0.88, 0.88, 0.88], true);
    const right = ["attack", "jump", "evade", "shoot", "unique", "ult"].map((id) => this.btns.find((x) => x.id === id));
    const di = 0.64, ri = di * u / 2;
    let y = bh - edge;
    for (const id of ["guard", "interact", "reload", "support"]) {
      y -= ri;
      let left = colR;
      for (const b of right) if (Math.abs((b.cy ?? 0) - y) < (b.r ?? 0) + ri) left = Math.min(left, mir(b.cx ?? 0) - (b.r ?? 0));
      place(id, left - g - ri, y, di);
      y -= ri + g;
    }
    stack(["menu", "map", "item1", "item2", "item3", "item4"], colL, [0.66, 0.66, 0.66, 0.66, 0.66, 0.66], false);
    const zw = bw * 0.42, zt = bh * 0.3;
    this.zr = { x: s.lefty ? bw - zw : 0, y: zt, w: zw, h: bh - zt };
    Object.assign(this.zone.style, { left: `${this.zr.x}px`, top: `${zt}px`, width: `${zw}px`, height: `${bh - zt}px` });
    this.sr = u * 0.82;
    this.root.style.setProperty("--tp-r", `${this.sr}px`);
    this.restX = Math.max(edge + this.sr, side + 60 - this.sr);
    this.restY = edge + this.sr;
    this.restBase();
  }
  restBase() {
    const s = this.st();
    const zr = this.zr;
    const x = s.lefty ? zr.w - this.restX : this.restX;
    const y = zr.h - this.restY;
    this.placeBase(x, y);
    this.knob.style.transform = "";
    this.base.classList.remove("on");
  }
  placeBase(x, y) {
    this.base.style.transform = `translate(${x - this.sr}px, ${y - this.sr}px)`;
    this.baseX = x;
    this.baseY = y;
  }
  refresh() {
    const s = this.st();
    const coarse = typeof matchMedia !== "undefined" && matchMedia("(pointer: coarse)").matches;
    const show = s.touch === "on" || s.touch === "auto" && (coarse || this.seenTouch);
    this.root.classList.toggle("hide", !show || !this.visible);
    this.layout();
  }
  setVisible(on) {
    if (this.visible === on) return;
    this.visible = on;
    if (!on) this.releaseAll();
    this.refresh();
  }
  get shown() {
    return !this.root.classList.contains("hide");
  }
  /** 아이템 칸: 글자 대신 아이콘 + 개수 */
  setItems(items) {
    items.forEach((it, i) => {
      const b = this.btns.find((x) => x.id === `item${i + 1}`);
      if (!b?.el) return;
      const key = `${it.id ?? ""}|${it.label}`;
      if (b.el.dataset.icon !== key) {
        b.el.dataset.icon = key;
        b.el.innerHTML = `<canvas width="64" height="64"></canvas><i>${i + 1}</i><u></u>`;
        const g = b.el.querySelector("canvas").getContext("2d");
        if (g && (it.label || it.id)) drawHudItemIcon(g, it, 4, 4, 56);
      }
      const u = b.el.querySelector("u");
      const n = it.label || it.id ? String(it.count) : "";
      if (u.textContent !== n) u.textContent = n;
      b.el.classList.toggle("empty", it.count <= 0);
    });
  }
  /** 필살 게이지 0~1 */
  setGauge(v) {
    const b = this.btns.find((x) => x.id === "ult").el;
    b.style.setProperty("--g", String(Math.max(0, Math.min(1, v))));
    b.classList.toggle("full", v >= 1);
  }
  /** 버튼 강조 (조사할 것이 있을 때 E, 탄이 적을 때 R 등) */
  hint(id, on) {
    this.btns.find((x) => x.id === id)?.el?.classList.toggle("hint", on);
  }
  hit(x, y) {
    let best = null, bd = Infinity;
    for (const b of this.btns) {
      const d = Math.hypot(x - b.cx, y - b.cy);
      const lim = b.r * (b.group === "cluster" ? 1.18 : 1.05);
      if (d < lim && d / b.r < bd) best = b, bd = d / b.r;
    }
    return best;
  }
  local(e) {
    if (this.toLocal) return this.toLocal(e.clientX, e.clientY, this.layer);
    const r = this.layer.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  hold(b, on) {
    const n = (this.count.get(b.code) ?? 0) + (on ? 1 : -1);
    this.count.set(b.code, Math.max(0, n));
    b.el.classList.toggle("on", n > 0);
    if (b.code === "Escape" || b.code === "KeyZ") {
      if (on && n === 1) this.onMenu(b.code);
      return;
    }
    if (on && n === 1) {
      this.hub.press(b.code, "touch");
      if (this.st().vibrate) navigator.vibrate?.(8);
    } else if (!on && n <= 0) this.hub.release(b.code, "touch");
  }
  down(e) {
    e.preventDefault();
    const p = this.local(e);
    const b = this.hit(p.x, p.y);
    try {
      this.root.setPointerCapture(e.pointerId);
    } catch {
    }
    if (b) {
      this.ptr.set(e.pointerId, { kind: "btn", b });
      this.hold(b, true);
      return;
    }
    const zr = this.zr;
    const zx = p.x - zr.x, zy = p.y - zr.y;
    if (this.stickPid === null && zx >= 0 && zy >= 0 && zx <= zr.w && zy <= zr.h) {
      this.stickPid = e.pointerId;
      this.ptr.set(e.pointerId, { kind: "stick" });
      this.placeBase(zx, zy);
      this.base.classList.add("on");
      this.stickTo(zx, zy);
    }
  }
  move(e) {
    const st = this.ptr.get(e.pointerId);
    if (!st) return;
    e.preventDefault();
    const p = this.local(e);
    if (st.kind === "stick") {
      this.stickTo(p.x - this.zr.x, p.y - this.zr.y);
      return;
    }
    const b = this.hit(p.x, p.y);
    if (b && b !== st.b) {
      this.hold(st.b, false);
      this.hold(b, true);
      st.b = b;
    }
  }
  up(e) {
    const st = this.ptr.get(e.pointerId);
    if (!st) return;
    this.ptr.delete(e.pointerId);
    if (st.kind === "btn") this.hold(st.b, false);
    else {
      this.stickPid = null;
      this.setStick(0, 0);
      this.restBase();
    }
  }
  stickTo(x, y) {
    const R = this.sr * 0.95;
    let dx = x - this.baseX, dy = y - this.baseY;
    const m = Math.hypot(dx, dy);
    if (m > R * 1.5) {
      const k = (m - R * 1.5) / m;
      this.placeBase(this.baseX + dx * k, this.baseY + dy * k);
      dx = x - this.baseX;
      dy = y - this.baseY;
    }
    const mm = Math.hypot(dx, dy);
    const cl = mm > R ? R / mm : 1;
    this.knob.style.transform = `translate(${dx * cl}px, ${dy * cl}px)`;
    let nx = dx * cl / R, ny = dy * cl / R;
    if (Math.hypot(nx, ny) < 0.18) nx = ny = 0;
    this.setStick(nx, ny);
  }
  setStick(x, y) {
    this.sx = x;
    this.sy = y;
    this.hub.setAnalog("touch", x, y);
    const dir = (code, v) => {
      if (this.dirOn[code] === v) return;
      this.dirOn[code] = v;
      if (v) this.hub.press(code, "touch");
      else this.hub.release(code, "touch");
    };
    const th = (on) => on ? 0.3 : 0.42;
    dir("ArrowLeft", x < -th(this.dirOn.ArrowLeft));
    dir("ArrowRight", x > th(this.dirOn.ArrowRight));
    dir("ArrowUp", y < -th(this.dirOn.ArrowUp) * 1.15);
    dir("ArrowDown", y > th(this.dirOn.ArrowDown) * 1.15);
    const wantRun = this.st().stickRun && Math.abs(x) > 0.9;
    const shiftBtn = this.btns.find((b) => b.code === "ShiftLeft");
    if (wantRun && !this.runOn) {
      this.runOn = true;
      this.runSince = performance.now();
      clearTimeout(this.runTimer);
      this.hold(shiftBtn, true);
    } else if (!wantRun && this.runOn) {
      this.runOn = false;
      const left = 250 - (performance.now() - this.runSince);
      clearTimeout(this.runTimer);
      if (left > 0) this.runTimer = window.setTimeout(() => this.hold(shiftBtn, false), left);
      else this.hold(shiftBtn, false);
    }
  }
  releaseAll() {
    for (const [id, st] of this.ptr) {
      if (st.kind === "btn") this.hold(st.b, false);
      this.ptr.delete(id);
    }
    if (this.runOn) this.runOn = false, clearTimeout(this.runTimer), this.hold(this.btns.find((b) => b.code === "ShiftLeft"), false);
    this.stickPid = null;
    this.setStick(0, 0);
    this.count.clear();
    for (const b of this.btns) b.el.classList.remove("on");
    this.hub.releaseSource("touch");
    this.restBase();
  }
  dispose() {
    window.removeEventListener("touchstart", this.onAnyTouch, { capture: true });
    this.releaseAll();
    this.root.remove();
  }
};

function mountGameShell(box2, o = {}) {

    input2.press(code, "touch");
    setTimeout(() => input2.release(code, "touch"), 90);
  };

    if (code === "Escape") shell2.openPause();

  });

    stage.setCrt(settings.crt);
    stage.setBright(settings.bright);

    apply();
    saveSettings();
  };
  menu.onOpen = (open) => {
    if (open) input2.releaseSource("kb"), input2.releaseSource("pad");
    touch.setVisible(!open && shell2.mode === "play");
  };
  input2.capture = (code, down) => {
    if (!menu.isOpen) {
      if (code === "Escape" && shell2.mode === "play") {
        if (down) shell2.openPause();
        return true;
      }
      return false;
    }
    if (!down) return true;
    menu.key(code === "KeyE" && input2.last === "pad" ? "Escape" : code === "KeyA" && input2.last === "pad" ? "Enter" : code);
    return true;
  };
  input2.attachKeyboard(o.keyTarget ?? window, {
    prevent: (code) => code.startsWith("Arrow") || code === "Space" || code === "Tab" || code === "Escape" || /^Key|^Digit|^Shift/.test(code)

      return `<tr><td>${esc(a === "left" ? "이동 (좌우 + 안쪽·앞쪽)" : LABEL[a])}</td><td>${kb}</td><td>${esc(pd)}</td><td>${esc(tc)}</td></tr>`;
    }).join("");

      { type: "slider", label: "밝기", get: () => s.bright, set: (v) => s.bright = v, min: 0.7, max: 1.4, step: 0.05, fmt: pct },
      { type: "toggle", label: "도트 선명하게", get: () => s.pixel, set: (v) => s.pixel = v },
      { type: "button", label: "전체 화면", sub: "폰은 가로로 고정", act: () => void stage.fullscreen() },
      { type: "head", label: "소리" },
      { type: "slider", label: "전체", get: () => s.master, set: (v) => s.master = v, min: 0, max: 1, step: 0.1, fmt: pct },
      { type: "slider", label: "음악", get: () => s.music, set: (v) => s.music = v, min: 0, max: 1, step: 0.1, fmt: pct },
      { type: "slider", label: "효과음", get: () => s.sfx, set: (v) => s.sfx = v, min: 0, max: 1, step: 0.1, fmt: pct },
      { type: "head", label: "조작" },
      { type: "choice", label: "터치 버튼", options: [["auto", "자동"], ["on", "항상"], ["off", "끄기"]], get: () => s.touch, set: (v) => s.touch = v },
      { type: "slider", label: "버튼 크기", get: () => s.touchSize, set: (v) => s.touchSize = v, min: 0.7, max: 1.4, step: 0.05, fmt: pct },
      { type: "slider", label: "버튼 진하기", get: () => s.touchAlpha, set: (v) => s.touchAlpha = v, min: 0.3, max: 1, step: 0.05, fmt: pct },
      { type: "toggle", label: "스틱 끝까지 밀면 달리기", get: () => s.stickRun, set: (v) => s.stickRun = v },
      { type: "toggle", label: "왼손 배치", get: () => s.lefty, set: (v) => s.lefty = v },
      { type: "toggle", label: "진동", get: () => s.vibrate, set: (v) => s.vibrate = v },

    touch,
    hud: hud2,
    fx: fx3,
    menu,
    get settings() {
      return settings;
    },
    get mode() {
      return mode;
    },
    set mode(m) {
      mode = m;
      touch.setVisible(m === "play" && !menu.isOpen);
    },
    get paused() {
      return menu.isOpen || mode !== "play";
    },
    get touchShown() {
      return touch.shown;
    },
    frame(dt) {
      pad.poll();
      fx3.update(dt);
    },
    play() {
      menu.closeAll();
      shell2.mode = "play";
      stage.root.focus({ preventScroll: true });
    },
    openTitle() {
      shell2.mode = "title";
      menu.closeAll();
      const has = o.hasSave?.() ?? false;
      menu.open({
        id: "title",
        look: "title",
        title: o.title ?? "차원 승강기",
        sub: o.sub ?? "ANOMALY SIMULATION · 관리국 액션",
        noBack: true,
        items: [
          ...has ? [{ type: "button", label: "이어하기", act: () => o.onContinue?.() }] : [],
          { type: "button", label: "새로 시작", act: () => o.onNew?.() },
          { type: "button", label: "설정", act: () => shell2.openSettings() },
          { type: "button", label: "조작법", act: () => shell2.openControls() }
        ]
      });
    },
    openPause() {
      if (menu.isOpen) return;
      menu.open({
        id: "pause",
        title: "일시정지",
        sub: o.pauseInfo?.() ?? "",
        items: [
          ...hud2.last ? [{ type: "html", html: statusHtml(hud2.last) }] : [],
          { type: "button", label: "계속", sub: "Esc", act: () => menu.closeAll() },
          { type: "button", label: "설정", act: () => shell2.openSettings() },
          { type: "button", label: "조작법", act: () => shell2.openControls() },
          { type: "button", label: "자동 전환", sub: "X", act: () => (menu.closeAll(), tap("KeyX")) },
          { type: "button", label: "판정 보기", sub: "H", act: () => (menu.closeAll(), tap("KeyH")) },
          ...o.onRetreat ? [{ type: "button", label: "본부로 귀환", sub: "후송 처리", danger: true, act: () => void shell2.confirm("출동을 포기하고 본부로 돌아갈까요? 송신하지 않은 정보는 절반만 남습니다.", "귀환", "계속 싸운다").then((y) => y && (menu.closeAll(), o.onRetreat())) }] : [],
          { type: "button", label: "타이틀로", act: () => void shell2.confirm("타이틀 화면으로 나갈까요? 진행은 저장됩니다.").then((y) => y && (o.onTitle ? o.onTitle() : shell2.openTitle())) }
        ]
      });
    },
    openSettings() {
      menu.open(settingsScreen());
    },
    openControls() {
      menu.open({ id: "controls", title: "조작법", look: "wide", items: [{ type: "html", html: controlsHtml() }, { type: "button", label: "닫기", act: () => menu.pop() }] });
    },
    choose(c) {
      return new Promise((res) => {
        menu.open(
          choiceScreen(menu, c, (i) => {
            menu.pop();
            res(i);
          })
        );
      });
    },
    confirm(text, yes = "예", no = "아니오") {
      return new Promise((res) => {
        menu.open({
          id: "confirm",
          title: "확인",
          back: () => (menu.pop(), res(false)),
          items: [
            { type: "html", html: `<p>${esc(text)}</p>` },
            { type: "button", label: yes, act: () => (menu.pop(), res(true)) },
            { type: "button", label: no, act: () => (menu.pop(), res(false)) }
          ]
        });
      });
    },
    info(title, lines, button = "확인") {
      return new Promise((res) => {
        menu.open({
          id: "info",
          title,
          look: "wide",
          back: () => (menu.pop(), res()),
          items: [{ type: "html", html: lines.map((l) => `<p>${esc(l)}</p>`).join("") }, { type: "button", label: button, act: () => (menu.pop(), res()) }]
        });
      });
    },
    tap,
    saveSettings,
    dispose() {
      input2.dispose();
      touch.dispose();
      menu.dispose();
      stage.dispose();
    }
  };
  void (async () => {
    settings = parseSettings(await store.load());
    apply();
  })();
  apply();
  return shell2;
}

{
