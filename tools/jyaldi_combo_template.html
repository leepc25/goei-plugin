<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>쟈알디 3연타</title>
<style>
:root{--bg:#1A2226;--p:#232D32;--t:#e6ecef;--m:#9fb0b8;--a:#e0a040}
html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
h1{font-size:17px;margin:0 0 4px}.m{color:var(--m);margin:0 0 8px}
canvas{display:block;width:100%;image-rendering:pixelated;background:#11171a;border-radius:8px;touch-action:none}
.pad{display:flex;gap:10px;justify-content:space-between;margin-top:10px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}
.pad button{width:72px;height:60px;border-radius:12px;border:1px solid #445;background:#2C383E;color:var(--t);font-size:20px;touch-action:none}
.pad button.a{background:var(--a);color:#111;width:88px}
.opt{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}.opt label{background:var(--p);padding:6px 10px;border-radius:8px}
</style>
<div class="wrap">
<h1>쟈알디 주먹 3연타 시연</h1>
<p class="m">A(또는 J·Z) 연타: 잽 → 스트레이트 → 강한 직선. ←→ 이동(밀고 끌기, 그림 없음 → 대기 자세로 미끄러짐). 크라브마가+복싱 근거 뼈대로 생성.</p>
<canvas id="cv" width="640" height="300"></canvas>
<div class="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><div><button id="ba" class="a">A</button></div></div>
<div class="opt"><label><input type="checkbox" id="slow"> 느리게(¼)</label><label><input type="checkbox" id="hb"> 판정 보기</label><label><input type="checkbox" id="fx" checked> 충격파·흔들림</label></div>
</div>
<script>
const FR=__FRAMES__;const IM={};for(const k in FR){const i=new Image();i.src=FR[k];IM[k]=i}
const cv=document.getElementById('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const S=3,GROUND=280; // 3배, 바닥선
// 시간표(60fps 틱): 준비/유효/회수 = 잽 3/2/5, 스트레이트 5/3/8, 강한 직선 8/3/14 (제작서 5장)
const MOVES=[
 {name:'잽',seq:[['01jab-a',3],['02jab',2,'hit'],['03jab-back',3],['00guard',2]],adv:6,dmg:50,push:6,stop:3,shake:0,ring:14},
 {name:'스트레이트',seq:[['04cross-a',2],['05cross-b',3],['06cross',3,'hit'],['07cross-back',5],['08guard',3]],adv:12,dmg:80,push:10,stop:5,shake:2,ring:24},
 {name:'강한 직선',seq:[['09power-a',4],['10power-b',4],['11power',3,'hit'],['12power-hold',6],['13power-back',5],['14guard',3]],adv:20,dmg:110,push:22,stop:8,shake:5,ring:40}];
let px=60,mi=-1,step=0,tick=0,buf=false,stop=0,shake=0,rings=[],bag={x:150,v:0,hp:1000,flash:0},combo=0,last='';
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if('aAjJzZ'.includes(e.key))press()});addEventListener('keyup',e=>keys[e.key]=0);
function hold(id,k){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=0}
hold('bl','ArrowLeft');hold('br','ArrowRight');document.getElementById('ba').onpointerdown=e=>{e.preventDefault();press()};
function press(){if(mi<0){start(0)}else buf=true}
function start(i){mi=i;step=0;tick=0;buf=false}
function cur(){if(mi<0)return['00guard',1];return MOVES[mi].seq[step]}
function advOf(){if(mi<0)return 0;const m=MOVES[mi];let tot=0,done=0;m.seq.forEach((s,i)=>{tot+=s[1];if(i<step)done+=s[1]});done+=tick;return m.adv*Math.min(1,done/tot)}
let acc=0,lastT=0;
function update(){
 if(stop>0){stop--;return}
 if(mi<0){const d=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);px=Math.max(10,Math.min(150,px+d*0.6))}
 else{const m=MOVES[mi],s=m.seq[step];tick++;
  if(tick>=s[1]){
   if(s[2]==='hit'&&!s.done){}
   step++;tick=0;
   const nx=m.seq[step];
   if(nx&&nx[2]==='hit')hit(m);
   // 회수 장(유효 다음)부터 입력이 있으면 다음 타로
   if(step>=m.seq.length||(buf&&step>=m.seq.findIndex(q=>q[2]==='hit')+2&&mi<2)){
     px+=m.adv; const next=buf&&mi<2?mi+1:-1; mi=-1; if(next>=0)start(next); else combo=0;
   }}}
 bag.x+=bag.v;bag.v*=0.82;if(bag.x<px+50)bag.x=px+50;if(bag.x>200)bag.x=200;if(bag.flash>0)bag.flash--;
 rings=rings.filter(r=>(r.t++)<14);if(shake>0)shake--;
}
function hit(m){const fist=px+advOf()+98;if(fist>=bag.x-8){bag.v+=m.push/6;bag.hp=Math.max(0,bag.hp-m.dmg);bag.flash=6;combo++;last=m.name;
 if(document.getElementById('fx').checked){stop=m.stop;shake=m.shake;rings.push({x:bag.x-6,y:62,r:m.ring,t:0})}else stop=m.stop}}
function draw(){
 const sx=shake?(Math.random()*2-1)*shake:0,sy=shake?(Math.random()*2-1)*shake*.5:0;
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#151C1F';g.fillRect(0,0,640,300);
 g.fillStyle='#232D32';g.fillRect(0,GROUND,640,20);g.fillStyle='#2C383E';for(let x=0;x<640;x+=48)g.fillRect(x,GROUND,2,20);
 g.setTransform(1,0,0,1,sx,sy);
 // 샌드백
 const bx=(bag.x)*S-120,by=GROUND-62*S/1.5;g.fillStyle=bag.flash?'#fff':'#6b5a48';g.fillRect(bx,GROUND-150,36,150);g.fillStyle='#3a3128';g.fillRect(bx+14,GROUND-170,8,20);
 // 쟈알디 (발 기준 y=108 → GROUND)
 const [f]=cur();const im=IM[f];const x=(px+advOf()-40)*S-120,y=GROUND-108*S;
 if(im.complete)g.drawImage(im,x,y,160*S,112*S);
 if(document.getElementById('hb').checked){const s=cur();g.strokeStyle='#5af';g.strokeRect(x+50*S,y+20*S,40*S,88*S);if(s[2]==='hit'){g.strokeStyle='#f55';g.strokeRect((px+advOf()+86)*S-120,y+34*S,16*S,12*S)}}
 for(const r of rings){const k=r.t/14;g.strokeStyle=`rgba(255,240,200,${1-k})`;g.lineWidth=3;g.beginPath();g.ellipse(r.x*S-120,y+r.y*S/1.6+40,r.r*(0.4+k*1.2),r.r*(0.8+k*2),0,0,7);g.stroke()}
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#e6ecef';g.font='16px system-ui';g.fillText(combo?`${combo} 콤보 · ${last}`:'',16,26);
 g.fillStyle='#9fb0b8';g.fillText(`샌드백 ${bag.hp}`,520,26);if(bag.hp<=0){bag.hp=1000}
}
function loop(t){const dt=Math.min(100,t-lastT);lastT=t;acc+=dt*(document.getElementById('slow').checked?0.25:1);while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></html>
