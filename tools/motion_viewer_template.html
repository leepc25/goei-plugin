<title>괴이 요원 동작표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 관리국 서류철: 왼쪽 인물 목록, 오른쪽 한 사람의 동작 카드. 진홍 = 쟈알디 요원 색 */
:root {
  --bg: #f3f2ef; --panel: #ffffff; --ink: #1d1e22; --muted: #66676f; --line: #dddbd5;
  --accent: #b3263a; --accent-soft: #f6e3e5; --chip: #ecebe6; --code: #f7f6f2; --warn: #8a5a00; --warn-bg: #fbf1dc;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16171a; --panel: #1f2024; --ink: #e9e7e2; --muted: #9a9aa2; --line: #33343a;
  --accent: #e0566a; --accent-soft: #3a2026; --chip: #2a2b30; --code: #18191c; --warn: #e8b85a; --warn-bg: #33291a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16171a; --panel: #1f2024; --ink: #e9e7e2; --muted: #9a9aa2; --line: #33343a;
  --accent: #e0566a; --accent-soft: #3a2026; --chip: #2a2b30; --code: #18191c; --warn: #e8b85a; --warn-bg: #33291a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); }
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
header.top .sum { color: var(--muted); font-variant-numeric: tabular-nums }
header.top button { margin-left: auto }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px }
button:hover { border-color: var(--accent) }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.checks { grid-column: 1 / -1; background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 12px 16px }
.checks h2 { font-size: 14px; margin: 0 0 6px; color: var(--warn) }
.checks ol { margin: 0; padding-left: 20px } .checks li { margin: 4px 0 }
nav.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 4px }
nav.side input { width: 100%; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); margin-bottom: 10px }
.grp { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 14px 0 4px; font-weight: 700 }
.who { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px }
.who img { width: 22px; height: 36px; object-fit: contain; image-rendering: pixelated }
.who .nm { flex: 1; min-width: 0 } .who .tag { font-size: 11px; color: var(--muted) }
.who[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
.mob { display: none }
main { min-width: 0 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px }
.hero { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap }
.sprites { display: flex; gap: 10px; align-items: flex-end }
.sprites figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted) }
.sprites img { height: 150px; width: auto; image-rendering: pixelated; display: block; margin: 0 auto 4px }
.hero .info { flex: 1; min-width: 220px }
.hero h2 { font-size: 26px; margin: 0; text-wrap: balance } .hero h2 small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px }
.hero .role { color: var(--muted); margin: 2px 0 10px }
.pills { display: flex; flex-wrap: wrap; gap: 6px }
.pill { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums }
.pill.on { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
details { margin-top: 14px } summary { cursor: pointer; color: var(--muted); font-size: 13px }
details ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink) } details li { margin: 3px 0 }
.notes { margin-top: 14px; background: var(--warn-bg); border-radius: 8px; padding: 10px 14px }
.notes b { color: var(--warn); font-size: 13px } .notes ul { margin: 4px 0 0; padding-left: 18px }
.tbl { margin-top: 18px; overflow-x: auto }
table { border-collapse: collapse; width: 100%; min-width: 760px }
th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--line) }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap }
tr.sec td { background: var(--bg); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding: 6px 8px }
td.n { color: var(--muted); font-variant-numeric: tabular-nums; width: 32px }
td.nm { width: 150px } td.nm b { display: block } td.nm .key { font-size: 12px; color: var(--muted) }
td.small { white-space: nowrap; font-variant-numeric: tabular-nums; width: 46px }
.dir { font-family: var(--mono); font-size: 12px; background: var(--chip); border-radius: 4px; padding: 1px 6px }
.ko { margin: 0 0 6px }
.en { position: relative; font: 12.5px/1.55 var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px 64px 8px 10px; margin: 0; white-space: pre-wrap; word-break: break-word }
.en button { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 2px 8px }
.pose { font-size: 12px; color: var(--muted); margin-top: 4px } .pose code { font-family: var(--mono) }
.tmpl { color: var(--muted) }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr) } nav.side { display: none }
  .mob { display: block } .mob select { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink) }
  header.top button { margin-left: 0 }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>

<div class="wrap">
  <header class="top">
    <h1>요원 동작표</h1>
    <span class="sum" id="sum"></span>
    <button id="tgl" type="button">확인할 것 보기</button>
  </header>
  <section class="checks" id="checks" hidden><h2>사용자 확인이 필요한 것</h2><ol id="chk"></ol></section>
  <div class="mob"><label for="sel" class="tmpl">인물</label> <select id="sel"></select></div>
  <nav class="side" id="side"><input id="q" type="search" placeholder="이름 찾기" aria-label="이름 찾기"><div id="list"></div></nav>
  <main id="main"></main>
</div>

<script>
const D = /*DATA*/null;
const SEC = [[1,'기본'],[4,'이동'],[6,'점프'],[9,'공격'],[16,'방어'],[18,'피격'],[22,'기술'],[26,'생활'],[28,'대화 · 반응'],[36,'비전투 반응']];
const KEY = {1:'—',2:'무작위',3:'—',4:'방향',5:'Shift+방향',6:'Space',7:'방향+Space',8:'뛰다 Space',9:'Z',10:'Z Z',11:'Z Z Z',12:'X',13:'뛰다 Z',14:'공중 Z',15:'A',16:'D 짧게',17:'D 길게',18:'맞을 때',19:'크게 맞을 때',20:'—',21:'—',22:'C 짧게',23:'C 길게',24:'C 뗌',25:'S',26:'E',27:'E',28:'E 받음',29:'대사 중',30:'결과 좋음',31:'결과 싫음',32:'호감 크게 하락',33:'적 발견',34:'겁먹은 조우',35:'호감 크게 상승',36:'패닉',37:'겁먹음',38:'쓰러진 뒤',39:'주저앉은 뒤',40:'겁먹음',41:'겁먹음'};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#sum').textContent = `55명 · 합계 ${D.total.toLocaleString()}회 · 생성 0회 · 사용자 확인 전`;
$('#chk').innerHTML = D.checks.map(c => `<li>${esc(c)}</li>`).join('');
$('#tgl').onclick = () => { const h = $('#checks'); h.hidden = !h.hidden; $('#tgl').textContent = h.hidden ? '확인할 것 보기' : '확인할 것 닫기'; };

function list(filter='') {
  let html = '', g = '';
  for (const c of D.chars) {
    if (filter && !(c.ko + c.en).toLowerCase().includes(filter.toLowerCase())) continue;
    if (c.grp !== g) { g = c.grp; html += `<div class="grp">${g}</div>`; }
    html += `<button class="who" type="button" data-no="${c.no}"><img src="${c.img[0]}" alt=""><span class="nm">${c.ko}</span><span class="tag">${c.combat ? '' : '비전투'}</span></button>`;
  }
  $('#list').innerHTML = html;
  document.querySelectorAll('.who').forEach(b => b.onclick = () => show(b.dataset.no));
  mark();
}
$('#q').oninput = e => list(e.target.value);
$('#sel').innerHTML = D.chars.map(c => `<option value="${c.no}">${c.no} ${c.ko} · ${c.grp}</option>`).join('');
$('#sel').onchange = e => show(e.target.value);

let cur = null;
function mark() { document.querySelectorAll('.who').forEach(b => b.setAttribute('aria-current', b.dataset.no === cur ? 'true' : 'false')); }
function show(no) {
  const c = D.chars.find(x => x.no === no) || D.chars[0]; cur = c.no; mark(); $('#sel').value = c.no;
  try { localStorage.setItem('mv-cur', c.no) } catch (e) {}
  const W = c.dir.startsWith('W');
  let rows = '', si = 0;
  for (const r of c.rows) {
    while (si < SEC.length && SEC[si][0] <= r.n) { rows += `<tr class="sec"><td colspan="6">${SEC[si][1]}</td></tr>`; si++; }
    const tmpl = r.en.startsWith('(견본');
    rows += `<tr><td class="n">${r.n}</td>
      <td class="nm"><b>${esc(r.name)}</b><span class="key">${KEY[r.n] || ''}</span></td>
      <td class="small"><span class="dir">${esc(r.dir)}</span></td>
      <td class="small">${esc(r.fr)}장</td><td class="small">${esc(r.cost)}회</td>
      <td>${tmpl ? `<span class="tmpl">PixMiniMax Free motion 견본 (${r.n === 4 ? 'walking' : 'running'}), 프롬프트 없음</span>` :
        `<p class="ko">${esc(r.ko)}</p><pre class="en">${esc(r.en)}<button type="button" class="cp">복사</button></pre>
         <div class="pose">Starting pose: <code>${esc(r.pose)}</code></div>`}</td></tr>`;
  }
  $('#main').innerHTML = `<article class="card">
    <div class="hero">
      <div class="sprites">
        <figure><img src="${c.img[0]}" alt="${c.ko} ${W ? '남서' : '남동'}">${W ? 'SW 비스듬' : 'SE 비스듬'}</figure>
        <figure><img src="${c.img[1]}" alt="${c.ko} ${W ? '서' : '동'}">${W ? 'W 옆' : 'E 옆'}</figure>
      </div>
      <div class="info">
        <h2>${c.ko}<small>${esc(c.en)}</small></h2>
        <div class="role">${c.no} · ${c.grp} · ${esc(c.title)}</div>
        <div class="pills">
          <span class="pill on">${c.combat ? '전투' : '비전투'}</span>
          <span class="pill">방향 ${W ? '서 / 남서' : '동 / 남동'}</span>
          <span class="pill">${c.rows.length}줄</span>
          <span class="pill">${c.cost}회</span>
        </div>
      </div>
    </div>
    <details><summary>근거와 설정 (Subject 포함)</summary><ul>${c.meta.map(m => `<li>${esc(m)}</li>`).join('')}</ul></details>
    ${c.notes.length ? `<div class="notes"><b>합계 · 걱정되는 점</b><ul>${c.notes.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
    <div class="tbl"><table><thead><tr><th>#</th><th>동작 · 키</th><th>방향</th><th>장</th><th>회수</th><th>프롬프트 (한글 뜻 · 영어 입력문)</th></tr></thead><tbody>${rows}</tbody></table></div>
  </article>`;
  document.querySelectorAll('.cp').forEach(b => b.onclick = async () => {
    const t = b.parentElement.firstChild.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = '복사됨'; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(b.parentElement.firstChild); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨'; }
    setTimeout(() => b.textContent = '복사', 1200);
  });
}
list();
let start = null; try { start = localStorage.getItem('mv-cur') } catch (e) {}
show(start || '1.1');
</script>
