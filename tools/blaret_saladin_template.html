<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>블라렛·살라딘 동작 시연판</title>
<style>
  :root { color-scheme: dark; --void: #1A2226; --sunk: #151C1F; --panel: #232D32; --panel2: #2C383E; --line: #3a4850; --tx: #e8e6e0; --dim: #9aa3ad; --acc: #9fd0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--void); color: var(--tx); font: 14px/1.5 system-ui, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 10px 16px 40px; }
  h1 { font-size: 17px; margin: 6px 0 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tabs button, .bar button { background: var(--panel2); color: var(--tx); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tabs button.on { background: #4a5a68; border-color: #6a7a88; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--sunk); outline: 1px solid var(--line); overflow: hidden; }
  .stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 8px 0; }
  .bar label { white-space: nowrap; }
  #info { color: var(--acc); }
  .grp { margin: 16px 0 4px; font-size: 15px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .clip { background: var(--panel); border-radius: 8px; padding: 6px; cursor: pointer; border: 1px solid transparent; }
  .clip.on { border-color: #6a8aa8; background: var(--panel2); }
  .clip canvas { width: 100%; aspect-ratio: 256/176; background: #3a444c; image-rendering: pixelated; border-radius: 4px; }
  .clip b { display: block; font-size: 12px; line-height: 1.3; margin-top: 4px; word-break: keep-all; }
  .clip small { color: var(--dim); }
  @media (max-width: 640px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bar { gap: 6px 10px; font-size: 13px; } }
</style>
<div class="wrap">
  <h1>블라렛·살라딘 동작 시연판</h1>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <div class="stage"><canvas id="c" width="960" height="540"></canvas></div>
  </div>
  <div class="bar">
    <button id="prev">◀ 한 장</button><button id="play">일시정지</button><button id="next">한 장 ▶</button>
    <label>속도 <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option></select></label>
    <label>배경 <select id="bg"><option value="corr">관리국 복도</option><option value="dark">거의 검정</option><option value="grey">중간 회색</option></select></label>
    <label><input type="checkbox" id="cmp"> 쟈알디와 나란히</label>
    <label><input type="checkbox" id="tint" checked> 군세 푸른빛</label>
    <label><input type="checkbox" id="hit" checked> 피해 장 표시</label>
    <label><input type="checkbox" id="flip"> 왼쪽 보기</label>
    <span id="info"></span>
  </div>
  <div id="lists"></div>
</div>
<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const load = src => { const im = new Image(); im.src = src; return im; };
const JY = load(DATA.jyaldi), A2 = DATA.a2 ? load(DATA.a2) : null;
DATA.chars.forEach(ch => ch.clips.forEach(c => c.im = load(c.img)));
let cur = 0, clip = null, fi = 0, acc = 0, playing = true, last = performance.now(), flash = 0;

function tabs() {
  $('tabs').innerHTML = '';
  DATA.chars.forEach((ch, i) => {
    const b = document.createElement('button'); b.textContent = ch.name + ' · ' + ch.clips.length;
    b.className = i === cur ? 'on' : ''; b.onclick = () => { cur = i; tabs(); lists(); pick(DATA.chars[i].clips[0]); };
    $('tabs').appendChild(b);
  });
}
function lists() {
  const ch = DATA.chars[cur], box = $('lists'); box.innerHTML = '';
  for (const kind of ['전투', '상호']) {
    const cs = ch.clips.filter(c => c.kind === kind); if (!cs.length) continue;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = kind === '전투' ? '전투·스킬' : '상호작용(던전·상인·동행)'; box.appendChild(h);
    const l = document.createElement('div'); l.className = 'list'; box.appendChild(l);
    cs.forEach(c => {
      const d = document.createElement('div'); d.className = 'clip'; d.dataset.k = c.key;
      const t = document.createElement('canvas'); t.width = c.w; t.height = c.h; c.thumb = t;
      d.appendChild(t);
      const b = document.createElement('b'); b.textContent = c.title; d.appendChild(b);
      const s = document.createElement('small'); s.textContent = (c.label ? c.label + ' · ' : '') + c.frames + '장' + (c.loop ? ' · 반복' : ''); d.appendChild(s);
      d.onclick = () => pick(c); l.appendChild(d);
    });
  }
  mark();
}
function mark() { document.querySelectorAll('.clip').forEach(d => d.classList.toggle('on', clip && d.dataset.k === clip.key)); }
function pick(c) { clip = c; fi = 0; acc = 0; playing = true; $('play').textContent = '일시정지'; mark(); }

function bg() {
  const W = cv.width, H = cv.height, v = $('bg').value;
  if (v === 'dark') { g.fillStyle = '#0c0f11'; g.fillRect(0, 0, W, H); return; }
  if (v === 'grey') { g.fillStyle = '#6a7076'; g.fillRect(0, 0, W, H); return; }
  g.fillStyle = '#2a3236'; g.fillRect(0, 0, W, H * 0.62);
  g.fillStyle = '#323c41'; for (let x = 0; x < W; x += 120) g.fillRect(x + 8, 40, 104, H * 0.62 - 70);
  g.fillStyle = '#1f2629'; g.fillRect(0, H * 0.62, W, H * 0.38);
  g.fillStyle = '#262e32'; for (let x = 0; x < W; x += 64) g.fillRect(x, H * 0.62, 2, H * 0.38);
}
// 그림 한 장을 발 기준점(foot)에 맞춰 그림. 군세는 엔진처럼 푸른 반투명 막을 덮어 봄.
const tmp = document.createElement('canvas'), tg = tmp.getContext('2d');
function drawFrame(im, sx, sw, sh, footX, footY, k, flip, spirit) {
  tmp.width = sw; tmp.height = sh; tg.imageSmoothingEnabled = false; tg.clearRect(0, 0, sw, sh);
  tg.drawImage(im, sx, 0, sw, sh, 0, 0, sw, sh);
  if (spirit && $('tint').checked) {
    tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = 'rgba(110,170,255,.55)'; tg.fillRect(0, 0, sw, sh);
    tg.globalCompositeOperation = 'source-over';
  }
  g.save(); g.globalAlpha = spirit && $('tint').checked ? 0.78 : 1;
  g.translate(footX, footY); if (flip) g.scale(-1, 1);
  g.drawImage(tmp, -clip.foot[0] * k, -clip.foot[1] * k, sw * k, sh * k); g.restore();
}
function render() {
  bg(); if (!clip) return;
  const ch = DATA.chars[cur], k = 3, floor = cv.height * 0.86, flip = $('flip').checked;
  const cx = $('cmp').checked ? cv.width * 0.62 : cv.width * 0.5;
  if ($('cmp').checked) {
    // 쟈알디 대기 장(같은 바닥선·같은 배율). 쟈알디 원본은 192×144, 발 (57,136)
    g.save(); g.translate(cv.width * 0.22, floor); g.drawImage(JY, -57 * k, -136 * k, JY.width * k, JY.height * k); g.restore();
    g.fillStyle = '#9aa3ad'; g.font = '14px system-ui'; g.fillText('쟈알디(색감 기준)', cv.width * 0.22 - 50, floor + 30);
  }
  if (clip.im.complete) drawFrame(clip.im, fi * clip.w, clip.w, clip.h, cx, floor, k, flip, ch.spirit);
  if ($('hit').checked && clip.hits.includes(fi)) {
    g.strokeStyle = 'rgba(255,120,100,.9)'; g.lineWidth = 4; g.strokeRect(4, 4, cv.width - 8, cv.height - 8);
    g.fillStyle = '#ff9a8a'; g.font = 'bold 16px system-ui'; g.fillText('피해 판정 장', 16, 28);
  }
  $('info').textContent = `${ch.name} · ${clip.title} · ${fi + 1}/${clip.frames}장 · ${clip.fps}fps${clip.loop ? ' · 반복' : ''}`;
}
function thumbs() {
  DATA.chars[cur].clips.forEach(c => {
    if (!c.thumb || !c.im.complete) return;
    const t = c.thumb.getContext('2d'), n = Math.floor(performance.now() / (1000 / c.fps)) % c.frames;
    t.clearRect(0, 0, c.w, c.h); t.drawImage(c.im, n * c.w, 0, c.w, c.h, 0, 0, c.w, c.h);
  });
}
function step(d) {
  if (!clip) return;
  fi += d;
  if (fi >= clip.frames) fi = clip.loop ? 0 : (setTimeout(() => { if (clip) { fi = 0; } }, 500), clip.frames - 1);
  if (fi < 0) fi = clip.frames - 1;
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (clip && playing) {
    acc += dt * parseFloat($('speed').value);
    const per = 1 / clip.fps;
    while (acc >= per) { acc -= per; if (fi < clip.frames - 1 || clip.loop) step(1); else { acc = -0.5; fi = 0; } }
  }
  render(); thumbs(); requestAnimationFrame(loop);
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '일시정지' : '재생'; };
$('prev').onclick = () => { playing = false; $('play').textContent = '재생'; step(-1); };
$('next').onclick = () => { playing = false; $('play').textContent = '재생'; step(1); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').onclick(); if (e.key === 'ArrowLeft') $('prev').onclick(); if (e.key === ' ') { e.preventDefault(); $('play').onclick(); } });
tabs(); lists(); pick(DATA.chars[0].clips[0]); requestAnimationFrame(loop);
</script>
