<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>보스 시연판</title>
<style>
:root{--bg:#151c1f;--panel:#232d32;--panel2:#2c383e;--line:#3a474e;--text:#d9e2e6;--dim:#93a3ab;--signal:#d8b45a;--on-signal:#1a1408}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header button{flex:none;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
header button.on{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:700}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.stage{background:#0e1416;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
canvas{display:block;width:100%;image-rendering:pixelated}
.title{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.title b{font-size:17px}.title span{color:var(--dim);margin-left:8px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:calc(100vh - 90px);overflow:auto}
.ph{color:var(--dim);font-size:12px;margin:10px 4px 4px}
.clips{display:flex;flex-wrap:wrap;gap:6px}
.clips button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
.clips button.on{border-color:var(--signal);color:var(--signal)}
.ctl{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ctl label{color:var(--dim);display:flex;gap:6px;align-items:center}
.note{color:var(--dim);font-size:12px;padding:0 12px 10px}
</style></head><body>
<header id="tabs"></header>
<main>
 <section class="stage">
  <div class="title"><b id="bname"></b><span id="bsub"></span></div>
  <canvas id="cv" width="640" height="300"></canvas>
  <div class="ctl"><label><input type="checkbox" id="scale" checked> 쟈알디 함께 보기</label>
   <label>속도 <input type="range" id="spd" min="4" max="16" value="9"></label><span id="info" style="color:var(--dim)"></span></div>
 </section>
 <aside class="side" id="side"></aside>
</main>
<script>
const D=/*DATA*/null;
const RIGS={};
/*RIGS*/
const cv=document.getElementById('cv'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const IM={};function im(src){if(!IM[src]){const i=new Image();i.src=src;IM[src]=i}return IM[src]}
const jy=im(D.jy);
let cur=null,clip=null,frame=0,acc=0,last=0,t0=0;
const bosses=[...D.sprites.map(s=>({kind:'sprite',...s})),...Object.entries(RIGS).filter(([k,r])=>r.ready?r.ready(D.parts):true).map(([k,r])=>({kind:'rig',id:k,name:r.name,sub:r.sub,rig:r}))];
const tabs=document.getElementById('tabs');
bosses.forEach((b,i)=>{const e=document.createElement('button');e.textContent=b.name;e.onclick=()=>pick(i);tabs.appendChild(e)});
function pick(i){cur=bosses[i];[...tabs.children].forEach((e,j)=>e.classList.toggle('on',j==i));
 document.getElementById('bname').textContent=cur.name;document.getElementById('bsub').textContent=cur.sub||'';
 const side=document.getElementById('side');side.innerHTML='';
 const list=cur.kind=='sprite'?cur.clips:cur.rig.moves.map(m=>({ph:m.ph,id:m.id,name:m.name,loop:m.loop}));
 let ph=null,box=null;
 list.forEach((c,j)=>{if(c.ph!==ph){ph=c.ph;const h=document.createElement('div');h.className='ph';h.textContent=ph+'단계'.replace(/^/,'');h.textContent=ph;side.appendChild(h);box=document.createElement('div');box.className='clips';side.appendChild(box)}
  const b=document.createElement('button');b.textContent=c.name;b.onclick=()=>play(j);box.appendChild(b)});
 play(0)}
function play(j){const list=cur.kind=='sprite'?cur.clips:cur.rig.moves;clip=list[j];frame=0;acc=0;t0=performance.now();
 [...document.querySelectorAll('.clips button')].forEach((e,k)=>e.classList.toggle('on',k==j))}
function tick(t){const dt=Math.min(100,t-(last||t));last=t;const fps=+document.getElementById('spd').value;
 cx.fillStyle='#0e1416';cx.fillRect(0,0,cv.width,cv.height);
 const G=cv.height-24;cx.fillStyle='#1e282c';cx.fillRect(0,G,cv.width,cv.height-G);cx.fillStyle='#2f3c42';cx.fillRect(0,G,cv.width,1);
 if(document.getElementById('scale').checked&&jy.complete)cx.drawImage(jy,40-35,G-136,192,144);
 if(cur&&clip){
  if(cur.kind=='sprite'){acc+=dt;const step=1000/fps;while(acc>=step){acc-=step;frame++;if(frame>=clip.n){frame=clip.loop?0:clip.n-1;if(!clip.loop&&acc>600){frame=0;acc=0}}}
   const s=im(clip.src);if(s.complete){const x=Math.round(cv.width/2-clip.w/2+60),y=G-cur.foot,f=frame%clip.n;
    const prop=far=>(clip.props||[]).forEach(([pb,pn,side,da,ax,ay,sc])=>{if((side=='LEFT')!=far)return;const k=clip.kp&&clip.kp[Math.min(f,clip.kp.length-1)];if(!k)return;
     const w=k[side+' WRIST'],e=k[side+' ELBOW'];if(!w||!e)return;const a=Math.atan2(w[1]-e[1],w[0]-e[0])+da*Math.PI/180;
     const pp=D.parts[pb]||{};const key=Object.keys(pp).find(n=>n.startsWith(pn+'-'));if(key)bpart(cx,im(pp[key]),x+w[0],y+w[1],a,ax,ay,sc)});
    prop(true);cx.drawImage(s,f*clip.w,0,clip.w,clip.h,x,y,clip.w,clip.h);prop(false)}
   document.getElementById('info').textContent=`${frame+1}/${clip.n}장`}
  else{const el=(t-t0)/1000*fps/9;cur.rig.draw(cx,clip,el,{G,W:cv.width,H:cv.height,parts:D.parts[cur.id]||{},im});document.getElementById('info').textContent=''}
 }
 requestAnimationFrame(tick)}
if(bosses.length)pick(0);requestAnimationFrame(tick);
</script></body></html>
