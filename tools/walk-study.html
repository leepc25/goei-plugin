<main><header><h1>1단계 · 정지 → 걷기 → 정지</h1><p>화면을 누른 뒤 방향키로 이동하세요. 파란 선은 바닥, 노란 선은 정지 자세의 정수리 기준입니다.</p></header>
<canvas width="1280" height="720" tabindex="0" aria-label="방향키 걷기 검수 화면"></canvas>
<div id="status">불러오는 중</div>
